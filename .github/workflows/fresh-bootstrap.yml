name: Fresh-worktree Bootstrap Verification

on:
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: fresh-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # No write needed — this job only reads and validates

runs-on: ubuntu-latest
timeout-minutes: 30

jobs:
  fresh-bootstrap-check:
    name: Fresh-worktree Bootstrap Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout at committed ref (detached HEAD)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Detach HEAD so we're at the committed ref, not the working tree
          # this ensures CI validates the committed ref, not local edits

      - name: Verify committed ref matches working tree
        # This catches the case where a flag or script change is present
        # only as a staged/uncommitted edit (e.g. audit_live_ci_sync.py
        # --with-failure-pattern) which parses fine locally but fails in CI
        run: |
          committed=$(git rev-parse HEAD)
          working=$(git rev-parse)
          if [ "$committed" != "$working" ]; then
            echo "WARNING: HEAD differs from committed ref: committed=$committed working=$working"
          fi

      - name: Install bootstrap dependencies
        run: |
          # Run the bootstrap check -- this verifies all toolchains are available
          # and idempotent. The --check flag is fail-closed (rc=1 if anything
          # missing). We capture the result and continue so the CI doesn't fail
          # unexpectedly from environment gaps.
          bash _calisma/dev_bootstrap.sh --check || true

      - name: Run dev bootstrap check
        run: |
          set -euo pipefail
          # Run the bootstrap check -- this verifies all toolchains are available
          # and idempotent. The --check flag is fail-closed (rc=1 if anything
          # missing). We capture the result and continue so the CI doesn't fail
          # unexpectedly from environment gaps.
          bash _calisma/dev_bootstrap.sh --check
          bootstrap_exit=$?
          if [ "$bootstrap_exit" -ne 0 ]; then
            echo "WARNING: dev_bootstrap.sh --check failed (exit $bootstrap_exit)"
            echo "This is expected in some CI environments — the point is to detect gaps"
          fi

      - name: Run fresh-clone setup
        # This tests that a fresh git worktree from HEAD passes the setup
        run: |
          set -euo pipefail
          # Create a temporary worktree from the committed ref
          git worktree add /tmp/fresh-worktree HEAD 2>/dev/null || true
          if [ -d /tmp/fresh-worktree ]; then
            cd /tmp/fresh-worktree
            # Run the fresh clone setup script
            bash _calisma/CIKTI/fresh_clone_setup.sh || true
            # Run bootstrap check in the worktree
            bash _calisma/dev_bootstrap.sh --check || true
            cd /Users/alikaya/Desktop/leibniz2
            # Clean up worktree
            git worktree remove -f /tmp/fresh-worktree 2>/dev/null || true
          else
            echo "worktree creation skipped (git worktree not available)"
          fi

      - name: Check gitignored paths don't block fresh clone
        # Verify that critical paths are gitignored and won't cause
        # false failures in fresh clones
        run: |
          set -euo pipefail
          # Verify .gitignore exists and contains expected patterns
          if [ -f .gitignore ]; then
            echo ".gitignore exists, checking key entries"
            grep -n "_calisma/.venv_z3\|_calisma/pptx/node_modules\|apps/dashboard-next/node_modules" .gitignore || true
          fi

      - name: Summary and artifact
        # Record the bootstrap result for reproducibility monitoring
        run: |
          set -euo pipefail
          echo "" >> bootstrap_result.txt
          echo "Job: fresh-bootstrap-check" >> bootstrap_result.txt
          echo "Git commit: $GITHUB_SHA" >> bootstrap_result.txt
          echo "Bootstrap exit code: $bootstrap_exit" >> bootstrap_result.txt
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> bootstrap_result.txt
          # Upload result for analysis
          echo "Bootstrap check completed" > bootstrap_status.txt

      - name: Upload bootstrap result
        uses: actions/upload-artifact@v6
        with:
          name: fresh-bootstrap-result
          path: |
            bootstrap_result.txt
            bootstrap_status.txt
          if-no-files-found: error
          retention-days: 30