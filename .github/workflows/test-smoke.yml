# test-smoke.yml — check_python3_shell.py glob modu için minimal workflow.
# Bu dosyanın CI'daki tek görevi workflow listesinde VAR OLMAK: glob modu
# (.github/workflows/*.yml) yeni dosyaları otomatik yakalar (pinned test).
# No-op job, GitHub'un boş workflow'u geçersiz saymasını engelleyen
# doğruluk shim'idir.
name: test-smoke
on:
  push:
  # BOT BİRLEŞTİRME FALLBACK'İ (2026-10-25): `app/github-actions`'ın
  # GITHUB_TOKEN ile yaptığı merge'ler push tetiklemez (GitHub kuralı —
  # 9657090d'de üç kanıt workflow'u da koşmadı). Elle tam tetikleme:
  # `gh workflow run test-smoke.yml --ref main`. verify-delivery ve
  # docker-security'de `workflow_dispatch` zaten vardı; bu satır üçlemeyi
  # bot-merge senaryosunda da eksiksiz kılar (AGENTS.md kanıt hücreleri).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # CI-hijyen: no-op bile olsa workflow hijyen matrisine tabidir.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  noop:
    name: smoke-noop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No-op
        run: echo "smoke test"
