name: docker-security

on:
  push:
  pull_request:
    # PR'lar aynı fail-closed Trivy gate'inden geçer; SARIF → PR-diff yorumu
    # (trivy_sarif_pr_comment.js) bulguları değişen dosyalara haritalar.
    # draft: true — kapı davranışı aynı; yorumlar draft aşamasında da
    # upsert edilir (erkenden görünürlük, bayat-yorum yok — marker upsert).
  schedule:
    # Haftalık: her Pazartesi 03:43 UTC. Determinism-trend (03:17) ile bilinçli
    # çakışmaz. Yeni CVE'ler en çok hazırlıksız anda gelir — gating doc'unun
    # "Trivy gate kırmızı" döngüsünün CI bacağı haftalık kendi başına koşar.
    - cron: "43 3 * * 1"
  workflow_dispatch: {}  # CVE tazelemesi gibi olaylarda elle tetikleme

permissions:
  contents: read
  security-events: write

concurrency:
  # CI-hijyen: aynı PR'a ardışık push'lar eski taramayı iptal eder.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-scan:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level daraltma: PR-yorum adımı (trivy_sarif_pr_comment.js)
    # pull-requests: write gerektirir — workflow-bazı değildir, yalnız bu
    # job'un tarama+yorum yüzeyine verilir (en-yetkili-olmayan).
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: leibniz2/verify-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── İki-adımlı Trivy: SARIF (yorum-kaynağı) + table (log-kanıtı) ──
      # SARIF adımı continue-on-error: bulgu varsa exit 1 üretir ama koşum
      # SARIF'i diskte bıraksın diye; GERÇEK kapı yorum-adımındaki
      # core.setFailed'de yaşar (SARIF okunamazsa da kırmızı — fail-closed).
      - name: Scan image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          image-ref: leibniz2/verify-dashboard:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan image with Trivy (table — log kanıtı)
        # v0.35.0: belgelenmiş güvenli sürüm (2026-03 tag-compromise sonrası
        # akıl sağlığı listesi). Mutable @master asla — pin kapısı da bloke eder.
        # Zorlayıcı kapı exit-code 1'de; SARIF yorum-adımına kanıt taşır.
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: leibniz2/verify-dashboard:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Annotate PR with Trivy findings (fail-closed)
        # always(): gate kırmızıyken de yorum DÜŞMELİ (bulgu-tablosu PR'a
        # görünür kalmalı) — aksi halde kırmızı PR'da kanıt yok olur.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const changed = await github.paginate(
              github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.issue.number, per_page: 100,
              },
              (resp) => resp.data.map((f) => f.filename));
            require('fs').writeFileSync('changed_files.txt',
              changed.join('\n'));
            const sBody = fs.readFileSync(
              '_calisma/CIKTI/github_scripts/trivy_sarif_pr_comment.js', 'utf8');
            await eval(`(async () => {\n${sBody}\n})()`);

      # Docker Scout kaldırıldı: Scout, Docker entitlemansı gerektirir
      # ('user githubactions not entitled to use Docker Scout') — bu repoda
      # kimse yok ve adım hiçbir koşuda geçemezdi. Zorlayıcı CVE taraması
      # yukarıdaki Trivy gate'te yaşıyor (CRITICAL/HIGH, exit-code 1).
      # (SARIF upload da kaldırıldı: code scanning hedefi yok.)

  smoke:
    name: Local security smoke (script parity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SKIP kuralı runner araçlarıyla uyumlu: ubuntu-latest'te docker ve
      # trivy YOKTUR; script'in "araç yok → exit 0 SKIP" sözleşmesiyle job
      # bilinçli SKIP üretir (görünür, loglanır — sessiz kanıt kaybı değil).
      # Aksi halde görünümlü yeşil her hafta SKIP'i gizlerdi. Kurulacak olsaydı
      # (trivy-action image-ref yüzeyi gibi) job gerçek koşum kanıtı üretirdi.
      # Bu satır K3 sözleşmesinin adım-düzeyi kanıtıdır.
      - name: Run local security smoke (SKIP-aware)
        run: bash _calisma/CIKTI/docker_security_smoke.sh
        env:
          DOCKER_SMOKE_OUT: docs/ci_simulate/docker_security_smoke/docker_security_smoke_report.txt

      - name: Show smoke evidence
        if: always()
        run: |
          cat docs/ci_simulate/docker_security_smoke/docker_security_smoke_report.txt 2>/dev/null \
            || echo "(smoke kanıt dosyası yok — SKIP koşumunda üretilmez)"
