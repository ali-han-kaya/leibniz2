name: determinism-trend

on:
  schedule:
    # Haftalık: her Pazartesi 03:17 UTC. Repo'nun İLK schedule tetikleyicisi —
    # tectonic/TeXLive kanonik hash'lerinin oturumlar arası kararlılığını
    # izleyen trend kaydını sürdürür (record_determinism_trend.py).
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    name: Run determinism experiment and record trend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # tectonic: GitHub release'ten sabit sürüm + sha256 digest (tedarik
      # zinciri pini — 0.17.0 x86_64-unknown-linux-musl; digest release
      # API'sinden 2026-09-17'de kanıtlandı). Lokal ölçümle aynı motor
      # sürümü → trend karşılaştırılabilirliği korunur.
      - name: Install tectonic (pinned, digest-verified)
        run: |
          set -euo pipefail
          TECTONIC_VERSION="0.17.0"
          TECTONIC_SHA256="8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7"
          curl -sL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/tectonic.tar.gz
          echo "${TECTONIC_SHA256}  /tmp/tectonic.tar.gz" | sha256sum -c -
          mkdir -p /tmp/tectonic-bin
          tar -xzf /tmp/tectonic.tar.gz -C /tmp/tectonic-bin
          sudo mv /tmp/tectonic-bin/tectonic /usr/local/bin/tectonic
          tectonic --version

      # cm-super ŞART: T1 fontenc paketleri yokken mktexpk METAFONT bitmap
      # üretir — her koşumda dakikalar + bitmap hash sapması (ölçüldü).
      # python3'ü setup-python sağlar (deney + trend script'i kullanır).
      - name: Install TeXLive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended cm-super
          pdflatex --version | head -1

      # Deney: iki bağımsız SDE koşumu + kanonik (/ID nötr) karşılaştırma.
      # env semantiği: TEXLIVE_BIN = bin DİZİNİ, TECTONIC_BIN = ikili YOL.
      - name: Run determinism experiment (two independent SDE runs)
        run: |
          set -euo pipefail
          TEXLIVE_BIN="$(dirname "$(command -v pdflatex)")"
          TECTONIC_BIN="$(command -v tectonic)"
          TEXLIVE_BIN="$TEXLIVE_BIN" TECTONIC_BIN="$TECTONIC_BIN" \
            bash _calisma/CIKTI/texlive_determinism_test.sh
          echo '--- evidence ---'
          cat docs/ci_simulate/texlive_determinism/texlive_determinism_report.txt

      # Kanıt dosyası gitignore'da (docs/ci_simulate/) — koşum başına üretimi
      # yansıtır. Trend ise versiyonlu konumdadır (docs/determinism_trend/).
      - name: Record trend measurement
        run: |
          set -euo pipefail
          python3 _calisma/CIKTI/record_determinism_trend.py --update
          echo '--- trend tail ---'
          tail -1 docs/determinism_trend/determinism_trend.jsonl

      # Canvas ailesi (Incidental Proof) — MATRİS PARAMETRESİ = kaynak listesi
      # (env CANVAS_SOURCES): BEŞ kaynak, her biri iki bağımsız SDE koşumu,
      # TEK job'da beş ayrı rapor. `strategy.matrix` bilinçle KULLANILMADI:
      # matris kaynak başına ayrı job açardı (dört-beş raporu tek trend
      # kaydına bağlamak artifact toplama + ikinci push yarışı demek) —
      # tek job'daki döngü tek tectonic kurulumunu ve sıralı `--check`'i korur.
      #
      # Trende GİREN TEK satır yine KİTAP (apex) raporundan gelir (tek satır
      # sözleşmesi): kitap dört levhayı \includegraphics ile gömer, yani aileyi
      # transitif kapsar. Diğer dört rapor kanıt katmanıdır: herhangi biri
      # verdict=PASS değilse job kırmızıdır.
      #
      # Motor: yukarıdaki TEK tectonic kurulumunu paylaşır (sürüm + sha256
      # digest tek kaynaktadır — Makefile'ın "motor pini tek kaynaktir" sözü);
      # bu adım tectonic KURMAZ, yalnız çağırır. SDE aile SABİTİ bilinçli
      # olarak yazılıdır (1700000000 = docs/Makefile.texlive PLATE_BOOK_EPOCH =
      # canvas_determinism_test.sh varsayımı; üçü test_record_determinism_trend
      # ile kilitli). SOURCE_DATE_EPOCH'tan türetilirse el yazması epoch'u
      # levha PDF'lerini sessizce yeniden damgalar (Makefile'ın adlandırdığı risk).
      #
      # Kaynak listesi docs/Makefile.texlive PLATE_SOURCES + PLATE_BOOK ile
      # BİREBİR aynı olmak zorunda (test_trend_schedule_paths anti-drift):
      # Makefile'a kaynak eklenirse bu liste güncellenmezse kapı kırmızıya
      # döner — iki yerde iki farklı aile listesi yaşayamaz.
      - name: Run canvas determinism experiment (plate-book, 5 kaynak)
        env:
          CANVAS_SOURCES: >-
            incidental_proof_canvas.tex
            incidental_proof_plate02.tex
            incidental_proof_plate03.tex
            incidental_proof_plate04.tex
            incidental_proof_book.tex
        run: |
          set -euo pipefail
          for src in $CANVAS_SOURCES; do
            echo "── canvas determinism: $src"
            SOURCE_DATE_EPOCH="1700000000" \
              TEX_SOURCE="_calisma/CIKTI/canvas/$src" \
              TECTONIC_BIN="$(command -v tectonic)" \
              bash _calisma/CIKTI/canvas_determinism_test.sh
          done
          echo '--- canvas evidence (kaynak başına bir rapor) ---'
          # fail-closed "beş rapor" sözü: her kaynak için rapor VAR ve
          # verdict=PASS. Harness ilk hatada zaten kırmızı döner; bu ikinci
          # denetim "rapor hiç yazılmadı" (derleme düşerse) durumunu kapatır
          # ve sözün kendisini adımın içinde görünür kılar.
          for src in $CANVAS_SOURCES; do
            report="docs/ci_simulate/canvas_determinism/${src%.tex}.determinism.txt"
            test -f "$report" || { echo "FAIL: rapor yok: $report" >&2; exit 1; }
            grep -q '^verdict=PASS' "$report" || { echo "FAIL: verdict PASS değil: $report" >&2; exit 1; }
          done
          grep -h -E '^(source|source_date_epoch|residual|verdict)=' \
            docs/ci_simulate/canvas_determinism/*.determinism.txt

      # İki ölçüm de AYNI koşumda, `--check` ADIMINDAN ÖNCE yapılır: tazelik
      # ve platform kapsamı aile başına denetlendiği için sıralama sözleşmedir
      # (bir aile tazelenmeden doğrulanırsa kendi kendine kırmızı) —
      # test_trend_schedule_paths.py sırayı kilitler.
      - name: Record canvas trend measurement
        run: |
          set -euo pipefail
          python3 _calisma/CIKTI/record_determinism_trend.py --update --family canvas
          echo '--- trend tail ---'
          tail -1 docs/determinism_trend/determinism_trend.jsonl

      # Trend değişmezleri (fail-closed): tazelik + kaynak-uzlaşma (aynı
      # platform, değişmemiş kaynak → değişmemiş kanonik hash; ihlal = motor
      # determinizmi sapması → KIRMIZI) + platform kapsamı (darwin+linux).
      - name: Validate trend invariants
        run: |
          set -euo pipefail
          python3 _calisma/CIKTI/record_determinism_trend.py --check

      # Kayıt yolu: main'e bare push branch-protection'a (GH006) takılır
      # (koşum 35580855610 kanıtı: deney+ölçüm PASS, push failure) → kayıt
      # bot-dalı + PR yoluyla main'e iner.
      #
      # 2026-10-05 düzeltmesi — ölçümün DALDA KALIP KAYBOLMASI:
      # `gh pr create` repo ayarı yüzünden yetkisiz (koşum 37297101317:
      # "GraphQL: GitHub Actions is not permitted to create ..."). Eski adım
      # bunu `|| echo` ile yutup 0 dönüyordu; sonuç: koşum YEŞİL, kayıt
      # bot-dalında sıkışık (main 6 satır / dal 7 satır, 5 Ekim ölçümü
      # main'de yok) ve sonraki `--force` push o ölçümü kalıcı olarak silerdi.
      # İki düzeltme:
      #   (1) KAYIP KORUMASI — dalda main'de olmayan kayıt varsa üstüne
      #       yazılmaz; kayıtlar birleştirilir (sort -u, JSONL satırı tam
      #       eşleşmesi) ve push onları da taşır.
      #   (2) FAIL-CLOSED — PR yolu kurulamazsa adım 1 döner. "Ölçüm merge
      #       yolunda değil" başarı değildir; sessiz kayıp olayın kendisidir.
      - name: Commit trend record
        env:
          TREND_BRANCH: chore/determinism-trend-record
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RECORD="docs/determinism_trend/determinism_trend.jsonl"
          git add "$RECORD"
          if git diff --cached --quiet; then
            echo "FAIL: --update ekleme yaptı ama stage boş — beklenmedik durum"
            exit 1
          fi
          git commit -m "chore: record weekly determinism trend measurement" -m "TeXLive+SDE experiment (two independent SDE runs) on ubuntu-latest with pinned tectonic 0.17.0 (release digest verified) and TeXLive pdflatex; plus the canvas family apex (plate-book) canonical hash from canvas_determinism_test.sh; canonical hashes appended to docs/determinism_trend/determinism_trend.jsonl." -m "Generated with GitHub Actions. Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # (1) Kayıp koruması: bot dalında, main'de olmayan kayıt varsa
          #     üstüne yazma — hepsini birleştirip aynı commit'te taşı
          #     (trend_record_merge.py: JSONL satırı tam metin kimliktir).
          if git fetch --depth=1 origin "$TREND_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:$RECORD" > /tmp/trend_branch.jsonl 2>/dev/null || true
            python3 _calisma/CIKTI/trend_record_merge.py \
              --branch-file /tmp/trend_branch.jsonl --record "$RECORD" | tee /tmp/merge.out
            if grep -qv '^0$' /tmp/merge.out; then
              echo "NOT: dalda main'de olmayan kayıt vardı; push onları da taşıyor (ölçüm kaybı koruması)"
              git add "$RECORD"
              if git diff --cached --quiet; then
                echo "FAIL: kayıt birleştirme sonrası stage boş — beklenmedik durum"
                exit 1
              fi
              git commit --amend --no-edit
            fi
          fi
          git push --force origin "HEAD:$TREND_BRANCH"

          # (2) Fail-closed: kayıt main'e girecek bir yol bulmadan yeşil çıkma.
          PR=$(gh pr list --head "$TREND_BRANCH" --state open --json number --jq '.[0].number // ""')
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$TREND_BRANCH" --title "chore: weekly determinism trend record (bot)" --body "Automated weekly determinism trend measurement (linux baseline; families: manuscript tectonic+TeXLive and canvas plate-book — 5 sources measured, apex hash recorded). Canonical hashes in docs/determinism_trend/determinism_trend.jsonl." || true
            PR=$(gh pr list --head "$TREND_BRANCH" --state open --json number --jq '.[0].number // ""')
          else
            # PR zaten açıksa yenisini açma; sadece "yeni ölçüm düştü"
            # sinyalini bırak ki insana görünür olsun (fail-closed
            # değişikliğinde bu dal bilinçli olarak korundu).
            gh pr comment "$PR" --body "New measurement appended (run ${GITHUB_RUN_ID:-unknown})."
          fi
          if [ -z "$PR" ]; then
            echo "FAIL: trend kaydı için PR yolu kurulamadı — ölçüm main'e girmedi."
            echo "      Sebep büyük olasılıkla repo ayarı: Settings → Actions →"
            echo "      'Allow GitHub Actions to create and approve pull requests' kapalı."
            echo "      Kayıt bot-dalında GÜVENDE ama merge bekliyor:"
            echo "      gh pr create --base main --head $TREND_BRANCH"
            echo "      gh pr merge <N> --auto"
            exit 1
          fi
          gh pr merge "$PR" --auto --merge || {
            echo "FAIL: auto-merge kuyruğa alınamadı (PR #$PR açık, kayıt merge bekliyor)"
            exit 1
          }

      # Fail-closed tamamlama: yeşil = deney PASS + uzlaşma OK + kayıt
      # işlendi. Kırmızı = deney fail-closed, uzlaşma ihlali ya da izin
      # sorunu — trend sapması ilk haftada görünür.
      - name: Summary
        if: always()
        run: |
          echo "## determinism-trend" >> "$GITHUB_STEP_SUMMARY"
          tail -1 docs/determinism_trend/determinism_trend.jsonl >> "$GITHUB_STEP_SUMMARY" \
            || echo "(trend kaydı yok)" >> "$GITHUB_STEP_SUMMARY"
