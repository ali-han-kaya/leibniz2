name: vercel-preview-deploy

# Native git-connect engelli (Login Connection 400 — docs/VERCEL_DEPLOYMENT.md
# §Fallback hattı): push, Vercel'in kendi git entegrasyonu yerine CI'dan
# `vercel deploy` ile preview üretir. Doğrulama, aylık vercel-deploy-check ile
# AYNI kapı script'ini (check_vercel_deploy.py) yeni preview'a karşı koşar —
# kapı-paritesi (K1); ayrıca trend/determinism-trend JSON sağlığı eklenir.
#
# Sabit preview alias'ı: her deploy'dan sonra `leibniz2-preview.vercel.app`
# yeni deployment'a yönlendirilir ve alias'ın /api/health'i 200 dönmesi
# beklenir. Aylık `vercel-deploy-check` bu sabit adı denetler
# (vars.VERCEL_PREVIEW_URL) — Vercel API'sine/token'a bağlı kalmaz. Alias
# güncellenemezse bu job kırmızı olur: sessiz bayat alias, aylık kapının eski
# bir deployment'ı "preview sağlıklı" diye raporlaması demektir.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # CI-hijyen: ref başına tek koşum; üst üste binen push'lar eskisini iptal eder.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview deploy + 4 /api ucu (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Vercel CLI (pinli surum)
        run: |
          set -euo pipefail
          npm install --global vercel@59.10.0
          vercel --version

      # Token kapsamı ön kontrolü (fail-closed). Neden: `vercel link`
      # düştüğünde Vercel yalnız "You do not have access to the specified
      # account" + err.sh bağlantısı verir; logdan hangi hesaptan token
      # üretileceği okunamaz (2026-10-24, run 40044149599). Bu adım dört
      # durumu AYIRT eder ve düzeltmeyi adıyla söyler. Token hiçbir yere
      # yazılmaz — yalnız HTTP durum kodları, hata kodu ve takım adları loga
      # çıkar. Ölçülemeyen her durum KIRMIZI (sessiz PASS yok).
      - name: Token kapsami on kontrolu (fail-closed)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DOC="docs/VERCEL_DEPLOYMENT.md, Token bolumu"
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN secret yok — repo Settings > Secrets and variables > Actions > New secret. Token'i sarkis-env UYESI olan hesaptan uret ($DOC)."
            exit 1
          fi
          rm -f /tmp/vercel_user.json
          user_code=$(curl -s -o /tmp/vercel_user.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user)
          user_verdict=$(python3 - "$user_code" <<'PY'
          import json, sys
          code = sys.argv[1]
          try:
              err = (json.load(open("/tmp/vercel_user.json")) or {}).get("error") or {}
          except Exception:
              err = {}
          # Olculdu: Vercel OLU token'a 401 degil 403 + {"invalidToken": true}
          # doner. 403'u kosulsuz "kapsam" saymak yanlis teshis uretir; tersine
          # mesaj metnine bakmak ("not authorized") kapsam reddini olu token
          # sanar. Bu yuzden karar YALNIZ yapisal sinyale baglidir:
          # invalidToken bayragi veya 401 -> olu token, 403 (bayraksiz) -> kapsam.
          if code == "200":
              print("ok")
          elif err.get("invalidToken") is True or code == "401":
              print("invalid")
          elif code == "403":
              print("scope")
          else:
              print("unmeasured")
          PY
          )
          case "$user_verdict" in
            invalid)
              echo "::error::VERCEL_TOKEN gecersiz veya suresi dolmus (GET /v2/user HTTP $user_code, invalidToken=true) — vercel.com/account/settings/tokens uzerinden yeni token uret, secret'i guncelle ($DOC)."
              exit 1
              ;;
            scope)
              echo "::error::VERCEL_TOKEN gecerli ama hesap kapsamina yetmiyor (GET /v2/user HTTP 403, invalidToken yok): project-only ya da daraltilmis token. Token kapsami 'sarkis-env' (Team) veya Full Account olmali ($DOC)."
              exit 1
              ;;
            ok) ;;
            *)
              echo "::error::On kontrol olculemedi: GET /v2/user HTTP $user_code (fail-closed)."
              exit 1
              ;;
          esac
          rm -f /tmp/vercel_teams.json
          teams_code=$(curl -s -o /tmp/vercel_teams.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/teams)
          if [ "$teams_code" != "200" ]; then
            echo "::error::VERCEL_TOKEN takim listesini goremiyor (GET /v2/teams HTTP $teams_code). Project-only token kullanici/takim uclarina erisemez; kapsami 'sarkis-env' (Team) veya Full Account yap ($DOC)."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          teams = (json.load(open("/tmp/vercel_teams.json")) or {}).get("teams") or []
          names = {t.get("slug") or t.get("id") or "" for t in teams}
          if "sarkis-env" not in names:
              seen = ", ".join(sorted(n for n in names if n)) or "yok"
              print("::error::VERCEL_TOKEN 'sarkis-env' takimini gormuyor (gorunen: %s). Token'i sarkis-env UYESI hesaptan uret ve kapsamini sarkis-env yap — --scope yetki VERMEZ, secer. Ayrinti: docs/VERCEL_DEPLOYMENT.md, Token bolumu." % seen)
              sys.exit(1)
          print("Token kapsami OK: sarkis-env gorunuyor (%d takim)." % len(teams))
          PY

      - name: Proje linkle (non-interactive)
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret tanimli degil (repo Settings > Secrets)"
            exit 1
          fi
          vercel link --project leibniz2 --scope sarkis-env --yes

      - name: Preview deploy
        id: deploy
        run: |
          set -euo pipefail
          out=$(vercel deploy --yes 2>&1)
          printf '%s\n' "$out"
          url=$(printf '%s\n' "$out" | grep -E 'Preview +https://' \
            | grep -oE 'https://[a-z0-9][a-z0-9.-]*\.vercel\.app' | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::Preview URL cozulemedi"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      # Sabit alias'ı ilerlet (repo variable VERCEL_PREVIEW_URL ile birebir
      # aynı ad). Alias propagation'ı kısa bir poll ile doğrulanır; 200
      # görülmezse job KIRILIR (bayat alias = sessiz yanlış-PASS riski).
      - name: Sabit preview alias (leibniz2-preview.vercel.app)
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          vercel alias set "$PREVIEW_URL" leibniz2-preview.vercel.app \
            --scope sarkis-env
          code=""
          for _ in 1 2 3 4 5; do
            code=$(curl -s -m 15 -o /dev/null -w '%{http_code}' \
              https://leibniz2-preview.vercel.app/api/health || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          if [ "$code" != "200" ]; then
            echo "::error::alias /api/health HTTP ${code:-yok} (alias yayilmadi)"
            exit 1
          fi
          echo "Alias: https://leibniz2-preview.vercel.app -> $PREVIEW_URL" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 4 /api ucu dogrulama (fail-closed)
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          python3 _calisma/CIKTI/check_vercel_deploy.py --base-url "$BASE_URL"
          for ep in trend determinism-trend; do
            code=$(curl -s -m 30 -o "/tmp/$ep.json" -w '%{http_code}' \
              "$BASE_URL/api/$ep")
            if [ "$code" != "200" ]; then
              echo "::error::/api/$ep HTTP $code"
              exit 1
            fi
            if ! python3 -m json.tool "/tmp/$ep.json" > /dev/null; then
              echo "::error::/api/$ep gecerli JSON degil"
              exit 1
            fi
          done
          echo "4 /api ucu YESIL: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"
