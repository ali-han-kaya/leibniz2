name: protection-drift

# Haftalık branch-protection drift denetimi (P1 → kırmızı).
#
# NEDEN AYRI WORKFLOW ve NEDEN GITHUB_TOKEN YETMİYOR: branch protection
# okumak admin izni ister ve `administration` scope'u Actions
# `permissions:` bloğunda GEÇERSİZDİR (ölçüldü 2026-09-30, actionlint
# v1.7.7: "unknown permission scope administration"). Buraya eklenirse
# workflow PARSE HATASIYLA 0 JOB üretir — yani bu dosya kendini öldürür.
# Bu yüzden okuma yetkisi `PROTECTION_PAT` secret'ından gelir.
#
# Secret kurulmadıysa script SKIP eder (rc=0, bulgu yok) — kasıtlı:
# her hafta yanlış-P1 gürültüsü üretmek yerine neyin eksik olduğunu yazar.
# Secret VAR ama okuma başarısız olursa (süresi geçmiş token) rc=2 ile
# KIRMIZI döner: aksi hâlde kapı sessizce ölürdü.
#
# ALERT: kırmızı koşum tek başına kimseye ulaşmayabilir (GitHub scheduled
# failure bildirimi kullanıcı ayarına bağlı). `--alert` bu yüzden
# `[protection-drift]` başlıklı TEK bir sticky issue'yu açar/günceller ve
# temiz koşumda kapatır. Issue yazımı GITHUB_TOKEN ile yapılır
# (`issues: write`); KORUMA okuması hâlâ PROTECTION_PAT'ten gelir ve kapı
# API'ye yazmaz.

on:
  schedule:
    # Haftalık: her Pazartesi 03:53 UTC. Dakikalar BİLİNÇLİ ayrık:
    # determinism-trend 03:17, docker-security 03:43, protection-drift 03:53,
    # prettier-drift 04:07.
    # Ölçülen düzeltme (2026-09-30): bu job ilk eklendiğinde
    # docker-security.yml ile AYNI `43 3 * * 1`'i almıştı; iki haftalık
    # koşum aynı dakikada runner kuyruğunda birbirini geciktirir ve zamanlama
    # kanıtını bulanıklaştırır. `test_gated_schedules` K7 artık çakışmayı
    # fail-closed yasaklıyor.
    - cron: "53 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  # Yalnız sticky alert issue'su için; branch protection'a YAZMA yok.
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Branch protection drift (haftalık, P1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # KURULUM ADIMI YOK — bilerek. Burada `-r _calisma/requirements-z3.txt`
      # deniyordu; o dosya main'de hiç commit edilmedi (yalnız `ci/boot-gate-ci`
      # ve `fix/restore-freebuff-id` dallarında), dolayısıyla adım
      # "Could not open requirements file" ile düşüyor ve KAPI HİÇ KOŞMUYORDU
      # (run 40161575769). verify.yml aynı tuzağı 2026-10-24'te satır-içi pinle
      # kapatmıştı; burada bağımlılık yalnız token yokken de gerekmeyen PyYAML.
      #
      # DİKKAT: token YOKKEN script SKIP eder (rc=0) ve `status_checks.gate_jobs()`
      # çağrılmaz — stdlib yeter. PROTECTION_PAT secret'ı EKLENİRSE bu yol
      # gate_jobs()'a girer ve PyYAML ister (yoksa rc=2, fail-closed kırmızı).
      # O gün buraya `pip install PyYAML==6.0.3` (dev_bootstrap.sh PINS) eklenmeli.

      - name: Branch protection drift denetimi (P1) + alert
        env:
          # Yalnızca bu secret admin yetkisi taşır; GITHUB_TOKEN burada
          # işe yaramaz (yukarıdaki nota bakın).
          PROTECTION_PAT: ${{ secrets.PROTECTION_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Alert issue'su için repo token'ı (permissions: issues: write).
          ALERT_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p .freebuff
          python3 _calisma/CIKTI/check_protection_drift.py --json --alert \
            | tee .freebuff/protection_drift.json

      - name: Upload drift raporu
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: protection-drift
          path: .freebuff/protection_drift.json
          if-no-files-found: warn
          retention-days: 90
