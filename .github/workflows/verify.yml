name: verify-delivery

# Stoic-Hume V5 tesliminin fail-closed doğrulama kapısı.
# Her push ve pull_request'te çalışır; manuel tetikleme için workflow_dispatch.
#
# Üç bağımsız kapı (paralel job):
#   1) verify    : MANIFEST + checksum + script + PDF + referans zinciri
#                  (verify_delivery.py, yalnızca stdlib; exit 0 = PASS)
#   2) symbolic  : core_section.tex teoremlerinin Z3 ile sembolik ispatı
#                  (verify_delivery.py --symbolic-proof; exit 0 = tüm ispatlar PASS)
#   3) lean      : ReductInvariance.lean tümevarımsal kanıtı
#                  (verify_delivery.py --lean-proof; exit 0 = derleme başarılı)
#
# Herhangi bir job'un sıfır-dışı exit kodu build'i FAIL yapar (fail-closed).
#
# Son job: reproducibility — tüm artifact'ları indirir, SHA-256 + run_id
# hesaplar, manifest.txt yazar ve tek artifact olarak yükler.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Delivery verification (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pdfinfo yalnızca PDF sayfa kapısı (33 sayfa) için gerekir; yoksa
      # verify_delivery.py bu kontrolü atlar (FAIL etmez). Kapıyı eksiksiz
      # çalıştırmak için kuruyoruz.
      - name: Install pdfinfo (poppler-utils) + qpdf (K6-DETERM)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      # `pipefail` + `tee`: çıktı hem log'a hem dosyaya yazılır, ama exit kodu
      # python'dan gelir (boru, fail-closed kapıyı gizleyemez).
      - name: Run delivery verification
        shell: bash
        run: |
          set -o pipefail
          python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI \
            --budget-out budget_verify.json 2>&1 | tee verify_report.txt

      - name: Generate SHA-256 for verify artifacts
        shell: bash
        run: |
          sha256sum verify_report.txt budget_verify.json 2>/dev/null \
            > verify_report.sha256 || true

      # `if: always()` — kapı FAIL olsa bile rapor (neden başarısız olduğu)
      # artifact olarak yüklenir.
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            verify_report.txt
            verify_report.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload budget sidecar (verify)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-verify
          path: budget_verify.json
          if-no-files-found: ignore
          retention-days: 30

  symbolic:
    name: Symbolic proof (Z3) — K8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Yerel ispatla aynı sürüm (tekrarlanabilirlik).
      - name: Install Z3
        run: pip install z3-solver==5.1.0.0

      # K8: sembolik ispat, verify_delivery.py'nin tek giriş noktası üzerinden.
      - name: Run symbolic proof (verify_delivery.py K8)
        shell: bash
        run: |
          set -o pipefail
          python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI --symbolic-proof \
            --budget-out budget_symbolic.json 2>&1 | tee symbolic_report.txt

      - name: Generate SHA-256 for symbolic artifacts
        shell: bash
        run: |
          sha256sum symbolic_report.txt budget_symbolic.json 2>/dev/null \
            > symbolic_report.sha256 || true

      - name: Upload symbolic proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbolic-report
          path: |
            symbolic_report.txt
            symbolic_report.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload budget sidecar (symbolic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-symbolic
          path: budget_symbolic.json
          if-no-files-found: ignore
          retention-days: 30

  lean:
    name: Lean 4 reduct-invariance — K9
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Lean 4 kurulumu (elan + stable toolchain)
      - name: Install Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # K9: Lean reduct-invariance, verify_delivery.py'nin tek giriş noktası üzerinden.
      - name: Run Lean proof (verify_delivery.py K9)
        shell: bash
        run: |
          set -o pipefail
          python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI --lean-proof \
            --budget-out budget_lean.json 2>&1 | tee lean_report.txt

      - name: Generate SHA-256 for lean artifacts
        shell: bash
        run: |
          sha256sum lean_report.txt budget_lean.json 2>/dev/null \
            > lean_report.sha256 || true

      - name: Upload Lean proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-report
          path: |
            lean_report.txt
            lean_report.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload budget sidecar (lean)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-lean
          path: budget_lean.json
          if-no-files-found: ignore
          retention-days: 30

  budget:
    name: Budget shield (aggregated)
    runs-on: ubuntu-latest
    needs: [verify, symbolic, lean]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download budget sidecars
        uses: actions/download-artifact@v4
        with:
          pattern: budget-*
          path: budget_sidecars/
          merge-multiple: true

      - name: Consolidate budget report
        run: |
          mkdir -p budget
          cp budget_sidecars/*.json budget/ 2>/dev/null || cp budget_verify.json budget/ 2>/dev/null || true
          # Index: hangi job ne kadar token/maliyet üretti?
          python3 - <<'PY'
          import json, glob, sys
          rows = []
          for p in sorted(glob.glob("budget/*.json")):
              try:
                  r = json.load(open(p))
                  r["source"] = p.split("/")[-1]
                  rows.append(r)
              except Exception as e:
                  print(f"skip {p}: {e}", file=sys.stderr)
          summary = {
              "tool": "verify_delivery.py bütçe kalkanı",
              "date": rows[0]["date"] if rows else None,
              "method": "v3_verify.py H4 (token ≈ bytes/4, $3/M token + $0.55)",
              "runs": rows,
              "any_fail": any(r["verdict"] != "OK" for r in rows),
          }
          json.dump(summary, open("budget/index.json", "w"), indent=2, ensure_ascii=False)
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload budget bundle
        uses: actions/upload-artifact@v4
        with:
          name: budget
          path: budget/
          retention-days: 30
          if-no-files-found: error

  reports:
    name: Static markdown reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle markdown reports
        run: |
          mkdir -p reports
          cp _calisma/CIKTI/M0_TOOLKIT_DENETIM_RAPORU.md      reports/
          cp _calisma/CIKTI/REFERANS_KANIT_DENETIMI.md        reports/
          cp _calisma/CIKTI/SEMBOLIK_ISPAT_RAPORU.md          reports/
          cp _calisma/lean_reduct/LEAN_ISPAT_RAPORU.md        reports/ 2>/dev/null || true
          echo "=== Rapor içeriği ==="
          ls -la reports/
          wc -l reports/*.md

      - name: Upload reports bundle
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # REPRODUCIBILITY BUNDLE
  #
  # Tüm artifact'ları indirir, her dosya için SHA-256 üretir,
  # manifest.txt yazar (github.run_id + github.sha + dosya hash'leri),
  # her şeyi tek bir artifact olarak yükler.
  #
  # Bu artifact tek bir download ile projenin tam doğrulanabilirliğini
  # sunar: herhangi bir commit'in hangi CI run'ında, hangi checksum'larla
  # doğrulandığını kanıtlar.
  # ──────────────────────────────────────────────────────────────────────
  reproducibility:
    name: Reproducibility bundle
    runs-on: ubuntu-latest
    needs: [verify, symbolic, lean, budget, reports]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ─── 1) Tüm artifact'ları indir ────────────────────────────────────
      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts/
          merge-multiple: true
          pattern: '{verify-report,symbolic-report,lean-report,budget,reports}'

      # ─── 2) manifest.txt üret ───────────────────────────────────────────
      - name: Generate reproducibility manifest
        shell: python3 {0}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          import hashlib, json, os, pathlib, datetime

          RUN_ID    = os.environ["GITHUB_RUN_ID"]
          SHA       = os.environ["GITHUB_SHA"]
          REF       = os.environ["GITHUB_REF"]
          REPO      = os.environ["GITHUB_REPOSITORY"]
          RUN_URL   = os.environ["GITHUB_RUN_URL"]
          NOW       = datetime.datetime.utcnow().isoformat() + "Z"
          ROOT      = pathlib.Path("all_artifacts")

          lines = [
              "=" * 72,
              "STOIC-HUME V5  —  REPRODUCIBILITY MANIFEST",
              f"generated: {NOW}",
              f"github_run_id: {RUN_ID}",
              f"github_sha: {SHA}",
              f"github_ref: {REF}",
              f"github_repository: {REPO}",
              f"github_run_url: {RUN_URL}",
              "=" * 72,
              "",
              f"{'FILE':<55} {'SHA-256'}",
              "-" * 72,
          ]

          file_hashes = {}
          for p in sorted(ROOT.rglob("*")):
              if p.is_file():
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  rel = str(p.relative_to(ROOT))
                  file_hashes[rel] = h
                  lines.append(f"{rel:<55} {h}")

          lines += ["", "-" * 72, f"Total files: {len(file_hashes)}", ""]

          # JSON manifest (machine-readable)
          manifest_json = {
              "tool": "stoic-hume-v5-reproducibility",
              "generated": NOW,
              "github_run_id": RUN_ID,
              "github_sha": SHA,
              "github_ref": REF,
              "github_repository": REPO,
              "github_run_url": RUN_URL,
              "files": file_hashes,
          }

          out_dir = pathlib.Path("reproducibility")
          out_dir.mkdir(exist_ok=True)
          (out_dir / "manifest.txt").write_text("\n".join(lines), encoding="utf-8")
          (out_dir / "manifest.json").write_text(
              json.dumps(manifest_json, indent=2, ensure_ascii=False), encoding="utf-8"
          )

          # Copy all artifacts into the bundle alongside the manifest
          import shutil
          for child in ROOT.iterdir():
              dest = out_dir / child.name
              if child.is_dir():
                  shutil.copytree(child, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(child, dest)

          # Print summary to workflow log
          print(f"Manifest: {len(file_hashes)} files hashed, run_id={RUN_ID}")
          print(f"Bundle size: {sum(f.stat().st_size for f in out_dir.rglob('*') if f.is_file())} bytes")

      # ─── 3) Tek artifact olarak yükle ───────────────────────────────────
      - name: Upload reproducibility bundle
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility
          path: reproducibility/
          retention-days: 90
          if-no-files-found: error
