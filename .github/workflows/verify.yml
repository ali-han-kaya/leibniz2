name: verify-delivery

# Stoic-Hume V5 tesliminin fail-closed doğrulama kapısı.
# Her push ve pull_request'te çalışır; manuel tetikleme için workflow_dispatch.
#
# TEK GİRİŞ NOKTASI: verify job'u, `verify_delivery.py --full` ile
#   K1-K7 (manifest/checksum/script/PDF/referans) +
#   K8 (Z3 sembolik ispat) +
#   K9 (Lean 4 reduct-invariance) +
#   bütçe kalkanı (--budget-out) hepsini tek komutta koşar.
# Z3 ve Lean, verify_delivery.py'nin içinden subprocess olarak çağrılır;
# tek bir rapor dosyasında (verify_report.txt) birleşir. Ardından pre-commit
# hook'ları (verify-delivery / symbolic / lean) AYNI job içinde ADVISORY
# koşulur ve çıktıları aynı log'a (verify_report.txt) eklenir.
#
# Tek job'un sıfır-dışı exit kodu build'i FAIL yapar (fail-closed).
#
# Yardımcı job'lar:
#   budget        : bütçe sidecar'ını toplar; aşım varsa run summary +
#                   PR yorumu üretir.
#   reports       : statik markdown raporları tek artifact'ta toplar.
#   (pre-commit hook'ları ayrı job değil — verify job'unun İÇİNDE advisory
#    bölüm olarak koşulur; çıktısı aynı log'a eklenir, tek giriş noktası.)
#   reproducibility: tüm artifact'ları SHA-256 + run_id ile manifest'ler,
#                   tek artifact olarak yükler.
#   manifest-comment: reproducibility manifest.txt içeriğini PR yorumu olarak
#                   düşer (PR gözden geçirmesi için; yalnızca pull_request).
#   config-drift  : gen_config.py --dry-run ile commit'li config'in paket
#                   içeriğinden türetilen değerlerle uyuştuğunu doğrular
#                   (fark = FAIL, fail-closed).
#   repack-verify : kaynak ağacı (V5_ICERIK/, TESLIM/) commit'li olduğundan
#                   repack_delivery.py'yi doğrudan koşar, çıktının commit'li
#                   dosyalarla byte-identical olduğunu (git diff boş) ve
#                   verify_delivery.py base'in geçtiğini doğrular — sidecar
#                   senkronu her push'ta otomatik garanti edilir.
#   refs-trend    : refs-online artifact'larını run'lar arası toplayıp
#                   "online verification trend" tablosu üretir (advisory;
#                   actions: read ile API'den geçmiş run'ları çeker).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # bütçe aşımı uyarısını PR yorumu olarak düşmek için

jobs:
  verify:
    name: Delivery verification — K1-K9 (single entry point)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Soy hattı (--check-lineage) zip_lineage.json'daki nesilleri
          # `git show <commit>:<path>` ile yeniden türetir — tam geçmiş gerekir.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # _calisma/CIKTI/test_*.py birim testleri — fail-closed. stdlib unittest;
      # ek bağımlılık yok. Kapsam:
      #   test_preview_server.py — history.jsonl bütünlüğü (append/trim/atomik
      #     replace + LOCK altında asılmama) regresyon kapısı.
      #   test_gen_config.py     — compute_budget_ratios (pay 0 / baskınlık /
      #     eşit karışım / clamp sınırları) regresyon kapısı.
      - name: Run CIKTI unit tests (test_*.py)
        shell: bash
        run: |
          python3 -m unittest discover -s _calisma/CIKTI -p "test_*.py" -v

      - name: Install pre-commit (advisory pre-commit section)
        run: pip install pre-commit

      # ─── pre-commit hook ortamlarını önbelleğe al ──────────────────────
      # pre-commit, hook'ları (özellikle verify-delivery-symbolic → z3-solver
      # izole venv) ~/.cache/pre-commit altında tutar. Bu dizini cache'lemek,
      # her run'da z3-solver ortamının yeniden kurulmasını önler → run süresi
      # düşer. Key .pre-commit-config.yaml hash'ine bağlı: config (dolayısıyla
      # additional_dependencies) değişirse cache otomatik geçersizleşir.
      # actions/cache@v5 = Node 24 (repo'daki diğer action'larla tutarlı).
      - name: Cache pre-commit hook environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|${{ runner.os }}|

      # Konfig şema doğrulaması (jsonschema) — parse/schema hatalarını
      # henüz Z3/Lean kurulumuna girmeden bloke eder (fail-fast).
      - name: Validate config schema (jsonschema)
        run: |
          pip install jsonschema
          python3 _calisma/CIKTI/validate_config_schema.py

      # pdfinfo (PDF sayfa kapısı 33) + qpdf (K6-DETERM metadata-stripped hash).
      # Yoksa verify_delivery.py bu kontrolleri atlar (FAIL etmez); kapıyı
      # eksiksiz çalıştırmak için kuruyoruz.
      - name: Install pdfinfo (poppler-utils) + qpdf (K6-DETERM)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      # K8: Z3 sembolik ispat. Yerel ispatla aynı sürüm (tekrarlanabilirlik).
      - name: Install Z3 (K8)
        run: pip install z3-solver==5.1.0.0

      # K9: Lean 4 reduct-invariance (elan + stable toolchain).
      # NOT: `--default-toolchain none` + lean-toolchain dosyası yok = lean
      # çalışmaz; bu yüzden stable toolchain açıkça kurulur.
      - name: Install Lean 4 (K9)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # `pipefail` + `tee`: çıktı hem log'a hem dosyaya yazılır, ama exit kodu
      # python'dan gelir (boru, fail-closed kapıyı gizleyemez).
      # --full: K1-K7 + K8 (Z3) + K9 (Lean) + CrossRef/SEP/OpenLibrary + bütçe.
      # --budget-out: bütçe sonucunu ayrı JSON'a yazar (budget job'u tüketir).
      # --refs-out: çevrimiçi referans denetim sonuçlarını VERSION JSON olarak
      # yazar (her run'da kaç referansın çevrimiçi doğrulandığını izlemek için).
      - name: Run full verification (K1-K9, single entry point)
        shell: bash
        run: |
          set -o pipefail
          python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI --full \
            --budget-out budget_verify.json \
            --config-out effective_config.json \
            --refs-out references_online.json \
            --history-out history.jsonl \
            --k0-out k0_findings.json \
            --lineage-out lineage_findings.json \
            --klayers-out klayers.json 2>&1 | tee verify_report.txt
          # (--full içinde --check-lineage: zip_lineage.json soy hattı doğrulanır;
          #  --lineage-out ayrı artifact + run summary için sidecar yazar;
          #  --klayers-out K1-K14 PASS/FAIL/SKIP özetini run summary'ye taşır)

      # ─── PRECOMMIT (ADVISORY) — aynı job içinde, tek log ────────────────
      # pre-commit hook'ları (verify-delivery / symbolic / lean) commit
      # öncesi kapının birebir aynısıdır. --full'den SONRA AYNI job içinde
      # koşulur ve çıktısı verify_report.txt'ye EKLENİR → tek giriş noktası,
      # tek log. continue-on-error: build'i BLOKE ETMEZ (gate rolü --full'de);
      # P0/P1 bulguları PRECOMMIT_RAPORU.md'ye ayrıştırılıp reports
      # artifact'ına eklenir. if: always(): --full başarısız olsa bile
      # advisory bulgular toplanır.
      - name: Run pre-commit (advisory, all files, show diff on failure)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs
          pre-commit run --all-files --show-diff-on-failure --color=never \
            > logs/precommit.log 2>&1
          status=$?
          echo "$status" > logs/precommit.exit
          {
            echo ""
            echo "════════════════════════════════════════════════════════"
            echo "PRECOMMIT (ADVISORY) — pre-commit run --all-files"
            echo "exit code: $status"
            echo "════════════════════════════════════════════════════════"
            cat logs/precommit.log
          } >> verify_report.txt
          cat logs/precommit.log
          exit $status

      - name: Generate pre-commit findings report
        if: always()
        shell: bash
        run: |
          python3 _calisma/CIKTI/gen_precommit_report.py

      # ÖZET: pre-commit cache durumu + hook env sürümleri. Tekrarlanabilirlik
      # denetimi için: hangi pre-commit sürümü, hangi hook ortamları (env
      # hash'leri) ve hangi araç sürümleri kullanıldı. PRECOMMIT_CACHE.md
      # logs/ içine yazıldığından artifact'a otomatik girer ve reproducibility
      # manifest'ine hash'lenir.
      - name: Pre-commit cache + hook env summary
        if: always()
        shell: bash
        run: |
          {
            echo "# PRECOMMIT ORTAM ÖZETİ (cache + hook env)"
            echo ""
            echo "- **pre-commit sürümü:** $(pre-commit --version 2>/dev/null || echo yok)"
            echo "- **Toplamak zamanı (UTC):** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Hook env sürümleri"
            echo ""
            echo "| Araç | Sürüm |"
            echo "|---|---|"
            echo "| python3 | $(python3 --version 2>&1 | awk '{print $2}') |"
            echo "| pre-commit | $(pre-commit --version 2>/dev/null | awk '{print $2}' || echo yok) |"
            echo "| pdfinfo | $(pdfinfo -v 2>&1 | head -1 | sed 's/.*version //' || echo yok) |"
            echo "| qpdf | $(qpdf --version 2>&1 | head -1 | awk '{print $NF}' || echo yok) |"
            echo "| z3 | $(python3 -c 'import z3; print(z3.get_version_string())' 2>/dev/null || echo yok) |"
            echo "| lean | $(lean --version 2>/dev/null || echo yok) |"
            echo ""
            echo "## pre-commit cache durumu"
            echo ""
            echo '```text'
            if [ -d "$HOME/.cache/pre-commit" ]; then
              echo "cache dizini: $HOME/.cache/pre-commit"
              du -sh "$HOME/.cache/pre-commit" 2>/dev/null
              echo ""
              echo "env sürümleri (hash dizinleri):"
              ls -1 "$HOME/.cache/pre-commit" 2>/dev/null | head -20
              echo ""
              if [ -d "$HOME/.cache/pre-commit/repocache" ]; then
                echo "repocache:"
                ls -1 "$HOME/.cache/pre-commit/repocache" 2>/dev/null | head -10
              fi
            else
              echo "cache dizini yok: $HOME/.cache/pre-commit"
            fi
            echo '```'
            echo ""
            echo "> Not: env hash dizinleri hook ortamlarının (additional_dependencies"
            echo "> dahil) içerik hash'leridir — aynı env yeniden kurulmadan reuse edilir."
          } > logs/PRECOMMIT_CACHE.md
          echo "PRECOMMIT_CACHE.md yazıldı:"
          cat logs/PRECOMMIT_CACHE.md

      # ─── P0 varsa PR etiketi + yorum ─────────────────────────────────────
      # Advisory pre-commit bulgularında P0 varsa PR'ye otomatik etiket
      # (precommit-p0) ekler ve yorum düşer. Yorum spam'ini önlemek için aynı
      # marker'lı eski yorum GÜNCELLENİR (yenisi oluşturulmaz); P0 yoksa
      # etiket kaldırılır — etiket her zaman PR'nin güncel durumunu yansıtır.
      # Yalnızca pull_request olayında; budget PR yorumuyla aynı desen.
      - name: Pre-commit P0 — PR label + comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'logs/PRECOMMIT_RAPORU.md';
            const marker = '<!-- precommit-p0-bot -->';
            const label = 'precommit-p0';

            if (!fs.existsSync(path)) {
              console.log('PRECOMMIT_RAPORU.md yok — atlanıyor');
              return;
            }
            const text = fs.readFileSync(path, 'utf8');
            const findings = [];
            const re = /^\| (P0) \| (.+) \|$/gm;
            let m;
            while ((m = re.exec(text)) !== null) findings.push(m[2].trim());
            const hasP0 = findings.length > 0;

            // Etiketi PR'nin güncel durumuyla senkron tut: P0 varsa ekle,
            // yoksa kaldır (aynı etiketi tekrar eklemek no-op'tur).
            const labels = await github.rest.issues.listLabelsOnIssue({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const hasLabel = labels.data.some(l => l.name === label);
            if (hasP0 && !hasLabel) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [label],
              });
              console.log(`Etiket eklendi: ${label}`);
            } else if (!hasP0 && hasLabel) {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
              console.log(`Etiket kaldırıldı: ${label}`);
            }

            if (!hasP0) {
              console.log('P0 bulgusu yok — yorum atlanıyor');
              return;
            }

            const body = [
              marker,
              '🔴 **Pre-commit P0 bulgusu (advisory)**',
              '',
              ...findings.map(f => `- ${f}`),
              '',
              `> Detay: [run #${context.runId}](${context.payload.repository.html_url}/actions/runs/${context.runId}) — ` +
              '`precommit-logs` artifact\'ındaki PRECOMMIT_RAPORU.md.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              console.log('Mevcut P0 yorumu güncellendi');
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              console.log('P0 yorumu oluşturuldu');
            }

      # ─── Tüm run summary bölümlerini TEK giriş noktasından üret ─────────
      # consolidate_summary.py, pre-commit + K0 + bütçe + soy hattı + K
      # katmanları bölümlerini AYNI GITHUB_STEP_SUMMARY'ye sırayla yazar
      # (her bölümün render mantığı ilgili run_summary_*.py modülündedir —
      # tek kaynak; sidecar'lar verify job'unun çalışma dizinindedir).
      # if: always(): --full başarısız olsa bile advisory bulgular özetlenir.
      - name: Consolidate run summary (pre-commit + K0 + bütçe + soy hattı + K katmanları)
        if: always()
        shell: bash
        run: |
          python3 _calisma/CIKTI/consolidate_summary.py

      - name: Generate SHA-256 for verify artifacts
        shell: bash
        run: |
          sha256sum verify_report.txt budget_verify.json references_online.json \
            2>/dev/null > verify_report.sha256 || true
          sha256sum references_online.json 2>/dev/null \
            > references_online.json.sha256 || true
          sha256sum history.jsonl 2>/dev/null > history.jsonl.sha256 || true

      # `if: always()` — kapı FAIL olsa bile rapor (neden başarısız olduğu)
      # artifact olarak yüklenir. Tek rapor, tüm K1-K9 katmanlarını içerir.
      # Hangi config'in kullanıldığını denetlenebilir kılar: ham config,
      # şeması ve verify_delivery.py'nin çözümlediği etkin değerler.
      - name: Bundle config snapshot
        if: always()
        shell: bash
        run: |
          mkdir -p config
          cp _calisma/CIKTI/verify_delivery.config.json        config/
          cp _calisma/CIKTI/verify_delivery.config.schema.json config/
          cp effective_config.json config/ 2>/dev/null || true
          sha256sum config/* 2>/dev/null > config/config.sha256 || true

      # Config değiştiyse uyarı: ham config (verify_delivery.config.json) ile
      # etkin config (effective_config.json) arasındaki farkları diff olarak
      # üretir. Advisory (exit 0 — bloke etmez); bloke eden kapı config-drift.
      # Çıktı config/ içine yazılır → config artifact'ına ve reproducibility
      # manifest'ine otomatik girer.
      - name: Generate config diff (advisory warning)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 _calisma/CIKTI/diff_config_artifacts.py \
            --config-dir config \
            --out-dir config

      - name: Upload config snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: config
          path: config/
          if-no-files-found: error
          retention-days: 30

      - name: Upload K0 findings sidecar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: k0-findings
          path: k0_findings.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload lineage findings sidecar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lineage-findings
          path: lineage_findings.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload K layers sidecar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: klayers
          path: klayers.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-report
          path: |
            verify_report.txt
            verify_report.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload budget sidecar (verify)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: budget-verify
          path: budget_verify.json
          if-no-files-found: ignore
          retention-days: 30

      # Çevrimiçi referans denetimi VERSION JSON (CrossRef/SEP/OpenLibrary):
      # her push'ta kaç referansın çevrimiçi doğrulandığını (kaynak + sonuç
      # kırılımıyla) izleyen makine-okunur kayıt. --full her zaman üretir;
      # kapı FAIL olsa bile yüklenir (if: always).
      - name: Upload online references report (VERSION JSON)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refs-online
          path: |
            references_online.json
            references_online.json.sha256
          if-no-files-found: ignore
          retention-days: 30

      # Run-history (history.jsonl): verify_delivery.py --history-out ile
      # üretilen, preview_server.py'nin history formatıyla birebir tek JSONL
      # kaydı (ts/verdict/p0/p1/duration_s/budget_usd/…). reproducibility
      # job'ı tüm artifact'ları hash'lediğinden bu dosya da SHA-256 ile
      # otomatik sabitlenir. if: always() — kapı FAIL olsa da yüklenir.
      - name: Upload run history (history.jsonl)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: run-history
          path: |
            history.jsonl
            history.jsonl.sha256
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload pre-commit log + findings report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: precommit-logs
          path: logs/
          if-no-files-found: error
          retention-days: 30

  budget:
    name: Budget shield (aggregated)
    runs-on: ubuntu-latest
    needs: [verify]
    # Bütçe aşımı (P1) üst job'u FAIL yapsa bile bu job koşmalı ki
    # uyarıyı hem run summary'e hem PR yorumuna düşebilsin.
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download budget sidecars
        uses: actions/download-artifact@v7
        with:
          pattern: budget-*
          path: budget_sidecars/
          merge-multiple: true

      # effective_config.json (verify job'unun --config-out çıktısı) config
      # artifact'ının içindedir; CLI override uyarısı için indirilir. advisory:
      # yoksa (ör. config yüklenemedi) adımı patlatmaz — betik UYARI yazar.
      - name: Download config snapshot (effective_config.json)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: config
          path: config_snapshot/

      - name: Consolidate budget report
        run: |
          mkdir -p budget
          cp budget_sidecars/*.json budget/ 2>/dev/null || true
          # Index: bütçe sidecar'larını topla, aşanları failures listesine koy.
          python3 _calisma/CIKTI/consolidate_budget.py

      # effective_config.json'daki cli_overrides.<param>.override==true
      # durumunu bütçe raporu artifact'ına uyarı olarak yaz. Advisory
      # (exit 0): bütçe kapısı aşım kontrolüdür; override kaydı denetim izi
      # sağlar ve tekrarlanabilirlik sapmasını görünür kılar.
      - name: CLI overrides — budget report warning
        if: always()
        shell: bash
        run: |
          python3 _calisma/CIKTI/check_cli_overrides.py \
            --config config_snapshot/effective_config.json \
            --index budget/index.json \
            --out-dir budget

      # ─── Bütçe aşımı uyarısını run summary'e yaz ────────────────────────
      - name: Budget gate — run summary
        if: always()
        shell: bash
        run: |
          python3 _calisma/CIKTI/run_summary_budget.py

      # ─── Bütçe aşımı uyarısını PR yorumu olarak düş ─────────────────────
      - name: Budget gate — PR comment (on exceedance)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'budget/index.json';
            if (!fs.existsSync(path)) return;
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const failures = summary.failures || [];
            if (failures.length === 0) return;

            const lines = failures.map(f =>
              `- **${f.source || 'bilinmeyen'}**: $${f.estimated_usd} / $${f.limit} limiti ` +
              `(+$${(f.estimated_usd - f.limit).toFixed(2)} aşım, ~${f.tokens_est} token)`
            );
            const body = [
              '⚠️ **Bütçe limiti aşıldı**',
              '',
              ...lines,
              '',
              `> Yöntem: \`${summary.method}\`. Fail-closed: P1 bulgusu olarak işaretlendi.`,
              `> Detay: [run #${context.runId}](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload budget bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: budget
          path: budget/
          retention-days: 30
          if-no-files-found: error

  reports:
    name: Static markdown reports (incl. pre-commit findings)
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # precommit advisory bölümünün bulgularını indir (yoksa atla — dep
      # kurulumu başarısız olmuşsa rapor üretilmemiş olabilir).
      - name: Download pre-commit findings
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: precommit-logs
          path: precommit_findings/

      - name: Bundle markdown reports
        run: |
          mkdir -p reports
          cp _calisma/CIKTI/M0_TOOLKIT_DENETIM_RAPORU.md      reports/
          cp _calisma/CIKTI/REFERANS_KANIT_DENETIMI.md        reports/
          cp _calisma/CIKTI/SEMBOLIK_ISPAT_RAPORU.md          reports/
          cp _calisma/lean_reduct/LEAN_ISPAT_RAPORU.md        reports/ 2>/dev/null || true
          cp precommit_findings/PRECOMMIT_RAPORU.md           reports/ 2>/dev/null || true
          echo "=== Rapor içeriği ==="
          ls -la reports/
          wc -l reports/*.md

      - name: Upload reports bundle
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: reports/
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # REPRODUCIBILITY BUNDLE
  #
  # Tüm artifact'ları indirir, her dosya için SHA-256 üretir,
  # manifest.txt yazar (github.run_id + github.sha + dosya hash'leri),
  # her şeyi tek bir artifact olarak yükler.
  # ──────────────────────────────────────────────────────────────────────
  reproducibility:
    name: Reproducibility bundle
    runs-on: ubuntu-latest
    needs: [verify, budget, reports, config-drift, repack-verify]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ─── 1) Tüm artifact'ları indir ────────────────────────────────────
      # config VE precommit-logs artifact'ları AYRI indirilip kendi adları
      # altına yazılır; gen_repro_manifest.py'nin CONFIG bölümü config/,
      # PROVENANCE bölümü ise precommit-logs/ önekini yakalar → job kaynağı
      # dosya bazında denetlenebilir. merge-multiple artifact'ları köke
      # düzleştirdiği için bu ikisini pattern'e koymak öneklerini
      # kaybettirirdi.
      # repack-verify ve k0-findings tek düz dosya (repack_verify_report.txt /
      # k0_findings.json) olduğundan merge ile köke düzleşmesi sorun değildir
      # → manifest'e rel yolu repack_verify_report.txt / k0_findings.json
      # olarak girer ve SHA-256 ile sabitlenir.
      - name: Download remaining artifacts (merge)
        uses: actions/download-artifact@v7
        with:
          path: all_artifacts/
          merge-multiple: true
          pattern: '{verify-report,budget,reports,refs-online,run-history,config-drift,repack-verify,k0-findings}'

      - name: Download config artifact (config/ prefix)
        uses: actions/download-artifact@v7
        with:
          name: config
          path: all_artifacts/config/

      - name: Download precommit-logs artifact (precommit-logs/ prefix)
        uses: actions/download-artifact@v7
        with:
          name: precommit-logs
          path: all_artifacts/precommit-logs/

      # ─── 2) manifest.txt üret (gen_repro_manifest.py — tek kaynak) ─────────
      - name: Generate reproducibility manifest
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 _calisma/CIKTI/gen_repro_manifest.py \
            --artifacts-dir all_artifacts \
            --out-dir reproducibility

      # ─── 3) Tek artifact olarak yükle ───────────────────────────────────
      # K10 kapısından ÖNCE yüklenir: K10 FAIL olsa bile bundle yüklenir,
      # böylece manifest-comment job'ı rozetini (PASS/FAIL) gösterebilir.
      - name: Upload reproducibility bundle
        uses: actions/upload-artifact@v6
        with:
          name: reproducibility
          path: reproducibility/
          retention-days: 90
          if-no-files-found: error

      # ─── 4) K10: bundle bütünlüğünü fail-closed doğrula (son kapı) ──────
      # manifest.json üretildikten sonra verify_delivery.py --verify-manifest
      # koşulur: manifest'teki her dosyanın SHA-256'sı gerçek dosyayla
      # karşılaştırılır (eksik/uyuşmazlık → P1 → exit 1). gen_repro_manifest.py
      # artifact'ları bundle'a (reproducibility/) kopyaladığı için manifest'teki
      # rel yollar reproducibility/ altında çözülür. Fail-closed: sessiz geçiş yok.
      # Job'ın SON adımı olduğu için FAIL, job'ı kırmızıya çevirir.
      - name: Verify bundle integrity (K10)
        shell: bash
        run: |
          python3 _calisma/CIKTI/verify_delivery.py \
            --verify-manifest reproducibility/manifest.json

  # ──────────────────────────────────────────────────────────────────────
  # MANIFEST PR COMMENT
  #
  # reproducibility bundle'ındaki manifest.txt içeriğini PR yorumu olarak
  # düşer — gözden geçiren, dosyaları indirmeden her artifact'ın SHA-256
  # özetini yorumda görür. Yalnızca pull_request olayında çalışır; push'ta
  # atlanır (if: github.event_name == 'pull_request').
  # TEK YORUM GÜNCELLE: her run'da yeni yorum açmaz; gövdedeki gizli
  # marker'ı (<!-- stoic-hume-v5-reproducibility-manifest -->) arayıp mevcut
  # yorumu bulur ve günceller; yoksa oluşturur (upsert).
  # ──────────────────────────────────────────────────────────────────────
  manifest-comment:
    name: Manifest PR comment
    runs-on: ubuntu-latest
    needs: [reproducibility]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download reproducibility bundle
        uses: actions/download-artifact@v7
        with:
          name: reproducibility
          path: reproducibility/

      # ─── K10: bundle bütünlüğünü koşup PASS/FAIL rozetini yakala ────────
      # Fail-closed kapı reproducibility job'ında; burada yalnızca rozet için
      # koşulur (FAIL olursa adımı patlatmaz — rozet FAIL gösterir).
      - name: Run K10 bundle integrity check (rozet için)
        shell: bash
        run: |
          python3 _calisma/CIKTI/verify_delivery.py \
            --dir _calisma/CIKTI \
            --json \
            --verify-manifest reproducibility/manifest.json \
            > k10_result.json 2>/dev/null || true
          verdict=$(python3 -c "import json;d=json.load(open('k10_result.json'));print(d.get('manifest_digest',{}).get('verdict','FAIL'))" 2>/dev/null || echo "FAIL")
          echo "$verdict" > k10_verdict.txt
          echo "K10 manifest digest verdict: $verdict"

      - name: Upsert manifest.txt PR comment (tek yorum güncelle)
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'reproducibility/manifest.txt';
            if (!fs.existsSync(path)) {
              console.log('manifest.txt yok — yorum atlanıyor');
              return;
            }
            const manifest = fs.readFileSync(path, 'utf8');

            // run_id/sha/ref üst bilgilerini ayrıştır (manifest başlığı)
            const meta = {};
            for (const line of manifest.split('\n')) {
              const m = line.match(/^(github_\w+):\s+(.+)$/);
              if (m) meta[m[1]] = m[2];
            }

            const MARKER = '<!-- stoic-hume-v5-reproducibility-manifest -->';

            // K10 bundle bütünlüğü rozeti (önceki adım k10_verdict.txt yazdı)
            const k10 = fs.existsSync('k10_verdict.txt')
              ? fs.readFileSync('k10_verdict.txt', 'utf8').trim()
              : 'N/A';
            const k10Badge = k10 === 'PASS'
              ? '✅ **K10 manifest digest: PASS**'
              : (k10 === 'FAIL'
                  ? '❌ **K10 manifest digest: FAIL**'
                  : `⚠️ **K10 manifest digest: ${k10}**`);

            const code = '```text\n' + manifest + '\n```';
            const body = [
              '## 📦 Reproducibility manifest (SHA-256)',
              '',
              k10Badge,
              '',
              'Bu run için üretilen tüm artifact dosyalarının bütünlük özeti:',
              '',
              code,
              '',
              meta.github_run_id
                ? `> Run: [${meta.github_run_id}](${context.payload.repository.html_url}/actions/runs/${meta.github_run_id})`
                : '',
              '',
              MARKER,
            ].join('\n').trim();

            // Tek yorum güncelle (upsert): marker'lı mevcut yorumu bul, varsa
            // güncelle; yoksa oluştur. Her run'da yeni yorum birikmez.
            const existing = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const found = existing.data.find(c => c.body && c.body.includes(MARKER));

            if (found) {
              await github.rest.issues.updateComment({
                comment_id: found.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              console.log(`Mevcut yorum güncellendi: comment_id=${found.id}`);
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              console.log('Yeni yorum oluşturuldu (marker bulunamadı)');
            }

      # ─── Config diff (raw vs effective) — advisory PR yorumu ────────────
      # reproducibility bundle'ındaki config/config-diff.json (verify job'unun
      # diff_config_artifacts.py çıktısı) okunur; fark varsa ayrı bir upsert
      # yorum düşülür (marker: stoic-hume-v5-config-diff). Fark yoksa bayat
      # uyarı yorumu KALDIRILIR — böylece çözülen diff yanıltıcı kalmaz.
      # Advisory: config-diff bloke etmez (bloke eden kapı config-drift).
      - name: Upsert config-diff PR comment (tek yorum güncelle)
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'reproducibility/config/config-diff.json';
            const MARKER = '<!-- stoic-hume-v5-config-diff -->';

            const listComments = async () => {
              const { data } = await github.rest.issues.listComments({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              return data;
            };

            if (!fs.existsSync(path)) {
              console.log('config-diff.json yok — yorum atlanıyor');
              return;
            }
            const diff = JSON.parse(fs.readFileSync(path, 'utf8'));
            const diffs = diff.differences || [];
            const existing = await listComments();
            const found = existing.find(c => c.body && c.body.includes(MARKER));

            if (diffs.length === 0) {
              // Fark yok: önceki run'ın bayat uyarısını kaldır (yanıltıcı kalmasın).
              if (found) {
                await github.rest.issues.deleteComment({
                  comment_id: found.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
                console.log('config-diff fark yok — bayat yorum kaldırıldı');
              } else {
                console.log('config-diff fark yok — yorum yok');
              }
              return;
            }

            const lines = diffs.map(d =>
              `- **${d.field}**: \`${JSON.stringify(d.raw)}\` → ` +
              `\`${JSON.stringify(d.effective)}\` _(${d.reason})_`
            );
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const body = [
              '## ⚙️ Config diff (raw vs effective)',
              '',
              ...lines,
              '',
              "> Advisory: bloke etmez; bloke eden kapı config-drift job'ıdır.",
              `> Detay: [run #${context.runId}](${runUrl})`,
              '',
              MARKER,
            ].join('\n').trim();

            if (found) {
              await github.rest.issues.updateComment({
                comment_id: found.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              console.log(`config-diff yorumu güncellendi: comment_id=${found.id}`);
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              console.log('config-diff yorumu oluşturuldu');
            }

  # ──────────────────────────────────────────────────────────────────────
  # CONFIG DRIFT CHECK
  #
  # İki bağımsız fail-closed kapı:
  # 1) gen_config.py --dry-run: commit'li config'in expected_pages/refs/
  #    manifest değerleri paketin GERÇEK içeriğinden türetilmeli; fark → P1.
  # 2) diff_config_artifacts.py --fail-on-drift: effective_config.json ile
  #    verify_delivery.config.json karşılaştırılır; "drift" nedenli (CLI
  #    override'ı OLMADAN farklı) değerler → exit 1. cli_override/default
  #    farkları meşru, advisory kalır. effective_config.json verify job'unun
  #    config artifact'ından indirilir (needs: verify).
  # ──────────────────────────────────────────────────────────────────────
  config-drift:
    name: Config drift check (gen_config + diff-on-drift)
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      pull-requests: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pdfinfo (poppler-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run gen_config.py --dry-run (capture exit; kapı sonra)
        id: drift
        shell: bash
        run: |
          set +e
          python3 _calisma/CIKTI/gen_config.py --dry-run --dir _calisma/CIKTI \
            > drift_stdout.txt 2> drift_stderr.txt
          rc=$?
          set -e
          echo "$rc" > drift_rc.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Config drift exit code: $rc"
          if [ -s drift_stderr.txt ]; then
            echo "--- stderr (drift bulguları) ---"
            cat drift_stderr.txt
          fi

      # effective_config.json (verify job'unun --config-out çıktısı) config
      # artifact'ının içindedir; raw↔effective "drift" kapısı için indirilir.
      - name: Download config snapshot (effective_config.json)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: config
          path: config_snapshot/

      # raw (verify_delivery.config.json) vs effective (effective_config.json)
      # karşılaştırması; --fail-on-drift: yalnızca "drift" nedenli fark exit 1
      # yapar (cli_override/default advisory kalır). Eksik dosya → advisory
      # (exit 0) — config artifact'ı indirilemediyse bu kapı sessizce geçer,
      # gen_config kapısı yine fail-closed kalır.
      - name: Config diff — fail on drift (raw vs effective)
        id: diffdrift
        shell: bash
        run: |
          set +e
          python3 _calisma/CIKTI/diff_config_artifacts.py \
            --config-dir config_snapshot --out-dir config_snapshot --fail-on-drift \
            > diffdrift_stdout.txt 2> diffdrift_stderr.txt
          rc=$?
          set -e
          echo "$rc" > diffdrift_rc.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "config diff (fail-on-drift) exit code: $rc"
          cat diffdrift_stdout.txt
          if [ -s diffdrift_stderr.txt ]; then
            echo "--- stderr (drift farkları) ---"
            cat diffdrift_stderr.txt
          fi

      # Drift tespit edilirse (exit 1) bulguları PR yorumuna düş.
      # Yalnızca pull_request olayında; push'ta atlanır. Upsert: aynı yorumu
      # günceller, yeni yorum biriktirmez. Fail-closed kapı SONRAKİ adımda.
      - name: Post config drift findings as PR comment
        if: github.event_name == 'pull_request' && steps.drift.outputs.rc != '0'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const rc = fs.readFileSync('drift_rc.txt', 'utf8').trim();
            const findings = fs.existsSync('drift_stderr.txt')
              ? fs.readFileSync('drift_stderr.txt', 'utf8').trim() : '';

            const MARKER = '<!-- stoic-hume-v5-config-drift -->';
            const body = [
              '## ⚠️ Config drift tespit edildi',
              '',
              '`gen_config.py --dry-run` config ile paket içeriği arasında fark buldu (exit `' + rc + '`):',
              '',
              findings ? '```text\n' + findings + '\n```' : '_bulgu boş_',
              '',
              "Düzeltme: `python3 _calisma/CIKTI/gen_config.py` çalıştırıp config'i paket içeriğinden yeniden üret.",
              '',
              MARKER,
            ].join('\n').trim();

            const existing = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const found = existing.data.find(c => c.body && c.body.includes(MARKER));
            if (found) {
              await github.rest.issues.updateComment({
                comment_id: found.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              console.log(`Config drift yorumu güncellendi: comment_id=${found.id}`);
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              console.log('Config drift yorumu oluşturuldu');
            }

      # Fail-closed kapı (yorumdan SONRA): drift exit koduyla çık.
      # Job fail-closed kalır; yorum adımı yalnızca bilgilendirme ekler.
      - name: Config drift fail-closed gate
        if: always()
        shell: bash
        run: |
          rc=$(cat drift_rc.txt 2>/dev/null || echo 1)
          diffrc=$(cat diffdrift_rc.txt 2>/dev/null || echo 0)
          final=0
          [ "$rc" != "0" ] && final=$rc
          [ "$diffrc" != "0" ] && final=$diffrc
          echo "Config drift final exit code: $final (gen_config=$rc, diff-on-drift=$diffrc)"
          exit "$final"

      # Drift raporunu artifact yap (kapı FAIL olsa bile yüklenir) — böylece
      # reproducibility job'ı manifest.json'a SHA-256 ile sabitler.
      - name: Bundle config drift report
        if: always()
        shell: bash
        run: |
          mkdir -p config-drift
          cp drift_rc.txt config-drift/exit_code.txt
          cp drift_stderr.txt config-drift/findings.txt
          rc=$(cat drift_rc.txt 2>/dev/null || echo 1)
          diffrc=$(cat diffdrift_rc.txt 2>/dev/null || echo 0)
          printf '%s\n' "$diffrc" > config-drift/diff_on_drift_exit.txt
          cp diffdrift_stderr.txt config-drift/diff_on_drift_findings.txt 2>/dev/null \
            || printf '(diff adımı çalışmadı)\n' > config-drift/diff_on_drift_findings.txt
          final=0; [ "$rc" != "0" ] && final=$rc; [ "$diffrc" != "0" ] && final=$diffrc
          verdict=PASS; [ "$final" != "0" ] && verdict=FAIL
          printf 'config-drift exit=%s (gen_config=%s, diff-on-drift=%s) verdict=%s\n' \
            "$final" "$rc" "$diffrc" "$verdict" > config-drift/summary.txt

      - name: Upload config drift report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: config-drift
          path: config-drift/
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # REPACK → VERIFY (SIDECAR SYNC)
  #
  # Kaynak ağacı (V5_ICERIK/, TESLIM/) git'te YOK — yalnızca CIKTI/'daki
  # zip'ler commit'li. Bu job commit'li zip'lerden kaynak ağacını yeniden
  # kurar, repack_delivery.py'yi deterministik koşar ve çıktının commit'li
  # zip'lerle BYTE-IDENTICAL olduğunu doğrular (git diff boş). Fark varsa
  # ya repack determinizmi bozulmuş ya da commit'li zip'ler bayat demektir
  # → FAIL. Ardından verify_delivery.py base (K1-K7) repack sonucu üzerinde
  # koşar. Böylece sidecar senkronu (zip ↔ .sha256) her push'ta otomatik
  # garanti edilir.
  # ──────────────────────────────────────────────────────────────────────
  repack-verify:
    name: Repack determinism + verify (sidecar sync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # repack PDF sidecar için qpdf kullanır (K6-DETERM reuse mantığı);
      # verify base K6 için pdfinfo gerekir.
      - name: Install pdfinfo + qpdf (repack + verify deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      # Deterministik repack — kaynak ağacı commit'li olduğundan doğrudan
      # koşar; --verify repack SONRASI zip'lerin SHA-256'sını .sha256
      # sidecar'larıyla karşılaştırır (eksik/uyuşmazlık → exit 1, fail-closed).
      - name: Run repack_delivery.py (deterministic + sidecar verify)
        run: |
          python3 _calisma/repack_delivery.py --verify

      # SIDECAR SYNC KAPISI: repack çıktısı commit'li dosyaları değiştiriyorsa
      # (git diff boş değilse) byte-identical değildir → FAIL. Kapsam: CIKTI/
      # zip'leri + sidecar'ları + paket içindeki MANIFEST.txt (hepsi repack
      # tarafından yeniden yazılır; gitignore'daki derived çıktılar diff'e
      # girmez).
      - name: Verify byte-identical repack (git diff must be empty)
        run: |
          if ! git diff --exit-code -- _calisma/CIKTI/ _calisma/V5_ICERIK/ _calisma/TESLIM/; then
            echo "::error::repack ciktisi commit'li dosyalarla byte-identical DEGIL — sidecar senkronu bozuk"
            git diff --stat -- _calisma/CIKTI/ _calisma/V5_ICERIK/ _calisma/TESLIM/
            exit 1
          fi
          echo "byte-identical repack OK: commit'li dosyalar <-> repack ciktisi ayni"

      # BYTE-IDENTICAL KANITI (önce/sonra hash): commit'li HEAD zip hash'i
      # ile repack çıktısının hash'ini yan yana hesaplayıp run summary'ye yazar.
      # Önceki adım git diff'i boş kıldığı için burada iki hash BİREBİR aynı
      # olur; tablo denetim izidir (tam SHA-256, kısaltılmamış).
      - name: Write byte-identical proof (before/after hashes) to summary
        run: |
          outer="TESLIM_KLASOR_V5_2026-08-17.zip"
          inner="TESLIM_V5_FINAL_2026-08-17.zip"
          identical=0
          total=0
          {
            echo "## Repack byte-identical kanıtı (önce/sonra SHA-256)"
            echo
            echo "| Dosya | before (HEAD) | after (repack) | Sonuç |"
            echo "|---|---|---|---|"
            for z in "$outer" "$inner"; do
              before="$(git show "HEAD:_calisma/CIKTI/$z" | sha256sum | cut -d' ' -f1)"
              after="$(sha256sum "_calisma/CIKTI/$z" | cut -d' ' -f1)"
              total=$((total + 1))
              if [ "$before" = "$after" ]; then
                verdict="✅ identical"
                identical=$((identical + 1))
              else
                verdict="❌ DIFF"
              fi
              echo "| \`$z\` | \`$before\` | \`$after\` | $verdict |"
            done
            echo
            echo "**SONUÇ:** $identical/$total zip byte-identical (HEAD ↔ repack çıktısı)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "byte-identical kanıtı run summary'ye yazıldı ($identical/$total)"
          [ "$identical" = "$total" ] || { echo "::error::byte-identical DEĞİL (önce/sonra hash farklı)"; exit 1; }

      # Repack sonucu üzerinde base verify (K1-K7) — sidecar'lar senkron,
      # manifest tutarlı.
      - name: Verify repacked package (base K1-K7)
        run: |
          set -o pipefail
          python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI 2>&1 | tee repack_verify_report.txt

      - name: Upload repack-verify report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: repack-verify
          path: repack_verify_report.txt
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # REFS TREND (ADVISORY)
  #
  # refs-online artifact'larını run'lar arası toplar ve "online
  # verification trend" tablosu üretir: her run'da kaç referansın çevrimiçi
  # doğrulandığının zaman serisi (CrossRef/SEP/OpenLibrary/Perseus/IA).
  # GitHub API'den son N run'ın refs-online artifact'ını çeker (GITHUB_TOKEN
  # + actions: read), refs_trend.py özetler. Advisory: API/hız sınırı
  # hataları build'i bloke etmez (continue-on-error).
  # ──────────────────────────────────────────────────────────────────────
  refs-trend:
    name: Online verification trend (refs-online across runs)
    runs-on: ubuntu-latest
    needs: [verify]
    # verify FAIL olsa bile trend geçmiş run'ları gösterir.
    if: always()
    permissions:
      contents: read
      actions: read    # artifact listeleme + zip indirme için
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Son 100 refs-online artifact'ını API'den çekip trend tablosu üretir.
      # Token yoksa script `gh api`'ye düşer; CI'da GITHUB_TOKEN kullanılır.
      - name: Build refs trend table
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 _calisma/CIKTI/refs_trend.py \
            --repo "$GITHUB_REPOSITORY" \
            --out-dir refs-trend \
            --max-artifacts 100

      - name: Upload refs trend
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refs-trend
          path: refs-trend/
          if-no-files-found: ignore
          retention-days: 30
