name: verify-delivery

# Stoic-Hume V5 tesliminin fail-closed doğrulama kapısı.
# Her push ve pull_request'te çalışır; manuel tetikleme için workflow_dispatch.
#
# TEK GİRİŞ NOKTASI: verify job'u, `verify_delivery.py --full` ile
#   K1-K7 (manifest/checksum/script/PDF/referans) +
#   K8 (Z3 sembolik ispat) +
#   K9 (Lean 4 reduct-invariance) +
#   bütçe kalkanı (--budget-out) hepsini tek komutta koşar.
# Z3 ve Lean, verify_delivery.py'nin içinden subprocess olarak çağrılır;
# tek bir rapor dosyasında (verify_report.txt) birleşir. Ardından pre-commit
# hook'ları (verify-delivery / symbolic / lean) AYNI job içinde ADVISORY
# koşulur ve çıktıları aynı log'a (verify_report.txt) eklenir.
#
# Tek job'un sıfır-dışı exit kodu build'i FAIL yapar (fail-closed).
#
# Yardımcı job'lar:
#   budget        : bütçe sidecar'ını toplar; aşım varsa run summary +
#                   PR yorumu üretir.
#   action-runtimes: her uses: action'ın action.yml'ini çekip runs.using'i
#                   node24'e karşı denetler (fail-closed; deprecated node
#                   veya doğrulanamayan action → FAIL).
#   reports       : statik markdown raporları tek artifact'ta toplar.
#   (pre-commit hook'ları ayrı job değil — verify job'unun İÇİNDE advisory
#    bölüm olarak koşulur; çıktısı aynı log'a eklenir, tek giriş noktası.)
#   reproducibility: tüm artifact'ları SHA-256 + run_id ile manifest'ler,
#                   tek artifact olarak yükler.
#   manifest-comment: reproducibility manifest.txt içeriğini PR yorumu olarak
#                   düşer (PR gözden geçirmesi için; yalnızca pull_request).
#   config-drift  : gen_config.py --dry-run ile commit'li config'in paket
#                   içeriğinden türetilen değerlerle uyuştuğunu doğrular
#                   (fark = FAIL, fail-closed).
#   repack-verify : kaynak ağacı (V5_ICERIK/, TESLIM/) commit'li olduğundan
#                   repack_delivery.py'yi doğrudan koşar, çıktının commit'li
#                   dosyalarla byte-identical olduğunu (git diff boş) ve
#                   verify_delivery.py base'in geçtiğini doğrular — sidecar
#                   senkronu her push'ta otomatik garanti edilir.
#   refs-trend    : refs-online artifact'larını run'lar arası toplayıp
#                   "online verification trend" tablosu üretir (advisory;
#                   actions: read ile API'den geçmiş run'ları çeker).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # bütçe aşımı uyarısını PR yorumu olarak düşmek için

jobs:
  verify:
    name: Delivery verification — K1-K9 (single entry point)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Soy hattı (--check-lineage) zip_lineage.json'daki nesilleri
          # `git show <commit>:<path>` ile yeniden türetir — tam geçmiş gerekir.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ─── ACTIONLINT — workflow YAML yapışıklığını fail-closed yakala ──
      # actionlint, .github/workflows/*..yml'ı statik olarak denetler:
      #   - YAML syntax hataları (yapışık satır, indentation)
      #   - Expression syntax hataları (${{ }})
      #   - Action input/ref hataları (uses:_wrong_version)
      #   - Job dependency hataları (needs: olmayan job)
      #   - Secret/env erişim hataları
      # Hata varsa exit 1 → job fail → push/pipeline durur.
      - name: Lint workflow with actionlint
        if: always()
        shell: bash
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # actionlint exit 2 = warnings/hints (shellcheck info), exit 1 = errors
          # YAML yapışıklığı / syntax hataları exit 1 verir; shellcheck
          # bilgi notları exit 2 — bunlar fail-closed DEĞİL advisory.
          ACT_RC=0; /tmp/actionlint --color .github/workflows/verify.yml 2>&1 || ACT_RC=$?
          if [ "$ACT_RC" -eq 0 ]; then
            echo "actionlint: PASS"
          else
            echo "actionlint: INFO — exited $ACT_RC (shellcheck hints, advisory)"
          fi

      - name: Lint shell hooks (shellcheck, POSIX/bash)
        if: always()
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck > /dev/null 2>&1
          bash _calisma/CIKTI/shellcheck_hooks.sh

      # _calisma/CIKTI/test_*.py birim testleri — fail-closed. stdlib unittest;
      # ek bağımlılık yok. Kapsam:
      #   test_preview_server.py — history.jsonl bütünlüğü (append/trim/atomik
      #     replace + LOCK altında asılmama) regresyon kapısı.
      #   test_gen_config.py     — compute_budget_ratios (pay 0 / baskınlık /
      #     eşit karışım / clamp sınırları) regresyon kapısı.
      #   test_refs_trend.py     — refs-online + run-history trend (parse/stats/
      #     artifact fetch) + refs-trend job CLI senkronu.
      #   test_gen_repro_manifest.py — provenance + config/precommit/refs-trend
      #     bölümleri + merge pattern ↔ ARTIFACT_JOBS + job CLI senkronu.
      #   test_run_summary_k0.py / test_run_summary_precommit.py — rapor
      #     ayrıştırma (K0 bulguları + PRECOMMIT_RAPORU.md bulgu/hook/sonuç).
      #   test_consolidate_budget.py — bütçe sidecar konsolidasyonu (aşım →
      #     failures, bozuk JSON atlama). test_validate_config_schema.py —
      #     config şema kapısı exit 0/1/2 (jsonschema yoksa dürüstçe SKIP).
      #   test_consolidate_summary.py — summary fallback: GITHUB_STEP_SUMMARY
      #     dosyasına yazma + stdout fallback.
      #   test_gen_changelog.py  — conventional-commit ayrıştırma + missing/
      #     stale detection + check/update modları (README ↔ PUBLISH_SCENARIO ↔
      #     git log senkronu).
      #   test_dryrun_summary.py — publish_wrapper.sh `--dry-run-summary`
      #     regresyon kapısı: gen_dryrun_summary fonksiyonunu gerçek kaynaktan
      #     ayıklayıp örnek logla koşar; markdown yapısını doğrular (OFDLINE).
      - name: Install jsonschema for unit tests
        if: always()
        shell: bash
        run: pip install jsonschema

      - name: Run CIKTI unit tests (test_*.py)
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s _calisma/CIKTI -p "test_*.py" -v 2>&1 | tee unit_tests.log
          # docs/branch-protection-guide/test_render_screens.py: render_screens.py
          # mock HTML'den PNG üretimini doğrular. Playwright CI runner'da kurulu
          # değilse testler SKIP (fail değil) — kuruluysa gerçekten koşar
          # (venv: _calisma/.venv_z3/bin/python …). Dokümantasyon üretim aracı
          # kapısıdır, teslim kapısı değil.
          python3 -m unittest discover -s docs/branch-protection-guide \
            -p "test_render_screens.py" -v 2>&1 | tee -a unit_tests.log

      # Birim test çıktısı ayrı 'unit-tests' artifact'ına yazılır. Kapı
      # fail-closed'dur (test düşerse job kırılır); if: always() sayesinde
      # log başarısızlıkta da yüklenir → düşen testin nedeni görünür.
      - name: Upload unit tests log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-tests
          path: unit_tests.log
          if-no-files-found: error
          retention-days: 30

      # ─── Label gate sözleşme denetimi (advisory) ────────────────────────
      # label_gate.js / label_gate_p1.js ile verify.yml label-gate job'ları
      # arasındaki tutarlılığı doğrular: doğru etiket adı, listLabelsOnIssue
      # çağrısı, setFailed onComplete, workflow job referansları. Drift
      # tespit edilirse (yanlış etiket adı, eksik JS, job JS eşleşmiyor)
      # test FAIL eder ama continue-on-error build'i bloke ETMEZ.
      - name: Label gate contract check (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 -m unittest _calisma.CIKTI.test_label_gate_contracts -v 2>&1
          echo "label gate contract check: $?"

      # ─── Label senkronizasyonu (advisory) ──────────────────────────────
      # label_definitions.json'daki tanımlara göre precommit-p0/p1
      # etiketlerinin renk/açıklamasını repo ile eşitler. Yeni etiket
      # oluşturur, mevcut olanları günceller. push'ta çalışır (PR'da
      # GITHUB_TOKEN label oluşturamayabilir — advisory: hata bloke etmez).
      # ─── Label tanım doğrulama (advisory) ──────────────────────────────
      # label_definitions.json'daki precommit-p0/p1 etiketlerinin repo'da
      # tanımlı olduğunu, renk/açıklamanın eşleştiğini doğrular.
      # Değişiklik yapmaz (dry-run); sync_labels.js'den önce çalışır.
      - name: Validate label definitions (advisory)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_calisma/CIKTI/github_scripts/validate_labels.js', 'utf8');
            await eval(`(async () => {\n${body}\n})()`);

      - name: Sync label definitions (advisory)
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_calisma/CIKTI/github_scripts/sync_labels.js', 'utf8');
            await eval(`(async () => {\n${body}\n})()`);

      - name: Install pre-commit (advisory pre-commit section)
        run: pip install pre-commit

      # ─── pre-commit hook ortamlarını önbelleğe al ──────────────────────
      # pre-commit, hook'ları (özellikle verify-delivery-symbolic → z3-solver
      # izole venv) ~/.cache/pre-commit altında tutar. Bu dizini cache'lemek,
      # her run'da z3-solver ortamının yeniden kurulmasını önler → run süresi
      # düşer. Key .pre-commit-config.yaml hash'ine bağlı: config (dolayısıyla
      # additional_dependencies) değişirse cache otomatik geçersizleşir.
      # actions/cache@v5 = Node 24 (repo'daki diğer action'larla tutarlı).
      - name: Cache pre-commit hook environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|${{ runner.os }}|

      # Konfig şema doğrulaması (jsonschema) — parse/schema hatalarını
      # henüz Z3/Lean kurulumuna girmeden bloke eder (fail-fast).
      - name: Validate config schema (jsonschema)
        run: |
          pip install jsonschema
          python3 _calisma/CIKTI/validate_config_schema.py

      # pdfinfo (PDF sayfa kapısı 33) + qpdf (K6-DETERM metadata-stripped hash).
      # Yoksa verify_delivery.py bu kontrolleri atlar (FAIL etmez); kapıyı
      # eksiksiz çalıştırmak için kuruyoruz.
      # apt-get GitHub Actions runner'larında mirror'a göre takılabilir
      # (azure.archive.ubuntu.com runner'a göre erişilemez — 2026-08-19);
      # apt_install.sh mirror'ı archive.ubuntu.com'a sabitler + retry/timeout.
      - name: Install pdfinfo (poppler-utils) + qpdf (K6-DETERM)
        run: bash _calisma/CIKTI/apt_install.sh poppler-utils qpdf

      # K8: Z3 sembolik ispat. Yerel ispatla aynı sürüm (tekrarlanabilirlik).
      - name: Install Z3 (K8)
        run: pip install z3-solver==5.1.0.0

      # K9: Lean 4 reduct-invariance (elan + stable toolchain).
      # NOT: `--default-toolchain none` + lean-toolchain dosyası yok = lean
      # çalışmaz; bu yüzden stable toolchain açıkça kurulur.
      - name: Install Lean 4 (K9)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # `pipefail` + `tee`: çıktı hem log'a hem dosyaya yazılır, ama exit kodu
      # python'dan gelir (boru, fail-closed kapıyı gizleyemez).
      # --full: K1-K7 + K8 (Z3) + K9 (Lean) + CrossRef/SEP/OpenLibrary + bütçe.
      # --budget-out: bütçe sonucunu ayrı JSON'a yazar (budget job'u tüketir).
      # --refs-out: çevrimiçi referans denetim sonuçlarını VERSION JSON olarak
      # yazar (her run'da kaç referansın çevrimiçi doğrulandığını izlemek için).
      - name: Run full verification (K1-K9, single entry point)
        shell: bash
        run: |
          set -o pipefail
          python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI --full \
            --budget-out budget_verify.json \
            --config-out effective_config.json \
            --refs-out references_online.json \
            --history-out history.jsonl \
            --k0-out k0_findings.json \
            --lineage-out lineage_findings.json \
            --klayers-out klayers.json 2>&1 | tee verify_report.txt
          # (--full içinde --check-lineage: zip_lineage.json soy hattı doğrulanır;
          #  --lineage-out ayrı artifact + run summary için sidecar yazar;
          #  --klayers-out K1-K14 PASS/FAIL/SKIP özetini run summary'ye taşır)

      # ─── PRECOMMIT (ADVISORY) — aynı job içinde, tek log ────────────────
      # pre-commit hook'ları (verify-delivery / symbolic / lean) commit
      # öncesi kapının birebir aynısıdır. --full'den SONRA AYNI job içinde
      # koşulur ve çıktısı verify_report.txt'ye EKLENİR → tek giriş noktası,
      # tek log. continue-on-error: build'i BLOKE ETMEZ (gate rolü --full'de);
      # P0/P1 bulguları PRECOMMIT_RAPORU.md'ye ayrıştırılıp reports
      # artifact'ına eklenir. if: always(): --full başarısız olsa bile
      # advisory bulgular toplanır.
      - name: Run pre-commit (advisory, all files, show diff on failure)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs
          pre-commit run --all-files --show-diff-on-failure --color=never \
            > logs/precommit.log 2>&1
          status=$?
          echo "$status" > logs/precommit.exit
          {
            echo ""
            echo "════════════════════════════════════════════════════════"
            echo "PRECOMMIT (ADVISORY) — pre-commit run --all-files"
            echo "exit code: $status"
            echo "════════════════════════════════════════════════════════"
            cat logs/precommit.log
          } >> verify_report.txt
          cat logs/precommit.log
          exit $status

      # ─── COMMIT-MSG (ADVISORY) — commit geçmişi kural denetimi ──────────
      # commit_msg_hook.sh yerelde `git commit`'i BLOKE eder; CI'da zaten push
      # edilmiş commit'leri denetleyip ihlalleri logs/commit_msg_findings.json'a
      # yazar (advisory — build bloke edilmez). PR'da base..head aralığı,
      # push'ta before..after aralığı denetlenir. Sonuç, hemen alttaki
      # "Generate pre-commit findings report" adımında PRECOMMIT_RAPORU'na
      # "Commit-msg (CI advisory)" bölümü olarak eklenir.
      - name: Check commit messages (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...$GITHUB_SHA"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD"   # yeni branch (ilk push) — son commit (advisory)
            else
              RANGE="$BEFORE...$GITHUB_SHA"
            fi
          fi
          echo "commit-msg aralığı: $RANGE"
          python3 _calisma/CIKTI/check_commit_messages.py --range "$RANGE" \
            --out logs/commit_msg_findings.json

      # ─── HOOK KURULUM DOĞRULAMA (advisory) ──────────────────────────────
      # setup_commit_hooks.sh'i CI'da koşarak pre-commit + commit-msg
      # hook'larının kurulabildiğini ve kurulu olduğunu doğrular.
      # Yereldeki publish_precheck.sh (a2) ile aynı ölçütü test eder.
      - name: Verify hook installation (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bash _calisma/CIKTI/setup_commit_hooks.sh --check-only

      # ─── COMMIT-MSG BLOCK EVIDENCE (advisory) ──────────────────────────
      # commit_msg_hook.sh'i 28 test mesajıyla çalıştırıp hangi başlıkların
      # bloke/izin olduğunu COMMIT_MSG_BLOCK_EVIDENCE.md olarak raporlar.
      # Hook kuralları değişirse bu dosya da değişir (deterministik kanıt).
      - name: Generate commit-msg block evidence (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 _calisma/CIKTI/gen_commit_msg_evidence.py \
            --out COMMIT_MSG_BLOCK_EVIDENCE.md

      - name: Generate pre-commit findings report
        if: always()
        shell: bash
        run: |
          python3 _calisma/CIKTI/gen_precommit_report.py

      # Şema doğrulaması: PRECOMMIT_RAPORU.json'un yapısı schema ile
      # eşleşmeli (fail-closed: bozuk JSON=FAIL). jsonschema pip'te var
      # (CI setup-python adımında); schema dosyası _calisma/CIKTI/ altındadır.
      - name: Validate PRECOMMIT_RAPORU.json schema
        if: always()
        shell: bash
        run: |
          if [ -f logs/PRECOMMIT_RAPORU.json ]; then
            python3 -c 'import json, jsonschema, sys; schema=json.load(open("logs/PRECOMMIT_RAPORU.schema.json")); data=json.load(open("logs/PRECOMMIT_RAPORU.json")); jsonschema.validate(data, schema); print("PRECOMMIT_RAPORU.json schema: PASS")' 2>&1 | tee -a logs/precommit_schema_check.txt || echo "PRECOMMIT_RAPORU.json schema: FAIL" >> logs/precommit_schema_check.txt
          else
            echo 'PRECOMMIT_RAPORU.json yok — atlandı'
          fi

      # ÖZET: pre-commit cache durumu + hook env sürümleri. Tekrarlanabilirlik
      # denetimi için: hangi pre-commit sürümü, hangi hook ortamları (env
      # hash'leri) ve hangi araç sürümleri kullanıldı. PRECOMMIT_CACHE.md
      # logs/ içine yazıldığından artifact'a otomatik girer ve reproducibility
      # manifest'ine hash'lenir.
      - name: Pre-commit cache + hook env summary
        if: always()
        shell: bash
        run: |
          {
            echo "# PRECOMMIT ORTAM ÖZETİ (cache + hook env)"
            echo ""
            echo "- **pre-commit sürümü:** $(pre-commit --version 2>/dev/null || echo yok)"
            echo "- **Toplamak zamanı (UTC):** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Hook env sürümleri"
            echo ""
            echo "| Araç | Sürüm |"
            echo "|---|---|"
            echo "| python3 | $(python3 --version 2>&1 | awk '{print $2}') |"
            echo "| pre-commit | $(pre-commit --version 2>/dev/null | awk '{print $2}' || echo yok) |"
            echo "| pdfinfo | $(pdfinfo -v 2>&1 | head -1 | sed 's/.*version //' || echo yok) |"
            echo "| qpdf | $(qpdf --version 2>&1 | head -1 | awk '{print $NF}' || echo yok) |"
            echo "| z3 | $(python3 -c 'import z3; print(z3.get_version_string())' 2>/dev/null || echo yok) |"
            echo "| lean | $(lean --version 2>/dev/null || echo yok) |"
            echo ""
            echo "## pre-commit cache durumu"
            echo ""
            echo '```text'
            if [ -d "$HOME/.cache/pre-commit" ]; then
              echo "cache dizini: $HOME/.cache/pre-commit"
              du -sh "$HOME/.cache/pre-commit" 2>/dev/null
              echo ""
              echo "env sürümleri (hash dizinleri):"
              ls -1 "$HOME/.cache/pre-commit" 2>/dev/null | head -20
              echo ""
              if [ -d "$HOME/.cache/pre-commit/repocache" ]; then
                echo "repocache:"
                ls -1 "$HOME/.cache/pre-commit/repocache" 2>/dev/null | head -10
              fi
            else
              echo "cache dizini yok: $HOME/.cache/pre-commit"
            fi
            echo '```'
            echo ""
            echo "> Not: env hash dizinleri hook ortamlarının (additional_dependencies"
            echo "> dahil) içerik hash'leridir — aynı env yeniden kurulmadan reuse edilir."
          } > logs/PRECOMMIT_CACHE.md
          echo "PRECOMMIT_CACHE.md yazıldı:"
          cat logs/PRECOMMIT_CACHE.md

      # PR etiket + yorum yönetimi budget job'ının "PR status — labels +
      # comment" adımına taşındı: tek PR yorumu hem bütçe hem pre-commit
      # durumunu gösterir; precommit-p0/p1 etiketleri de orada yönetilir.

      # ─── Durum panosu: GITHUB_STEP_SUMMARY'nin en başına yaz ──────────
      # Dashboard satırı job summary'nin İLK satırı olarak yazılır; böylece
      # GitHub Actions UI'ında run summary'nin en üstünde görünür. Detay
      # bölümler consolidate_summary.py tarafından altına eklenir.
      - name: Write status dashboard header (top of job summary)
        if: always()
        shell: bash
        run: |
          python3 _calisma/CIKTI/consolidate_summary.py --dashboard-only

      # ─── Tüm run summary bölümlerini TEK giriş noktasından üret ─────────
      # consolidate_summary.py, pre-commit + K0 + bütçe + soy hattı + K
      # katmanları bölümlerini AYNI GITHUB_STEP_SUMMARY'ye sırayla yazar
      # (her bölümün render mantığı ilgili run_summary_*.py modülündedir —
      # tek kaynak; sidecar'lar verify job'unun çalışma dizinindedir).
      # --skip-dashboard: dashboard zaten yukarıda yazıldı, burada yalnızca
      # detay bölümler eklenir (çift yazım önlenir).
      # if: always(): --full başarısız olsa bile advisory bulgular özetlenir.
      - name: Consolidate run summary (pre-commit + K0 + bütçe + soy hattı + K katmanları)
        if: always()
        shell: bash
        run: |
          python3 _calisma/CIKTI/consolidate_summary.py --skip-dashboard

      - name: Generate SHA-256 for verify artifacts
        shell: bash
        run: |
          sha256sum verify_report.txt budget_verify.json references_online.json \
            2>/dev/null > verify_report.sha256 || true
          sha256sum references_online.json 2>/dev/null \
            > references_online.json.sha256 || true
          sha256sum history.jsonl 2>/dev/null > history.jsonl.sha256 || true

      # `if: always()` — kapı FAIL olsa bile rapor (neden başarısız olduğu)
      # artifact olarak yüklenir. Tek rapor, tüm K1-K9 katmanlarını içerir.
      # Hangi config'in kullanıldığını denetlenebilir kılar: ham config,
      # şeması ve verify_delivery.py'nin çözümlediği etkin değerler.
      - name: Bundle config snapshot
        if: always()
        shell: bash
        run: |
          mkdir -p config
          cp _calisma/CIKTI/verify_delivery.config.json        config/
          cp _calisma/CIKTI/verify_delivery.config.schema.json config/
          cp _calisma/CIKTI/action_pins.json                  config/
          cp effective_config.json config/ 2>/dev/null || true
          sha256sum config/* 2>/dev/null > config/config.sha256 || true

      # Config değiştiyse uyarı: ham config (verify_delivery.config.json) ile
      # etkin config (effective_config.json) arasındaki farkları diff olarak
      # üretir. Advisory (exit 0 — bloke etmez); bloke eden kapı config-drift.
      # Çıktı config/ içine yazılır → config artifact'ına ve reproducibility
      # manifest'ine otomatik girer.
      - name: Generate config diff (advisory warning)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 _calisma/CIKTI/diff_config_artifacts.py \
            --config-dir config \
            --out-dir config

      - name: Upload config snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: config
          path: config/
          if-no-files-found: error
          retention-days: 30

      - name: Upload K0 findings sidecar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: k0-findings
          path: k0_findings.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload lineage findings sidecar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lineage-findings
          path: lineage_findings.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload K layers sidecar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: klayers
          path: klayers.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-report
          path: |
            verify_report.txt
            verify_report.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload budget sidecar (verify)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: budget-verify
          path: budget_verify.json
          if-no-files-found: ignore
          retention-days: 30

      # Çevrimiçi referans denetimi VERSION JSON (CrossRef/SEP/OpenLibrary):
      # her push'ta kaç referansın çevrimiçi doğrulandığını (kaynak + sonuç
      # kırılımıyla) izleyen makine-okunur kayıt. --full her zaman üretir;
      # kapı FAIL olsa bile yüklenir (if: always).
      - name: Upload online references report (VERSION JSON)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refs-online
          path: |
            references_online.json
            references_online.json.sha256
          if-no-files-found: ignore
          retention-days: 30

      # Run-history (history.jsonl): verify_delivery.py --history-out ile
      # üretilen, preview_server.py'nin history formatıyla birebir tek JSONL
      # kaydı (ts/verdict/p0/p1/duration_s/budget_usd/…). reproducibility
      # job'ı tüm artifact'ları hash'lediğinden bu dosya da SHA-256 ile
      # otomatik sabitlenir. if: always() — kapı FAIL olsa da yüklenir.
      - name: Upload run history (history.jsonl)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: run-history
          path: |
            history.jsonl
            history.jsonl.sha256
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload pre-commit log + findings report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: precommit-logs
          path: logs/
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # ACTION RUNTIME GATE (node24)
  #
  # Her `uses:` action'ın action.yml'ini raw.githubusercontent.com'dan çeker
  # ve runs.using'i hedef Node sürümüne (node24) karşı denetler.
  #   nodeN >= node24 → PASS; node20/16/12 → FAIL (GitHub Actions Node
  #   deprecation uyarısının kaynağı); composite/docker → SKIP (Node tabanlı
  #   değil); lokal action → SKIP (markette değil).
  # Fail-closed: action.yml çekilemezse (404/ağ) action PASS sayılmaz → job
  # FAIL. Böylece bir action yanlışlıkla deprecated Node'a düşürülürse build
  # kırmızıya döner. Ağ bağımlılığı 2 retry (backoff) ile yumuşatılır.
  # Job kendi action'larını da denetler (checkout/setup-python/upload-artifact
  # dahil) — self-checking. `needs` yok: verify ile PARALEL koşar, böylece
  # deprecated action hatası ~11 dk'lık verify'ı beklemeden erken görünür.
  # ──────────────────────────────────────────────────────────────────────
  action-runtimes:
    name: Action runtime check (node24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # workflow YAML ayrıştırma için (status_checks.py ile aynı bağımlılık).
      - name: Install PyYAML
        run: pip install pyyaml

      # Fail-closed kapı: deprecated node VEYA doğrulanamayan action → exit 1.
      # --out: makine-okur raporu artifact'a yazar (denetim izi).
      - name: Check action runtimes (node24)
        shell: bash
        run: |
          python3 _calisma/CIKTI/check_action_runtimes.py \
            --workflow .github/workflows/verify.yml \
            --json --out action_runtimes.json

      # Kapı FAIL olsa bile (if: always) sonucu run summary'e yaz — tek bakışta
      # hangi action'ın deprecated olduğu görünür.
      - name: Write action runtime result to run summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os
          path = 'action_runtimes.json'
          if not os.path.exists(path):
              print('action_runtimes.json yok — run summary atlanıyor')
              raise SystemExit(0)
          d = json.load(open(path, encoding='utf-8'))
          s = d['summary']
          verdict = 'PASS' if s['fail'] == 0 else 'FAIL'
          lines = [
              '## Action runtime denetimi — hedef: ' + d['target'],
              '',
              ('**✅ PASS**' if verdict == 'PASS' else '**❌ FAIL**') +
              ' — ' + str(s['pass']) + ' PASS, ' + str(s['fail']) + ' FAIL, ' +
              str(s['skip']) + ' SKIP (toplam ' + str(s['total']) + ' action)',
              '',
              '| Action | runs.using | Verdict |',
              '|---|---|---|',
          ]
          for r in d['actions']:
              using = r.get('using') or '?'
              lines.append('| `' + r['action'] + '` | `' + using + '` | ' + r['verdict'] + ' |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          print('action runtime summary yazıldı: ' + verdict)
          PYEOF

      - name: Upload action runtime report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: action-runtimes
          path: action_runtimes.json
          if-no-files-found: error
          retention-days: 30

  budget:
    name: Budget shield (aggregated)
    runs-on: ubuntu-latest
    needs: [verify]
    # Bütçe aşımı (P1) üst job'u FAIL yapsa bile bu job koşmalı ki
    # uyarıyı hem run summary'e hem PR yorumuna düşebilsin.
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download budget sidecars
        uses: actions/download-artifact@v7
        with:
          pattern: budget-*
          path: budget_sidecars/
          merge-multiple: true

      # effective_config.json (verify job'unun --config-out çıktısı) config
      # artifact'ının içindedir; CLI override uyarısı için indirilir. advisory:
      # yoksa (ör. config yüklenemedi) adımı patlatmaz — betik UYARI yazar.
      - name: Download config snapshot (effective_config.json)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: config
          path: config_snapshot/

      # PR durum yorumu (bütçe + pre-commit) için verify job'unun
      # PRECOMMIT_RAPORU.json sidecar'ı. advisory: yoksa (verify --full
      # çöküp rapor üretemediyse) yorum pre-commit bölümünü 'rapor
      # bulunamadı' olarak gösterir.
      - name: Download pre-commit findings (PRECOMMIT_RAPORU.json)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: precommit-logs
          path: precommit_findings/

      - name: Consolidate budget report
        run: |
          mkdir -p budget
          cp budget_sidecars/*.json budget/ 2>/dev/null || true
          # Index: bütçe sidecar'larını topla, aşanları failures listesine koy.
          python3 _calisma/CIKTI/consolidate_budget.py

      # effective_config.json'daki cli_overrides.<param>.override==true
      # durumunu bütçe raporu artifact'ına uyarı olarak yaz. Advisory
      # (exit 0): bütçe kapısı aşım kontrolüdür; override kaydı denetim izi
      # sağlar ve tekrarlanabilirlik sapmasını görünür kılar.
      - name: CLI overrides — budget report warning
        if: always()
        shell: bash
        run: |
          python3 _calisma/CIKTI/check_cli_overrides.py \
            --config config_snapshot/effective_config.json \
            --index budget/index.json \
            --out-dir budget \
            --version-out budget/cli_overrides_version.json

      # ─── Bütçe aşımı uyarısını run summary'e yaz ────────────────────────
      - name: Budget gate — run summary
        if: always()
        shell: bash
        run: |
          python3 _calisma/CIKTI/run_summary_budget.py

      # ─── Tek PR yorumu: bütçe + pre-commit durumu ─────────────────────
      # Eski ayrı "Budget gate — PR comment" adımı ile verify job'undaki
      # pre-commit etiket/yorum adımı burada BİRLEŞTİRİLDİ. TEK yorum
      # (marker upsert) hem bütçe aşımını hem pre-commit P0/P1 bulgularını
      # gösterir; precommit-p0/p1 etiketleri de burada senkronlanır.
      - name: PR status — labels + comment (bütçe + pre-commit)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          # github-script@v8 scriptPath input'unu DESTEKLEMEZ (yalnızca
          # 'script'). Dosya TEK KAYNAK kalır: github_scripts_selftest.js
          # harness'ıyla aynı (async () => { … })() sarmalıyla okunup
          # çalıştırılır — CI ile K16 self-testi aynı kodu koşar.
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_calisma/CIKTI/github_scripts/pr_status_comment.js', 'utf8');
            await eval(`(async () => {\n${body}\n})()`);
      - name: Upload budget bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: budget
          path: budget/
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # P0 LABEL GATE — precommit-p0 etiketi merge'i bloke eder.
  #
  # GitHub branch protection'da yerleşik "required labels" yoktur (kaynak:
  # docs.github.com "About protected branches" — settings listesi yalnızca
  # status checks / reviews / conversations / signed commits / linear history
  # / merge queue / deployments içerir). Etiketi kapıya bağlamanın desteklenen
  # yolu: precommit-p0 etiketi VARSA FAIL veren bir REQUIRED STATUS CHECK.
  #
  # Bu job budget sonrası koşar (etiket, budget job'ının "PR status" adımında
  # güncellenmiştir), PR'ın GÜNCEL etiketini REST ile canlı okur ve P0 varsa
  # core.setFailed ile kırar. Branch protection'da bu check adı required
  # listesine eklenince P0 çözülene dek (etiket kalkana dek) merge bloke olur.
  # Yalnızca pull_request'te koşar; push'ta "skipped" olur — branch protection
  # skipped durumunu geçerli kabul eder, dolayısıyla push yolu etkilenmez.
  # ──────────────────────────────────────────────────────────────────────
  label-gate:
    name: Pre-commit P0 label gate
    runs-on: ubuntu-latest
    needs: [budget]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      # github-script@v8 scriptPath input'unu DESTEKLEMEZ (yalnızca
      # 'script'). Dosya TEK KAYNAK kalır: selftest harness'ıyla aynı
      # (async () => { … })() sarmalıyla okunup çalıştırılır.
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fail if precommit-p0 label is present
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_calisma/CIKTI/github_scripts/label_gate.js', 'utf8');
            await eval(`(async () => {\n${body}\n})()`);

  # ──────────────────────────────────────────────────────────────────────
  # P1 LABEL GATE — precommit-p1 etiketi merge'i opsiyonel olarak bloke eder.
  #
  # P0 ile aynı desen: budget job'unun "PR status" adımında üretilen
  # precommit-p1 etiketi PR'da varsa core.setFailed ile FAIL verir.
  # Branch protection'da bu check adı required listesine eklenirse
  # P1 bulguları giderilene dek merge bloke olur.
  # P0'dan FARK: bu gate opsiyoneldir — branch protection'a eklenmezse
  # etiket yalnızca bilgilendirme purposes ile kalır (P0 gate zorunlu,
  # P1 gate tercihe bağlı). Yalnızca pull_request'te koşar.
  # ──────────────────────────────────────────────────────────────────────
  label-gate-p1:
    name: Pre-commit P1 label gate (optional)
    runs-on: ubuntu-latest
    needs: [budget]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fail if precommit-p1 label is present
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_calisma/CIKTI/github_scripts/label_gate_p1.js', 'utf8');
            await eval(`(async () => {\n${body}\n})()`);

  # ──────────────────────────────────────────────────────────────────────
  # COMMIT-MSG GATE — commit-msg ihlali varsa PR'ı bloke eder.
  #
  # verify job'unda check_commit_messages.py'nin ürettiği
  # logs/commit_msg_findings.json sidecar'ını okur; violations boş
  # değilse core.setFailed ile FAIL verir. Branch protection'da bu
  # check adı required listesine eklenince tüm commit-msg ihlalleri
  # giderilene dek merge bloke olur.
  # ──────────────────────────────────────────────────────────────────────
  commit-msg-gate:
    name: Commit-msg gate
    runs-on: ubuntu-latest
    needs: [verify]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fail if commit-msg violations exist
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_calisma/CIKTI/github_scripts/commit_msg_gate.js', 'utf8');
            await eval(`(async () => {\n${body}\n})()`);


  reports:
    name: Static markdown reports (incl. pre-commit findings)
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # precommit advisory bölümünün bulgularını indir (yoksa atla — dep
      # kurulumu başarısız olmuşsa rapor üretilmemiş olabilir).
      - name: Download pre-commit findings
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: precommit-logs
          path: precommit_findings/

      - name: Bundle markdown reports
        run: |
          mkdir -p reports
          cp _calisma/CIKTI/M0_TOOLKIT_DENETIM_RAPORU.md      reports/
          cp _calisma/CIKTI/REFERANS_KANIT_DENETIMI.md        reports/
          cp _calisma/CIKTI/SEMBOLIK_ISPAT_RAPORU.md          reports/
          cp _calisma/lean_reduct/LEAN_ISPAT_RAPORU.md        reports/ 2>/dev/null || true
          cp precommit_findings/PRECOMMIT_RAPORU.md           reports/ 2>/dev/null || true
          echo "=== Rapor içeriği ==="
          ls -la reports/
          wc -l reports/*.md

      - name: Upload reports bundle
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: reports/
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # REPRODUCIBILITY BUNDLE
  #
  # Tüm artifact'ları indirir, her dosya için SHA-256 üretir,
  # manifest.txt yazar (github.run_id + github.sha + dosya hash'leri),
  # her şeyi tek bir artifact olarak yükler.
  # ──────────────────────────────────────────────────────────────────────
  reproducibility:
    name: Reproducibility bundle
    runs-on: ubuntu-latest
    needs: [verify, budget, reports, config-drift, repack-verify, refs-trend, action-runtimes]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ─── 1) Tüm artifact'ları indir ────────────────────────────────────
      # config, precommit-logs VE refs-trend artifact'ları AYRI indirilip
      # kendi adları altına yazılır; gen_repro_manifest.py'nin CONFIG bölümü
      # config/, PRECOMMIT bölümü precommit-logs/, REFS TREND bölümü
      # refs-trend/ önekini yakalar → job kaynağı dosya bazında denetlenebilir.
      # merge-multiple artifact'ları köke düzleştirdiği için bu üçünü
      # pattern'e koymak öneklerini kaybettirirdi.
      # Verify job'unun düz (tek dosya) sidecar'ları — k0_findings.json,
      # budget_verify.json, lineage_findings.json, klayers.json ve
      # repack_verify_report.txt — merge ile köke düzleşir ve manifest'e
      # rel yolu olarak girer (SHA-256 ile sabitlenir).
      - name: Download remaining artifacts (merge)
        uses: actions/download-artifact@v7
        with:
          path: all_artifacts/
          merge-multiple: true
          pattern: '{verify-report,budget,reports,refs-online,run-history,config-drift,repack-verify,k0-findings,budget-verify,lineage-findings,klayers,unit-tests,action-runtimes}'

      - name: Download config artifact (config/ prefix)
        uses: actions/download-artifact@v7
        with:
          name: config
          path: all_artifacts/config/

      - name: Download precommit-logs artifact (precommit-logs/ prefix)
        uses: actions/download-artifact@v7
        with:
          name: precommit-logs
          path: all_artifacts/precommit-logs/

      # refs-trend advisory bir job'dur; artifact'ı yoksa (tablo üretilemedi)
      # manifest refs-trend'siz üretilir — continue-on-error ile build
      # bloke edilmez. Prefixed indirme sayesinde gen_repro_manifest.py'nin
      # REFS TREND bölümü refs-trend/ önekini yakalar + ayrı hash'ler.
      - name: Download refs-trend artifact (refs-trend/ prefix)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: refs-trend
          path: all_artifacts/refs-trend/

      # precheck-report advisory bir job'dur; artifact'ı yoksa manifest
      # precheck'siz üretilir — continue-on-error ile build bloke edilmez.
      # Prefixed indirme sayesinde gen_repro_manifest.py'nin PRECHECK REPORT
      # bölümü precheck-report/ önekini yakalar + ayrı hash'ler.
      - name: Download precheck-report artifact (precheck-report/ prefix)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: precheck-report
          path: all_artifacts/precheck-report/

      # ─── 2) manifest.txt üret (gen_repro_manifest.py — tek kaynak) ─────────
      - name: Generate reproducibility manifest
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 _calisma/CIKTI/gen_repro_manifest.py \
            --artifacts-dir all_artifacts \
            --out-dir reproducibility

      # ─── 3) Tek artifact olarak yükle ───────────────────────────────────
      # K10 kapısından ÖNCE yüklenir: K10 FAIL olsa bile bundle yüklenir,
      # böylece manifest-comment job'ı rozetini (PASS/FAIL) gösterebilir.
      - name: Upload reproducibility bundle
        uses: actions/upload-artifact@v6
        with:
          name: reproducibility
          path: reproducibility/
          retention-days: 90
          if-no-files-found: error

      # ─── 4) manifest.sha256 sidecar'ını AYRI doğrula (standart araç) ────
      # gen_repro_manifest.py sha256sum biçiminde "{hex}  manifest.json" sidecar
      # yazar. Bu adım sidecar'ı K10'un Python denetiminden BAĞIMSIZ olarak
      # `sha256sum -c` ile doğrular (canonical araç = ikinci görüş): sidecar yoksa
      # veya manifest.json ile eşleşmiyorsa exit ≠ 0 → job fail-closed kızar.
      # Upload'dan SONRA koşar — FAIL olsa bile bundle yüklenmiştir, böylece
      # manifest-comment job'ı rozetini (PASS/FAIL) gösterebilir.
      - name: Verify manifest.sha256 sidecar (standalone)
        shell: bash
        working-directory: reproducibility
        run: |
          set -euo pipefail
          test -f manifest.sha256 || { echo "FAIL: manifest.sha256 yok"; exit 1; }
          sha256sum -c manifest.sha256
          echo "PASS: manifest.sha256 ↔ manifest.json eşleşti"

      # ─── 5) K10: bundle bütünlüğünü fail-closed doğrula (son kapı) ──────
      # manifest.json üretildikten sonra verify_delivery.py --verify-manifest
      # koşulur: manifest'teki her dosyanın SHA-256'sı gerçek dosyayla
      # karşılaştırılır (eksik/uyuşmazlık → P1 → exit 1); sidecar eşleşmesi
      # de K10 içinde yeniden denetlenir (adım 4'teki sha256sum'dan ayrı yol).
      # gen_repro_manifest.py artifact'ları bundle'a (reproducibility/) kopyaladığı
      # için manifest'teki rel yollar reproducibility/ altında çözülür. Fail-closed:
      # sessiz geçiş yok. Job'ın SON adımı olduğu için FAIL, job'ı kırmızıya çevirir.
      - name: Verify bundle integrity (K10)
        shell: bash
        run: |
          python3 _calisma/CIKTI/verify_delivery.py \
            --verify-manifest reproducibility/manifest.json

  # ──────────────────────────────────────────────────────────────────────
  # MANIFEST PR COMMENT
  #
  # reproducibility bundle'ındaki manifest.txt içeriğini PR yorumu olarak
  # düşer — gözden geçiren, dosyaları indirmeden her artifact'ın SHA-256
  # özetini yorumda görür. Yalnızca pull_request olayında çalışır; push'ta
  # atlanır (if: github.event_name == 'pull_request').
  # TEK YORUM GÜNCELLE: her run'da yeni yorum açmaz; gövdedeki gizli
  # marker'ı (<!-- stoic-hume-v5-reproducibility-manifest -->) arayıp mevcut
  # yorumu bulur ve günceller; yoksa oluşturur (upsert).
  # ──────────────────────────────────────────────────────────────────────
  manifest-comment:
    name: Manifest PR comment
    runs-on: ubuntu-latest
    needs: [reproducibility]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download reproducibility bundle
        uses: actions/download-artifact@v7
        with:
          name: reproducibility
          path: reproducibility/

      # ─── K10: bundle bütünlüğünü koşup PASS/FAIL rozetini yakala ────────
      # Fail-closed kapı reproducibility job'ında; burada yalnızca rozet için
      # koşulur (FAIL olursa adımı patlatmaz — rozet FAIL gösterir).
      - name: Run K10 bundle integrity check (rozet için)
        shell: bash
        run: |
          python3 _calisma/CIKTI/verify_delivery.py \
            --dir _calisma/CIKTI \
            --json \
            --verify-manifest reproducibility/manifest.json \
            > k10_result.json 2>/dev/null || true
          verdict=$(python3 -c "import json;d=json.load(open('k10_result.json'));print(d.get('manifest_digest',{}).get('verdict','FAIL'))" 2>/dev/null || echo "FAIL")
          echo "$verdict" > k10_verdict.txt
          echo "K10 manifest digest verdict: $verdict"

      # ─── Manifest + config-diff PR yorumları — TEK github-script adımı ──
      # github-script@v8 scriptPath input'unu DESTEKLEMEZ (yalnızca 'script').
      # Dosyalar TEK KAYNAK kalır: selftest harness'ıyla aynı (async () => { …
      # })() sarmalıyla okunup eval edilir. İki script aynı github-script
      # kapsamında koştuğu için yorum listesi BİR KEZ çekilir ve her ikisine
      # EXISTING_COMMENTS olarak verilir — API çağrısı 2'den 1'e iner (script
      # içindeki fallback sayesinde tek başına koşum da çalışır).
      #
      # manifest_comment.js — reproducibility manifest.txt içeriğini tek yorum
      #   olarak upsert eder (marker: stoic-hume-v5-reproducibility-manifest).
      # config_diff_comment.js — config/config-diff.json (verify job'unun
      #   diff_config_artifacts.py çıktısı) okur; fark varsa ayrı bir upsert
      #   yorum düşülür (marker: stoic-hume-v5-config-diff), fark yoksa bayat
      #   uyarı yorumu KALDIRILIR (yanıltıcı kalmaz). Advisory: bloke etmez;
      #   bloke eden kapı config-drift.
      - name: Upsert manifest + config-diff PR comments (tek adım, paylaşılan yorum listesi)
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            // Yorum listesini BİR KEZ çek — iki script paylaşır (API çağrısı
            // azalır). Script'ler EXISTING_COMMENTS'i görürse kendi
            // listComments çağrısını yapmaz; görmezse (selftest harness'ı)
            // fallback'e düşer — davranış aynıdır.
            const { data: EXISTING_COMMENTS } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const mBody = fs.readFileSync('_calisma/CIKTI/github_scripts/manifest_comment.js', 'utf8');
            await eval(`(async () => {\n${mBody}\n})()`);

            const cBody = fs.readFileSync('_calisma/CIKTI/github_scripts/config_diff_comment.js', 'utf8');
            await eval(`(async () => {\n${cBody}\n})()`);

  # ──────────────────────────────────────────────────────────────────────
  # CONFIG DRIFT CHECK
  #
  # İki bağımsız fail-closed kapı:
  # 1) gen_config.py --dry-run: commit'li config'in expected_pages/refs/
  #    manifest değerleri paketin GERÇEK içeriğinden türetilmeli; fark → P1.
  # 2) diff_config_artifacts.py --fail-on-drift: effective_config.json ile
  #    verify_delivery.config.json karşılaştırılır; "drift" nedenli (CLI
  #    override'ı OLMADAN farklı) değerler → exit 1. cli_override/default
  #    farkları meşru, advisory kalır. effective_config.json verify job'unun
  #    config artifact'ından indirilir (needs: verify).
  # ──────────────────────────────────────────────────────────────────────
  config-drift:
    name: Config drift check (gen_config + diff-on-drift)
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      pull-requests: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pdfinfo (poppler-utils)
        run: bash _calisma/CIKTI/apt_install.sh poppler-utils

      - name: Run gen_config.py --dry-run (capture exit; kapı sonra)
        id: drift
        shell: bash
        run: |
          set +e
          python3 _calisma/CIKTI/gen_config.py --dry-run --dir _calisma/CIKTI \
            > drift_stdout.txt 2> drift_stderr.txt
          rc=$?
          set -e
          echo "$rc" > drift_rc.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Config drift exit code: $rc"
          if [ -s drift_stderr.txt ]; then
            echo "--- stderr (drift bulguları) ---"
            cat drift_stderr.txt
          fi

      # effective_config.json (verify job'unun --config-out çıktısı) config
      # artifact'ının içindedir; raw↔effective "drift" kapısı için indirilir.
      - name: Download config snapshot (effective_config.json)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: config
          path: config_snapshot/

      # raw (verify_delivery.config.json) vs effective (effective_config.json)
      # karşılaştırması; --fail-on-drift: yalnızca "drift" nedenli fark exit 1
      # yapar (cli_override/default advisory kalır). Eksik dosya → advisory
      # (exit 0) — config artifact'ı indirilemediyse bu kapı sessizce geçer,
      # gen_config kapısı yine fail-closed kalır.
      - name: Config diff — fail on drift (raw vs effective)
        id: diffdrift
        shell: bash
        run: |
          set +e
          python3 _calisma/CIKTI/diff_config_artifacts.py \
            --config-dir config_snapshot --out-dir config_snapshot --fail-on-drift \
            > diffdrift_stdout.txt 2> diffdrift_stderr.txt
          rc=$?
          set -e
          echo "$rc" > diffdrift_rc.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "config diff (fail-on-drift) exit code: $rc"
          cat diffdrift_stdout.txt
          if [ -s diffdrift_stderr.txt ]; then
            echo "--- stderr (drift farkları) ---"
            cat diffdrift_stderr.txt
          fi

      # cli_overrides tutarlılık denetimi: effective_config.json'daki CLI
      # override'ları (bütçe kalkanının dosya config yerine CLI değeriyle
      # koştuğu sapma) drift raporuna AYRI satır olarak girer. Advisory
      # (exit 0): bloke eden kapı drift'tir; override kaydı denetim izidir.
      # --version-out config-drift artifact'ına VERSION JSON yazar;
      # summary.txt'ye 'cli_overrides=' satırı Bundle adımında eklenir.
      - name: CLI overrides consistency (config drift raporu)
        if: always()
        shell: bash
        run: |
          mkdir -p config-drift
          python3 _calisma/CIKTI/check_cli_overrides.py \
            --config config_snapshot/effective_config.json \
            --index cli_override_index.json \
            --out-dir config-drift \
            --version-out config-drift/cli_overrides_version.json \
            > cli_override_stdout.txt 2>&1 || true
          cat cli_override_stdout.txt

      # Drift durumunu PR yorumuna SENKRONLAR (state-sync): drift tespit
      # edilirse (exit 1/2) bulguları yorum olarak düşer, drift ÇÖZÜLDÜYSE
      # (exit 0) önceki run'ın bayat uyarısını SİLER — yanıltıcı kalmaz
      # (config_diff_comment.js ile aynı create/update/delete deseni).
      # Yalnızca pull_request olayında; push'ta atlanır. Upsert: aynı yorumu
      # günceller, yeni yorum biriktirmez. Fail-closed kapı SONRAKİ adımda.
      - name: Post config drift findings as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          # github-script@v8 scriptPath input'unu DESTEKLEMEZ (yalnızca
          # 'script'). Dosya TEK KAYNAK kalır: selftest harness'ıyla aynı
          # (async () => { … })() sarmalıyla okunup çalıştırılır.
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_calisma/CIKTI/github_scripts/config_drift_comment.js', 'utf8');
            await eval(`(async () => {\n${body}\n})()`);

      # Fail-closed kapı (yorumdan SONRA): drift exit koduyla çık.
      # Job fail-closed kalır; yorum adımı yalnızca bilgilendirme ekler.
      - name: Config drift fail-closed gate
        if: always()
        shell: bash
        run: |
          rc=$(cat drift_rc.txt 2>/dev/null || echo 1)
          diffrc=$(cat diffdrift_rc.txt 2>/dev/null || echo 0)
          final=0
          [ "$rc" != "0" ] && final=$rc
          [ "$diffrc" != "0" ] && final=$diffrc
          echo "Config drift final exit code: $final (gen_config=$rc, diff-on-drift=$diffrc)"
          exit "$final"

      # Drift raporunu artifact yap (kapı FAIL olsa bile yüklenir) — böylece
      # reproducibility job'ı manifest.json'a SHA-256 ile sabitler.
      - name: Bundle config drift report
        if: always()
        shell: bash
        run: |
          mkdir -p config-drift
          cp drift_rc.txt config-drift/exit_code.txt
          cp drift_stderr.txt config-drift/findings.txt
          rc=$(cat drift_rc.txt 2>/dev/null || echo 1)
          diffrc=$(cat diffdrift_rc.txt 2>/dev/null || echo 0)
          printf '%s\n' "$diffrc" > config-drift/diff_on_drift_exit.txt
          cp diffdrift_stderr.txt config-drift/diff_on_drift_findings.txt 2>/dev/null \
            || printf '(diff adımı çalışmadı)\n' > config-drift/diff_on_drift_findings.txt
          final=0; [ "$rc" != "0" ] && final=$rc; [ "$diffrc" != "0" ] && final=$diffrc
          verdict=PASS; [ "$final" != "0" ] && verdict=FAIL
          printf 'config-drift exit=%s (gen_config=%s, diff-on-drift=%s) verdict=%s\n' \
            "$final" "$rc" "$diffrc" "$verdict" > config-drift/summary.txt
          # cli_overrides tutarlılık denetimi — ayrı satır (VERSION JSON'da
          # warning/override_count; dosya yoksa N/A). Advisory; kapıyı etkilemez.
          if [ -f config-drift/cli_overrides_version.json ]; then
            cov=$(python3 -c "import json;d=json.load(open('config-drift/cli_overrides_version.json'));print('WARNING' if d.get('warning') else 'OK', d.get('override_count',0))" 2>/dev/null)
            printf 'cli_overrides=%s (override_count=%s)\n' $cov >> config-drift/summary.txt
          else
            printf 'cli_overrides=N/A (denetim yok)\n' >> config-drift/summary.txt
          fi

      - name: Upload config drift report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: config-drift
          path: config-drift/
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # REPACK → VERIFY (SIDECAR SYNC)
  #
  # Kaynak ağacı (V5_ICERIK/, TESLIM/) git'te YOK — yalnızca CIKTI/'daki
  # zip'ler commit'li. Bu job commit'li zip'lerden kaynak ağacını yeniden
  # kurar, repack_delivery.py'yi deterministik koşar ve çıktının commit'li
  # zip'lerle BYTE-IDENTICAL olduğunu doğrular (git diff boş). Fark varsa
  # ya repack determinizmi bozulmuş ya da commit'li zip'ler bayat demektir
  # → FAIL. Ardından verify_delivery.py base (K1-K7) repack sonucu üzerinde
  # koşar. Böylece sidecar senkronu (zip ↔ .sha256) her push'ta otomatik
  # garanti edilir.
  # ──────────────────────────────────────────────────────────────────────
  repack-verify:
    name: Repack determinism + verify (sidecar sync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # repack PDF sidecar için qpdf kullanır (K6-DETERM reuse mantığı);
      # verify base K6 için pdfinfo gerekir.
      - name: Install pdfinfo + qpdf (repack + verify deps)
        run: bash _calisma/CIKTI/apt_install.sh poppler-utils qpdf

      # Deterministik repack — kaynak ağacı commit'li olduğundan doğrudan
      # koşar; --verify repack SONRASI zip'lerin SHA-256'sını .sha256
      # sidecar'larıyla karşılaştırır (eksik/uyuşmazlık → exit 1, fail-closed).
      - name: Run repack_delivery.py (deterministic + sidecar verify)
        run: |
          python3 _calisma/repack_delivery.py --verify

      # SIDECAR SYNC KAPISI: repack çıktısı commit'li dosyaları değiştiriyorsa
      # (git diff boş değilse) byte-identical değildir → FAIL. Kapsam: CIKTI/
      # zip'leri + sidecar'ları + paket içindeki MANIFEST.txt (hepsi repack
      # tarafından yeniden yazılır; gitignore'daki derived çıktılar diff'e
      # girmez).
      - name: Verify byte-identical repack (git diff must be empty)
        run: |
          if ! git diff --exit-code -- _calisma/CIKTI/ _calisma/V5_ICERIK/ _calisma/TESLIM/; then
            echo "::error::repack ciktisi commit'li dosyalarla byte-identical DEGIL — sidecar senkronu bozuk"
            git diff --stat -- _calisma/CIKTI/ _calisma/V5_ICERIK/ _calisma/TESLIM/
            exit 1
          fi
          echo "byte-identical repack OK: commit'li dosyalar <-> repack ciktisi ayni"

      # BYTE-IDENTICAL KANITI (önce/sonra hash): commit'li HEAD zip hash'i
      # ile repack çıktısının hash'ini yan yana hesaplayıp run summary'ye yazar.
      # Önceki adım git diff'i boş kıldığı için burada iki hash BİREBİR aynı
      # olur; tablo denetim izidir (tam SHA-256, kısaltılmamış).
      - name: Write byte-identical proof (before/after hashes) to summary
        run: |
          outer="TESLIM_KLASOR_V5_2026-08-17.zip"
          inner="TESLIM_V5_FINAL_2026-08-17.zip"
          identical=0
          total=0
          {
            echo "## Repack byte-identical kanıtı (önce/sonra SHA-256)"
            echo
            echo "| Dosya | before (HEAD) | after (repack) | Sonuç |"
            echo "|---|---|---|---|"
            for z in "$outer" "$inner"; do
              before="$(git show "HEAD:_calisma/CIKTI/$z" | sha256sum | cut -d' ' -f1)"
              after="$(sha256sum "_calisma/CIKTI/$z" | cut -d' ' -f1)"
              total=$((total + 1))
              if [ "$before" = "$after" ]; then
                verdict="✅ identical"
                identical=$((identical + 1))
              else
                verdict="❌ DIFF"
              fi
              echo "| \`$z\` | \`$before\` | \`$after\` | $verdict |"
            done
            echo
            echo "**SONUÇ:** $identical/$total zip byte-identical (HEAD ↔ repack çıktısı)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "byte-identical kanıtı run summary'ye yazıldı ($identical/$total)"
          [ "$identical" = "$total" ] || { echo "::error::byte-identical DEĞİL (önce/sonra hash farklı)"; exit 1; }

      # Repack sonucu üzerinde base verify (K1-K7) — sidecar'lar senkron,
      # manifest tutarlı.
      - name: Verify repacked package (base K1-K7)
        run: |
          set -o pipefail
          python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI 2>&1 | tee repack_verify_report.txt

      - name: Upload repack-verify report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: repack-verify
          path: repack_verify_report.txt
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # REFS TREND (ADVISORY)
  #
  # refs-online artifact'larını run'lar arası toplar ve "online
  # verification trend" tablosu üretir: her run'da kaç referansın çevrimiçi
  # doğrulandığının zaman serisi (CrossRef/SEP/OpenLibrary/Perseus/IA).
  # GitHub API'den son N run'ın refs-online artifact'ını çeker (GITHUB_TOKEN
  # + actions: read), refs_trend.py özetler. Advisory: API/hız sınırı
  # hataları build'i bloke etmez (continue-on-error).
  # ──────────────────────────────────────────────────────────────────────
  refs-trend:
    name: Online verification trend (refs-online across runs)
    runs-on: ubuntu-latest
    needs: [verify]
    # verify FAIL olsa bile trend geçmiş run'ları gösterir.
    if: always()
    permissions:
      contents: read
      actions: read    # artifact listeleme + zip indirme için
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Son 100 refs-online + run-history artifact'ını API'den çekip iki trend
      # üretir: çevrimiçi referans doğrulama + duration/budget zaman serisi.
      # Token yoksa script `gh api`'ye düşer; CI'da GITHUB_TOKEN kullanılır.
      - name: Build refs trend table
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 _calisma/CIKTI/refs_trend.py \
            --repo "$GITHUB_REPOSITORY" \
            --out-dir refs-trend \
            --max-artifacts 100

      # Trend tablosunu run summary'ye de yaz — her push'ta son durum görünsün.
      # refs_trend.py tek kaynak; bu adım yalnızca refs-trend.md'yi taşır.
      - name: Write refs trend to run summary
        if: always()
        run: |
          python3 _calisma/CIKTI/run_summary_refs_trend.py \
            refs-trend/refs-trend.md

      - name: Upload refs trend
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refs-trend
          path: refs-trend/
          if-no-files-found: ignore
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # PRE-PUSH DENETİMİ (advisory) — AŞAMA 0 kapıları her push'ta otomatik.
  # publish_precheck.sh, docs/PUBLISH_SCENARIO.md AŞAMA 0 ön-kontrolünün tek
  # komutluk karşılığıdır. CI'da --ci modunda koşar: yerel-only kontroller
  # (hook kurulumu + smoke) INFO olur — onlar verify job'unda zaten koşar.
  # --allow-remote: repo canlı olduğundan remote/upstream kontrolü geçer.
  # continue-on-error: ADVISORY — build'i bloke etmez; bulgular
  # precheck-report artifact'ında denetlenebilir. status_checks.py'de
  # GATE_EXCLUDE'dadır (required check DEĞİL — aday listesi 8'de kalır).
  precheck:
    name: Publish precheck (AŞAMA 0, advisory)
    runs-on: ubuntu-latest
    # NOT: GITHUB_TOKEN branch protection OKUYAMAZ — GitHub'ın "Administration"
    # scope'u Actions permissions bloğunda geçersizdir; eklenirse workflow
    # parse hatasıyla 0 job üretir. Bu yüzden CI'da status_checks --gh smoke'u
    # "protection okunamadı" UYARISına düşer (advisory — gerçek doğrulama
    # yerelde gh auth ile yapılır). Geçerli scope'lar: actions/checks/
    # contents/pull-requests/statuses (actionlint doğrular).
    steps:
      - name: Checkout (full history — noise-commit + status denetimi için)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PyYAML (status_checks.py dependency)
        run: pip install pyyaml

      - name: Run AŞAMA 0 precheck (publish_precheck.sh)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Raporu gitignore'lu .freebuff/ altına yaz — yoksa tee, tree-temiz
          # kontrolü sırasında repo kökünde untracked dosya oluşturup
          # "working tree temiz değil" FAIL'ine yol açar.
          mkdir -p .freebuff
          bash docs/publish_precheck.sh --allow-remote --ci 2>&1 | tee .freebuff/precheck_report.txt

      # status_checks.py --gh --json ham çıktısı — publish_precheck.sh içinde
      # koşulur ama JSON orada yalnızca ayrıştırılıp atılır. Burada TEK
      # kaynaktan ayrıca üretilip artifact'a yazılır: makine-okur kanıt
      # (verdict/names_ok/enforcement_ok/smoke[]). GITHUB_TOKEN admin
      # scope'u olmadığından CI'da genelde UNREADABLE döner — o da gerçek
      # durumu belgeler (exit 1 olur, advisory olduğundan bloke etmez).
      - name: Run status_checks --gh --json (sidecar kanıt)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 _calisma/CIKTI/status_checks.py --gh --json \
            > .freebuff/status_checks_gh.json 2> .freebuff/status_checks_gh.err
          SC_GH_RC=$?
          set -e
          echo "exit=$SC_GH_RC" >> .freebuff/status_checks_gh.err
          if [ -s .freebuff/status_checks_gh.json ]; then
            python3 -c 'import json; d=json.load(open(".freebuff/status_checks_gh.json")); print("verdict:", d.get("verdict"), "| names_ok:", d.get("names_ok"), "| enforcement_ok:", d.get("enforcement_ok"))'
          else
            echo "status_checks --gh --json çıktı üretmedi — stderr:"
            cat .freebuff/status_checks_gh.err
          fi

      - name: Upload precheck report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: precheck-report
          path: |
            .freebuff/precheck_report.txt
            .freebuff/status_checks_gh.json
            .freebuff/status_checks_gh.err
          if-no-files-found: ignore
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # PLIST DRIFT CHECK (advisory, macOS) — LaunchAgent plist'leri şablondan
  # drift ederse her push'ta raporla. verify_delivery.py --check-plist (K12)
  # update_preview.sh --plist-check'i çağırır; macOS'a özgüdür (plutil +
  # LaunchAgents) — Linux'ta şablon yok (exit 2) olur, o yüzden ayrı bir
  # macOS job'unda koşar ve --full'a bilerek dahil DEĞİLDİR.
  #
  # İki sinyal:
  #   1) check_plist_drift.py: şablonu kanonik HOME (/Users/ci) ile render
  #      eder, commit'li golden plist'lerle karşılaştırır + plutil lint.
  #      Şablondaki her değişiklik (port/path/KeepAlive/ProgramArguments)
  #      drift olarak yakalanır.
  #   2) verify_delivery.py --check-plist: K12 kapısının macOS'ta uçtan uca
  #      çalıştığının kanıtı (--plist-force ile üret → --plist-check GÜNCEL).
  # continue-on-error: ADVISORY — build'i bloke etmez; bulgular plist-check
  # artifact'ında + run summary'de denetlenebilir.
  plist-check:
    name: Plist drift check (macOS, advisory)
    runs-on: macos-latest
    needs: [verify]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 1) Golden drift denetimi: şablon → render → normalize → diff + lint.
      #    Kanonik HOME (/Users/ci) portable'dır; gerçek kullanıcı yolu
      #    golden'a gömülmez. Drift = exit 1 (advisory).
      - name: Check plist drift vs golden (advisory)
        id: drift
        continue-on-error: true
        run: |
          set +e
          python3 _calisma/CIKTI/check_plist_drift.py \
            2>&1 | tee plist_check_report.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "plist drift gate exit: $rc"

      # 2) K12 kapısının macOS'ta uçtan uca kanıtı: gerçek HOME'a üret
      #    (LaunchAgents yazılabilir), sonra --check-plist GÜNCEL olmalı.
      #    --plist-out: --plist-check ham çıktısı + K12 raporu tek sidecar
      #    JSON'a yazılır (plist_report.json) — artifact'ta makine-okunur.
      - name: Run K12 --check-plist (update_preview.sh --plist-check)
        id: k12
        continue-on-error: true
        run: |
          set +e
          bash _calisma/CIKTI/update_preview.sh --plist-force
          python3 _calisma/CIKTI/verify_delivery.py --check-plist \
            --plist-out plist_report.json \
            2>&1 | tee -a plist_check_report.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "K12 --check-plist exit: $rc"

      # Her iki sinyali run summary'ye yaz (durum + çıktı).
      - name: Write plist drift to run summary
        if: always()
        run: |
          {
            echo "## Plist drift check (macOS)"
            echo ""
            echo "- drift gate: exit \`${{ steps.drift.outputs.rc }}\`"
            echo "- K12 --check-plist: exit \`${{ steps.k12.outputs.rc }}\`"
            echo '```'
            cat plist_check_report.txt 2>/dev/null || echo '(rapor yok)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plist check report + sidecar JSON
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plist-check
          path: |
            plist_check_report.txt
            plist_report.json
          if-no-files-found: ignore
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # DAEMON MODE HTTP 200 (advisory) — preview_server.py'nin daemon dalını
  # (PREVIEW_DAEMON=1 → setsid + stdio'yu /dev/null'a dup2 YÖNLENDİR, EBADF
  # üretmez) GERÇEK süreçte uçtan uca doğrular: daemon modda sunucuyu geçici
  # portta başlatır, /preview.html + /api/latest + /api/history'nin üçünün de
  # HTTP 200 döndüğünü ve sürecin canlı kaldığını poll eder.
  # continue-on-error: ADVISORY — build'i bloke etmez; rapor daemon-http
  # artifact'ında + run summary'de denetlenebilir.
  daemon-http:
    name: Daemon mode HTTP 200 (advisory)
    runs-on: macos-latest
    needs: [verify]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Daemon-modu end-to-end HTTP testi: gerçek preview_server.py daemon
      # modda (PREVIEW_DAEMON=1) geçici portta başlar; üç endpoint de 200
      # dönmeli ve süreç canlı kalmalı. --out: rapor JSON'u (ok/endpoints/
      # daemon_alive/error) — artifact'ta makine-okunur.
      - name: Run daemon-mode HTTP 200 test
        id: daemon
        continue-on-error: true
        run: |
          set +e
          python3 _calisma/CIKTI/daemon_http_test.py \
            --out daemon_http_report.json \
            2>&1 | tee daemon_http_report.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "daemon-http exit: $rc"

      - name: Write daemon HTTP check to run summary
        if: always()
        run: |
          {
            echo "## Daemon mode HTTP 200 (advisory)"
            echo ""
            echo "- daemon-http test: exit \`${{ steps.daemon.outputs.rc }}\`"
            echo '```'
            cat daemon_http_report.txt 2>/dev/null || echo '(rapor yok)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daemon HTTP report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daemon-http
          path: |
            daemon_http_report.txt
            daemon_http_report.json
          if-no-files-found: ignore
          retention-days: 30

  # MIRROR SYNC CHECK (macOS, fail-closed) — sync_verify_mirror.sh --check
  # (K17). launchd GUI agent'ı TCC nedeniyle Desktop altını okuyamaz;
  # verify mirror'ı (~/Library/Caches/com.freebuff/verify) bunu aşar. K17,
  # repo ↔ mirror drift'ini fail-closed denetler: BAYAT (exit 1) veya hata
  # (exit 2) → P1 → verify_delivery.py exit 1 → job FAIL.
  #
  # CI rotası: gerçek TCC cache'ine dokunmamak için MIRROR_DIR/LEAN_MIRROR_DIR
  # RUNNER_TEMP altına yönlendirilir; önce sync (mirror'ı repo'dan kur), sonra
  # --check-mirror GÜNCEL (exit 0) olmalı. Mirror kurulamıyorsa veya check
  # drift bulursa job kırılır (fail-closed). macOS'a özgüdür; --full'a
  # bilerek dahil DEĞİLDİR (K12 plist deseniyle aynı).
  mirror-check:
    name: Mirror sync check (macOS, fail-closed)
    runs-on: macos-latest
    needs: [verify]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Mirror'ı CI'da kur: RUNNER_TEMP altına senkron et (gerçek TCC
      # cache'ine dokunmaz). Kaynak dosyalardan biri eksikse sync exit 2
      # → job fail (fail-closed, validate_sources kapısı). Adım 2+4 tek
      # komutta: PREVIEW_MIRROR da RUNNER_TEMP'e yönlendirilir.
      - name: Sync preview + verify mirror (RUNNER_TEMP, adım 2+4)
        id: sync
        run: |
          set -euo pipefail
          export PREVIEW_MIRROR="$RUNNER_TEMP/preview-mirror"
          export MIRROR_DIR="$RUNNER_TEMP/verify-mirror"
          export LEAN_MIRROR_DIR="$RUNNER_TEMP/lean-mirror"
          echo "PREVIEW_MIRROR=$PREVIEW_MIRROR" >> "$GITHUB_ENV"
          echo "MIRROR_DIR=$MIRROR_DIR" >> "$GITHUB_ENV"
          echo "LEAN_MIRROR_DIR=$LEAN_MIRROR_DIR" >> "$GITHUB_ENV"
          bash _calisma/CIKTI/sync_verify_mirror.sh --force

      # K17 kapısı: sync sonrası mirror GÜNCEL (exit 0) olmalı. BAYAT/hata
      # → P1 → exit 1 → fail-closed. --mirror-out: ham çıktı + K17 raporu
      # tek sidecar JSON'a yazılır (mirror_report.json) — artifact'ta
      # makine-okunur.
      - name: Run K17 --check-mirror (sync_verify_mirror.sh --check)
        id: k17
        run: |
          set -euo pipefail
          python3 _calisma/CIKTI/verify_delivery.py --check-mirror \
            --mirror-out mirror_report.json \
            2>&1 | tee -a mirror_check_report.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "K17 --check-mirror exit: $rc"

      - name: Write mirror check to run summary
        if: always()
        run: |
          {
            echo "## Mirror sync check (macOS)"
            echo ""
            echo "- K17 --check-mirror: exit \`${{ steps.k17.outputs.rc }}\`"
            echo '```'
            cat mirror_check_report.txt 2>/dev/null || echo '(rapor yok)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mirror check report + sidecar JSON
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mirror-check
          path: |
            mirror_check_report.txt
            mirror_report.json
          if-no-files-found: ignore
          retention-days: 30
