name: verify-delivery

# Stoic-Hume V5 tesliminin fail-closed doğrulama kapısı.
# Her push ve pull_request'te çalışır; manuel tetikleme için workflow_dispatch.
#
# TEK GİRİŞ NOKTASI: verify job'u, `verify_delivery.py --full` ile
#   K1-K7 (manifest/checksum/script/PDF/referans) +
#   K8 (Z3 sembolik ispat) +
#   K9 (Lean 4 reduct-invariance) +
#   bütçe kalkanı (--budget-out) hepsini tek komutta koşar.
# Z3 ve Lean, verify_delivery.py'nin içinden subprocess olarak çağrılır;
# tek bir rapor dosyasında (verify_report.txt) birleşir.
#
# Tek job'un sıfır-dışı exit kodu build'i FAIL yapar (fail-closed).
#
# Yardımcı job'lar:
#   budget        : bütçe sidecar'ını toplar; aşım varsa run summary +
#                   PR yorumu üretir.
#   reports       : statik markdown raporları tek artifact'ta toplar.
#   precommit     : pre-commit hook'larını ADVISORY koşar (build bloke etmez);
#                   bulguları rapor (reports) artifact'ına yazar.
#   reproducibility: tüm artifact'ları SHA-256 + run_id ile manifest'ler,
#                   tek artifact olarak yükler.
#   manifest-comment: reproducibility manifest.txt içeriğini PR yorumu olarak
#                   düşer (PR gözden geçirmesi için; yalnızca pull_request).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # bütçe aşımı uyarısını PR yorumu olarak düşmek için

jobs:
  verify:
    name: Delivery verification — K1-K9 (single entry point)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Konfig şema doğrulaması (jsonschema) — parse/schema hatalarını
      # henüz Z3/Lean kurulumuna girmeden bloke eder (fail-fast).
      - name: Validate config schema (jsonschema)
        run: |
          pip install jsonschema
          python3 _calisma/CIKTI/validate_config_schema.py

      # pdfinfo (PDF sayfa kapısı 33) + qpdf (K6-DETERM metadata-stripped hash).
      # Yoksa verify_delivery.py bu kontrolleri atlar (FAIL etmez); kapıyı
      # eksiksiz çalıştırmak için kuruyoruz.
      - name: Install pdfinfo (poppler-utils) + qpdf (K6-DETERM)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      # K8: Z3 sembolik ispat. Yerel ispatla aynı sürüm (tekrarlanabilirlik).
      - name: Install Z3 (K8)
        run: pip install z3-solver==5.1.0.0

      # K9: Lean 4 reduct-invariance (elan + stable toolchain).
      # NOT: `--default-toolchain none` + lean-toolchain dosyası yok = lean
      # çalışmaz; bu yüzden stable toolchain açıkça kurulur.
      - name: Install Lean 4 (K9)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # `pipefail` + `tee`: çıktı hem log'a hem dosyaya yazılır, ama exit kodu
      # python'dan gelir (boru, fail-closed kapıyı gizleyemez).
      # --full: K1-K7 + K8 (Z3) + K9 (Lean) + CrossRef/SEP/OpenLibrary + bütçe.
      # --budget-out: bütçe sonucunu ayrı JSON'a yazar (budget job'u tüketir).
      # --refs-out: çevrimiçi referans denetim sonuçlarını VERSION JSON olarak
      # yazar (her run'da kaç referansın çevrimiçi doğrulandığını izlemek için).
      - name: Run full verification (K1-K9, single entry point)
        shell: bash
        run: |
          set -o pipefail
          python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI --full \
            --budget-out budget_verify.json \
            --config-out effective_config.json \
            --refs-out references_online.json 2>&1 | tee verify_report.txt

      - name: Generate SHA-256 for verify artifacts
        shell: bash
        run: |
          sha256sum verify_report.txt budget_verify.json references_online.json \
            2>/dev/null > verify_report.sha256 || true
          sha256sum references_online.json 2>/dev/null \
            > references_online.json.sha256 || true

      # `if: always()` — kapı FAIL olsa bile rapor (neden başarısız olduğu)
      # artifact olarak yüklenir. Tek rapor, tüm K1-K9 katmanlarını içerir.
      # Hangi config'in kullanıldığını denetlenebilir kılar: ham config,
      # şeması ve verify_delivery.py'nin çözümlediği etkin değerler.
      - name: Bundle config snapshot
        if: always()
        shell: bash
        run: |
          mkdir -p config
          cp _calisma/CIKTI/verify_delivery.config.json        config/
          cp _calisma/CIKTI/verify_delivery.config.schema.json config/
          cp effective_config.json config/ 2>/dev/null || true
          sha256sum config/* 2>/dev/null > config/config.sha256 || true

      - name: Upload config snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: config/
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            verify_report.txt
            verify_report.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload budget sidecar (verify)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-verify
          path: budget_verify.json
          if-no-files-found: ignore
          retention-days: 30

      # Çevrimiçi referans denetimi VERSION JSON (CrossRef/SEP/OpenLibrary):
      # her push'ta kaç referansın çevrimiçi doğrulandığını (kaynak + sonuç
      # kırılımıyla) izleyen makine-okunur kayıt. --full her zaman üretir;
      # kapı FAIL olsa bile yüklenir (if: always).
      - name: Upload online references report (VERSION JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refs-online
          path: |
            references_online.json
            references_online.json.sha256
          if-no-files-found: ignore
          retention-days: 30

  budget:
    name: Budget shield (aggregated)
    runs-on: ubuntu-latest
    needs: [verify]
    # Bütçe aşımı (P1) üst job'u FAIL yapsa bile bu job koşmalı ki
    # uyarıyı hem run summary'e hem PR yorumuna düşebilsin.
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download budget sidecars
        uses: actions/download-artifact@v4
        with:
          pattern: budget-*
          path: budget_sidecars/
          merge-multiple: true

      - name: Consolidate budget report
        run: |
          mkdir -p budget
          cp budget_sidecars/*.json budget/ 2>/dev/null || true
          # Index: bütçe sidecar'larını topla, aşanları failures listesine koy.
          python3 - <<'PY'
          import json, glob, sys
          rows = []
          for p in sorted(glob.glob("budget/*.json")):
              try:
                  r = json.load(open(p))
                  r["source"] = p.split("/")[-1]
                  rows.append(r)
              except Exception as e:
                  print(f"skip {p}: {e}", file=sys.stderr)
          failures = [
              {
                  "source": r.get("source"),
                  "limit": r.get("limit"),
                  "estimated_usd": r.get("estimated_usd"),
                  "tokens_est": r.get("tokens_est"),
                  "method": r.get("method"),
              }
              for r in rows
              if r.get("verdict") != "OK"
          ]
          summary = {
              "tool": "verify_delivery.py bütçe kalkanı",
              "date": rows[0]["date"] if rows else None,
              "method": "v3_verify.py H4 (token ≈ bytes/4, $3/M token + $0.55)",
              "runs": rows,
              "any_fail": bool(failures),
              "failures": failures,
          }
          json.dump(summary, open("budget/index.json", "w"), indent=2, ensure_ascii=False)
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      # ─── Bütçe aşımı uyarısını run summary'e yaz ────────────────────────
      - name: Budget gate — run summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          path = "budget/index.json"
          if not os.path.isfile(path):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                  s.write("## ⚠️ Bütçe kalkanı: sidecar bulunamadı (verify job'u çalışmadı)\n")
              raise SystemExit(0)
          summary = json.load(open(path))
          failures = summary.get("failures", [])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              if failures:
                  s.write("## ⚠️ Bütçe limiti aşıldı\n\n")
                  for f in failures:
                      src = f.get("source") or "bilinmeyen"
                      lim = f.get("limit")
                      est = f.get("estimated_usd")
                      tok = f.get("tokens_est")
                      over = round((est or 0) - (lim or 0), 2)
                      s.write(f"- **{src}**: ${est} / ${lim} limiti "
                              f"(+${over} aşım, ~{tok} token)\n")
                  s.write(f"\n> Yöntem: `{summary.get('method', '')}`. "
                          f"Fail-closed: P1 bulgusu olarak işaretlendi.\n")
              else:
                  runs = summary.get("runs", [])
                  total = round(sum(r.get("estimated_usd", 0) or 0 for r in runs), 2)
                  s.write("## ✅ Bütçe kalkanı: tüm job'lar limit içinde\n\n")
                  for r in runs:
                      s.write(f"- **{r.get('source')}**: ${r.get('estimated_usd')} "
                              f"/ ${r.get('limit')} (~{r.get('tokens_est')} token)\n")
                  if runs:
                      s.write(f"\nToplam: ${total}\n")
          print("Budget summary written to run summary.")
          PY

      # ─── Bütçe aşımı uyarısını PR yorumu olarak düş ─────────────────────
      - name: Budget gate — PR comment (on exceedance)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'budget/index.json';
            if (!fs.existsSync(path)) return;
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const failures = summary.failures || [];
            if (failures.length === 0) return;

            const lines = failures.map(f =>
              `- **${f.source || 'bilinmeyen'}**: $${f.estimated_usd} / $${f.limit} limiti ` +
              `(+$${(f.estimated_usd - f.limit).toFixed(2)} aşım, ~${f.tokens_est} token)`
            );
            const body = [
              '⚠️ **Bütçe limiti aşıldı**',
              '',
              ...lines,
              '',
              `> Yöntem: \`${summary.method}\`. Fail-closed: P1 bulgusu olarak işaretlendi.`,
              `> Detay: [run #${context.runId}](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload budget bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget
          path: budget/
          retention-days: 30
          if-no-files-found: error

  reports:
    name: Static markdown reports (incl. pre-commit findings)
    runs-on: ubuntu-latest
    needs: [precommit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # precommit advisory job'unun bulgularını indir (yoksa atla — dep
      # kurulumu başarısız olmuşsa rapor üretilmemiş olabilir).
      - name: Download pre-commit findings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: precommit-logs
          path: precommit_findings/

      - name: Bundle markdown reports
        run: |
          mkdir -p reports
          cp _calisma/CIKTI/M0_TOOLKIT_DENETIM_RAPORU.md      reports/
          cp _calisma/CIKTI/REFERANS_KANIT_DENETIMI.md        reports/
          cp _calisma/CIKTI/SEMBOLIK_ISPAT_RAPORU.md          reports/
          cp _calisma/lean_reduct/LEAN_ISPAT_RAPORU.md        reports/ 2>/dev/null || true
          cp precommit_findings/PRECOMMIT_RAPORU.md           reports/ 2>/dev/null || true
          echo "=== Rapor içeriği ==="
          ls -la reports/
          wc -l reports/*.md

      - name: Upload reports bundle
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # PRECOMMIT (ADVISORY) — commit öncesi kapının aynısını CI'da koş, bulguları
  # rapor artifact'ına yaz. verify job'u --full koşarken, bu job
  # .pre-commit-config.yaml'daki üç hook'u (verify-delivery / symbolic / lean)
  # `pre-commit run` üzerinden birebir çalıştırır. continue-on-error:
  # build'i BLOKE ETMEZ (gate rolü verify job'unda); P0/P1 bulguları
  # PRECOMMIT_RAPORU.md'ye ayrıştırılıp reports artifact'ına eklenir.
  # ──────────────────────────────────────────────────────────────────────
  precommit:
    name: Pre-commit hooks + logs (artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      # verify-delivery hook'u (base mod) K6 için pdfinfo + qpdf kullanır;
      # yoksa ilgili kontroller atlanır — tam kapı için kuruyoruz.
      - name: Install pdfinfo + qpdf (verify-delivery hook deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      # verify-delivery-lean hook'u `lean` gerektirir (elan + stable toolchain).
      # z3-solver, verify-delivery-symbolic hook'unun additional_dependencies
      # alanından pre-commit tarafından otomatik kurulur.
      - name: Install Lean 4 (verify-delivery-lean hook)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # ADVISORY: continue-on-error — build'i BLOKE ETMEZ (gate rolü verify
      # job'unda); başarısızlık UI'da kırmızı görünür ama job geçer.
      # --show-diff-on-failure: başarısız bir hook dosya DEĞİŞTİRSEYDİ diff'i
      # gösterir (bu repo'nun hook'ları read-only; geleceğe dönük güvence).
      - name: Run pre-commit (advisory, all files, show diff on failure)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs
          pre-commit run --all-files --show-diff-on-failure --color=never \
            > logs/precommit.log 2>&1
          status=$?
          echo "$status" > logs/precommit.exit
          { echo ""; echo "=== pre-commit exit code: $status ==="; } >> logs/precommit.log
          cat logs/precommit.log
          exit $status

      # Ham logdan hook durumlarını + P0/P1 bulgularını ayrıştırıp markdown
      # bir rapora dönüştürür. Bu rapor reports job'u tarafından `reports`
      # artifact'ına eklenir (bulgular tek yerde denetlenir).
      - name: Generate pre-commit findings report
        if: always()
        shell: python3 {0}
        run: |
          import re, datetime, pathlib

          log = pathlib.Path("logs/precommit.log")
          log_text = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
          try:
              exit_code = int(pathlib.Path("logs/precommit.exit").read_text().strip())
          except Exception:
              exit_code = 1

          hooks = [
              {"name": m.group(1).strip(), "status": m.group(2)}
              for m in re.finditer(r"^(.*?)\.{4,}(Passed|Failed)\s*$", log_text, re.M)
          ]
          findings = []
          for pri in ("P0", "P1"):
              for m in re.finditer(rf"^\[{pri}\] (.+)$", log_text, re.M):
                  findings.append((pri, m.group(1).strip()))

          now = datetime.datetime.utcnow().isoformat() + "Z"
          verdict = "PASS" if exit_code == 0 else "FAIL"
          lines = [
              "# PRECOMMIT DENETİM RAPORU (CI advisory)",
              "",
              f"- **Tarih (UTC):** {now}",
              "- **Komut:** `pre-commit run --all-files --show-diff-on-failure`",
              f"- **Sonuç:** {verdict} (exit {exit_code})",
              "- **Rol:** advisory — build'i bloke etmez; bulgular denetim içindir.",
              "",
              "## Hook sonuçları",
              "",
              "| Hook | Durum |",
              "|---|---|",
          ]
          if hooks:
              for h in hooks:
                  lines.append(f"| {h['name']} | {h['status']} |")
          else:
              lines.append("| (hook sonucu ayrıştırılamadı) | — |")

          lines += ["", "## Bulgular (P0/P1)", ""]
          if findings:
              lines += ["| Öncelik | Bulgu |", "|---|---|"]
              for pri, text in findings:
                  lines.append(f"| {pri} | {text.replace('|', '\\|')} |")
          else:
              lines.append("Bulgu yok — tüm hook'lar geçti.")
          lines += [
              "",
              "## Ham log",
              "",
              "Tam çıktı `precommit.log` dosyasında (bu artifact içinde) saklanır.",
              "",
          ]

          pathlib.Path("logs/PRECOMMIT_RAPORU.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          print(f"PRECOMMIT_RAPORU.md yazıldı: {len(hooks)} hook, {len(findings)} bulgu")

      - name: Upload pre-commit log + findings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precommit-logs
          path: logs/
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # REPRODUCIBILITY BUNDLE
  #
  # Tüm artifact'ları indirir, her dosya için SHA-256 üretir,
  # manifest.txt yazar (github.run_id + github.sha + dosya hash'leri),
  # her şeyi tek bir artifact olarak yükler.
  # ──────────────────────────────────────────────────────────────────────
  reproducibility:
    name: Reproducibility bundle
    runs-on: ubuntu-latest
    needs: [verify, budget, reports, precommit]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ─── 1) Tüm artifact'ları indir ────────────────────────────────────
      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts/
          merge-multiple: true
          pattern: '{verify-report,budget,reports,config,precommit-logs,refs-online}'

      # ─── 2) manifest.txt üret (gen_repro_manifest.py — tek kaynak) ─────────
      - name: Generate reproducibility manifest
        shell: python3 {0}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 _calisma/CIKTI/gen_repro_manifest.py \
            --artifacts-dir all_artifacts \
            --out-dir reproducibility

      # ─── 3) Tek artifact olarak yükle ───────────────────────────────────
      - name: Upload reproducibility bundle
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility
          path: reproducibility/
          retention-days: 90
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # MANIFEST PR COMMENT
  #
  # reproducibility bundle'ındaki manifest.txt içeriğini PR yorumu olarak
  # düşer — gözden geçiren, dosyaları indirmeden her artifact'ın SHA-256
  # özetini yorumda görür. Yalnızca pull_request olayında çalışır; push'ta
  # atlanır (if: github.event_name == 'pull_request').
  # ──────────────────────────────────────────────────────────────────────
  manifest-comment:
    name: Manifest PR comment
    runs-on: ubuntu-latest
    needs: [reproducibility]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download reproducibility bundle
        uses: actions/download-artifact@v4
        with:
          name: reproducibility
          path: reproducibility/

      - name: Post manifest.txt as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reproducibility/manifest.txt';
            if (!fs.existsSync(path)) {
              console.log('manifest.txt yok — yorum atlanıyor');
              return;
            }
            const manifest = fs.readFileSync(path, 'utf8');

            // run_id/sha/ref üst bilgilerini ayrıştır (manifest başlığı)
            const meta = {};
            for (const line of manifest.split('\n')) {
              const m = line.match(/^(github_\w+):\s+(.+)$/);
              if (m) meta[m[1]] = m[2];
            }

            const code = '```text\n' + manifest + '\n```';
            const body = [
              '## 📦 Reproducibility manifest (SHA-256)',
              '',
              'Bu run için üretilen tüm artifact dosyalarının bütünlük özeti:',
              '',
              code,
              '',
              meta.github_run_id
                ? `> Run: [${meta.github_run_id}](${context.payload.repository.html_url}/actions/runs/${meta.github_run_id})`
                : '',
            ].join('\n').trim();

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
