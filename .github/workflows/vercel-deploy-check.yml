name: vercel-deploy-check

on:
  schedule:
    # Aylık: her ayın 1'i 05:23 UTC — canlı Vercel deployment'ının /api
    # adaptörünü repo-DIŞI bir uçtan (curl) doğrular. CI yeşilliği burada
    # yetmez: deploy kendi kendine kırılabilir (statik route, fonksiyon
    # 404'ü, hesap/limit), bu job tam olarak o sınıfı yakalar.
    # Fail-closed: tek bir başarısız uç job'ı kırmızıya çeker; PASS/FAIL
    # özeti $GITHUB_STEP_SUMMARY'a yazılır (sessiz PASS yok).
    - cron: "23 5 1 * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Doğrulanacak deployment kökü (boşsa vars.VERCEL_PREVIEW_URL, o da yoksa canlı alias)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # CI-hijyen: elle-tetikleme + cron çakışması tek koşumda birleşir
  # (eski koşum iptal) — rapor bir-bir yazılır.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-check:
    name: Vercel canlı doğrulama — health + run-history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # checkout YOK: yalnız canlı URL'ye curl atılır, repo içeriğine
      # ihtiyaç yok — action-pin/drift kapılarına takılacak `uses:` yüzeyi
      # bilerek sıfır (en küçük ABI).
      - name: Curl health + run-history (fail-closed)
        env:
          INPUT_URL: ${{ github.event.inputs.base_url }}
          VAR_URL: ${{ vars.VERCEL_PREVIEW_URL }}
        run: |
          set -euo pipefail
          # URL çözümü: elle-girdi > repo variable > bilinen canlı alias.
          # (Aykırı: `vercel link` hesap-düzeyinde 400 ile engelli olduğu için
          # sabit preview alias'ı yok; değişken = elle girilen preview URL.)
          BASE_URL="${INPUT_URL:-${VAR_URL:-https://leibniz2.vercel.app}}"
          BASE_URL="${BASE_URL%/}"
          case "$BASE_URL" in
            https://*|http://*) ;;
            *) echo "::error::Geçersiz BASE_URL: $BASE_URL"; exit 1 ;;
          esac

          REPORT="$(mktemp)"
          fail=0

          # 1) /api/health — birebir "ok" düz-metin (yerel serve_health
          #    sözleşmesi; JSON değil, boşluk-temizliği yapılır).
          if health="$(curl --fail-with-body -sS --max-time 20 "$BASE_URL/api/health" 2>&1)"; then
            if [ "$(printf '%s' "$health" | tr -d '[:space:]')" = "ok" ]; then
              printf -- '- `/api/health`: **PASS** (`ok`)\n' >> "$REPORT"
            else
              fail=1
              printf -- '- `/api/health`: **FAIL** — `ok` beklenen, gelen: `%s`\n' \
                "$(printf '%s' "$health" | head -c 200 | tr -d '\n')" >> "$REPORT"
            fi
          else
            fail=1
            printf -- '- `/api/health`: **FAIL** — curl (ağ/HTTP): %s\n' \
              "$(printf '%s' "$health" | head -c 200 | tr -d '\n')" >> "$REPORT"
          fi

          # 2) /api/run-history — JSON dizi + dolu satır-şeması. Yalnız
          #    "200 + parse" YETMEZ: şema-parite sözleşmesi (ts + verdict
          #    kümesi) canlı uçta da kırılabilir → burada da sınanır.
          #    Beklenen uçlar yalnız 2: health + run-history (istek kapsamı).
          if hist="$(curl --fail-with-body -sS --max-time 30 "$BASE_URL/api/run-history" 2>&1)"; then
            if rowinfo="$(printf '%s' "$hist" | python3 -c 'import json,sys;rows=json.load(sys.stdin);assert isinstance(rows,list) and rows,"bos liste";first=rows[0];assert {"ts","verdict"}<=set(first),"sema eksik: %r"%sorted(first);assert first["verdict"] in {"PASS","FAIL","?"},"verdict gecersiz: %r"%(first["verdict"],);print("%d satir, ilk=%s %s"%(len(rows),first.get("ts"),first["verdict"]))' 2>&1)"; then
              printf -- '- `/api/run-history`: **PASS** (%s)\n' "$rowinfo" >> "$REPORT"
            else
              fail=1
              printf -- '- `/api/run-history`: **FAIL** — şema/geçerlilik: %s\n' \
                "$rowinfo" >> "$REPORT"
            fi
          else
            fail=1
            printf -- '- `/api/run-history`: **FAIL** — curl (ağ/HTTP): %s\n' \
              "$(printf '%s' "$hist" | head -c 200 | tr -d '\n')" >> "$REPORT"
          fi

          # Rapor: her koşumda yazılır; verdict en son bilinir (fail-closed
          # — toplanan fail=1 → exit 1, "tüm adımlar yeşil ama uç ölü" yok).
          {
            printf '## Vercel deploy doğrulama (aylık)\n\n'
            printf -- '- Base: `%s`\n' "$BASE_URL"
            printf -- '- UTC: `%s`\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat "$REPORT"
            printf '\n'
            if [ "$fail" -eq 0 ]; then
              printf '**VERDICT: PASS** — tüm uçlar canlı.\n'
            else
              printf '**VERDICT: FAIL** — en az bir uç doğrulanamadı.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$REPORT"

          if [ "$fail" -ne 0 ]; then
            echo "::error::Vercel deploy doğrulama FAIL — bkz. job summary"
            exit 1
          fi
          echo "VERDICT: PASS — $BASE_URL"
