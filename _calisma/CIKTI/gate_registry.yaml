# gate_registry.yaml — TEK beyan: doğrulama zincirindeki her kapı bir satır.
#
# Bu dosya bir DEKLARASYONdur, türetim değil: `check_gate_registry.py` iki
# yönü de denetler —
#   kayıt → gerçek : burada adı geçen her kapı gerçekten var mı (phantom yok)
#   gerçek → kayıt : gerçek her kapı burada adlandırılmış mı (kapsamsız yok)
# ve alanları türetimle karşılaştırır:
#   ci_jobs.*.severity  ← GATE_EXCLUDE + `if:` (verify.yml)
#   ci_jobs.*.platform  ← runs-on (ubuntu→linux, macos→macos)
#   hooks.*.stage       ← .pre-commit-config.yaml `stages:` (yoksa pre-commit)
#   layers.*.label      ← verify_delivery.py LAYER_LABELS
#   layers.*.blocking   ← _CORE_LAYERS üyeliği (--full'da her zaman koşar)
#
# Kural: kapı eklenince/silinince bu dosya da değişir; kapı fail-closed'dır.
# Doğrulama (salt-okunur, hiçbir şey yazmaz):
#   python3 _calisma/CIKTI/check_gate_registry.py [--json]
# Faz 1 kapsamı: yalnız denetim. Üretim (CI/manifest/doküman) sonraki fazdadır.
