# _calisma/bootstrap_units.conf — bootstrap unit envanteri: TEK KAYNAK.
#
# Bu dosyayı `dev_bootstrap.sh` VE `test_dev_bootstrap.py` ikisi de okur.
# Unit listesi, sırası ve ekranda görünen yolları HİÇBİR yerde kopyalanmaz:
# ölçülen sebep, liste daha önce `UNITS=(...)` dizisi, `unit_path()` case
# tablosu ve iki ayrı test sınıfında elle yazılmıştı — yeni bir unit eklemek
# dört yerden birini unutmayı gerektiriyordu.
#
# Format: bash 3.2 (macOS /bin/bash) ve stdlib-python ile ayrıştırılabilir.
# JSON/TOML DEĞİL — bash'ta hazır ayrıştırıcı yok, bu yüzden düz
# boşlukla ayrılmış alanlar (kelime ayrıştırma).
#
#   <ad> <görünen-yol> <check-türü> <provision-türü>
#
#   ad            Sıra BU DOSYADAKİ satır sırasıdır (bağımlılık sırası).
#                 `check_<ad>`/`provision_<ad>` gibi ayrı fonksiyonlar
#                 YOKTUR: iki genel fonksiyon aşağıdaki türlere bakar.
#   görünen-yol   Etikette gösterilen, $ROOT göreli yol. "hangi dizini
#                 açmam lazım" sorusunun cevabı. Yol olmayan tek birim
#                 `browsers` bunu `venv_z3+chromium` ile tarif eder.
#
#                 DİKKAT: alanlar BOŞLUKLA ayrılır, bu yüzden HİÇBİR alanda
#                 boşluk olamaz. "venv_z3 + chromium" yazmak sessizce alan
#                 sayısını bozuyordu (ölçüldü: "bilinmeyen check türü (+):
#                 browsers"); beşinci alan boş kalmadığı için eksik-alan
#                 denetimi de yakalamıyordu. Artık BEŞİNCİ alanın boş
#                 olması zorunlu — bu yüzden `venv_z3+chromium`.
#   check-türü    --check bu birimin sağlığını NASIL ölçtüğü:
#       venv                <yol>/bin/python çalıştırılabilir VE `pip freeze`
#                           çıktısı PINS dizisiyle birebir eşit (parite).
#       browser             Gerçek bir chromium başlatılabilir (işlevsel
#                           ölçüm; sürüm etiketi değil).
#       resolve:<paket>     Görünen-yolda `node -e require.resolve(<paket>)`.
#       exec:<yol>[,<yol>]  Her $ROOT göreli yol çalıştırılabilir (-x).
#       artifact:<yol>      $ROOT göreli yol dolu (-s).
#   provision-türü Kurulumu ne yapar:
#       venv / npm / browser / prisma / nextbuild
#
# SIRA ÖNEMLİ: `trend_db_codegen` `trend_db` node_modules'ına,
# `dashboard_next_build` hem `dashboard_next` node_modules'ına hem üretilen
# Prisma istemcisine ihtiyaç duyar. Sıra bozulursa kurulum geç reddedilir.
#
# Ölçülen eşleme (hangi unit olmadan hangi test SKIP'e düşer):
#   venv_z3             → deck üretimi (PIL), config şema (jsonschema),
#                         kapı süitleri (yaml), K8 (z3)
#   pptx                → test_pptx_export
#   docx                → docx jeneratör/SKILL testleri
#   dashboard_next      → style/typecheck/ui-contract süitleri
#   trend_db            → test_trend_db_js_runner (`tsx`)
#   video               → test_check_video_typecheck (`tsc`)
#   browsers            → 5 manifest dosyası (keyboard-nav, escaping,
#                         hover-tooltip, cls-budget, cwv-report)
#   trend_db_codegen    → prisma üretilen istemcisi (gitignored)
#   dashboard_next_build→ next build BUILD_ID (gitignored)

venv_z3             _calisma/.venv_z3                venv                     venv
pptx                _calisma/pptx                    resolve:pptxgenjs        npm
docx                _calisma/docx                    resolve:docx            npm
dashboard_next      apps/dashboard-next              exec:apps/dashboard-next/node_modules/.bin/tsc,apps/dashboard-next/node_modules/.bin/next npm
trend_db            apps/trend-db                    exec:apps/trend-db/node_modules/.bin/tsx npm
video               _calisma/video                   exec:_calisma/video/node_modules/.bin/tsc npm
browsers            venv_z3+chromium                 browser                  browser
trend_db_codegen    apps/trend-db/generated          artifact:apps/trend-db/generated/client.ts prisma
dashboard_next_build apps/dashboard-next/.next        artifact:apps/dashboard-next/.next/BUILD_ID nextbuild
