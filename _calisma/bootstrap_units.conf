# Bootstrap unit inventory configuration
# Beklenen unit'ler ve durumları (+ kurulum maliyeti tahminleri).
# dev_bootstrap.sh --check çıktısı bu dosyaya karşı çapraz-doğrulanır
# (check_bootstrap_toolchain.py). Noktalı anahtarlar METADATA'dır, unit değil:
# parseliyiciler yalnız noktasız `ad=durum` satırlarını unit sayar.
#
# YÖNTEM (2026-10-23, bu makine, tek örnek):
# - install_time_s: /tmp'deki boş kopyada GERÇEK kurulumun duvar-saati
#   (venv: 2.65s venv + 4.19s pip; pptx: 0.60s npm ci; dashboard: 5.27s npm ci).
#   Sıcak npm önbelleği — soğuk ağda daha uzun sürer, yukarı yuvarlandı.
# - disk_mb: taze kurulumun `du -sm` karşılığı (venv 120; pptx 8; dash 510).
#   Canlı _calisma/.venv_z3 şu an 269MB (zamanla şişmiş) — plan, kurulum
#   maliyetini gösterir, canlı ağacın o anki boyunu değil.

# Unit: venv_z3 (pinned Z3 solver venv)
venv_z3=ok
venv_z3.install_time_s=7
venv_z3.disk_mb=120

# Unit: pptx (pptxgenjs)
pptx=ok
pptx.install_time_s=1
pptx.disk_mb=8

# Unit: dashboard_next (next + tsc)
dashboard_next=ok
dashboard_next.install_time_s=5
dashboard_next.disk_mb=510
