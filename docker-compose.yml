services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: verify-dashboard:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dashboard-state:/app/state
    restart: on-failure:5
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  dashboard-state:
