# Stoic-Hume V5 — commit öncesi fail-closed doğrulama kapısı.
#
# Kurulum (bir kez):
#   pip install pre-commit
#   pre-commit install
#
# Bu noktadan sonra her `git commit` sırasında aşağıdaki kapılar çalışır:
#   0) update-config          : config'i paket içeriğinden senkron et (gen_config.py)
#                               — repack sayıları değiştirdiyse verify_delivery.config.json'u
#                               otomatik günceller ve stage eder; değişmediyse dokunmaz.
#   1) verify-delivery        : paket bütünlüğü (K1-K7, stdlib-only)
#   2) check-action-pins      : action major sürümlerini pin'ler — downgrade
#                               (ör. checkout@v7 → v6) commit'i bloke eder; yeni
#                               action da pin gerektirir (--update ile ekle).
#   3) check-python3-shell    : `shell: python3 {0}` adımında kabuk komutu kullanımını
#                               bloke eder — run bloğu geçerli Python DEĞİLSE veya
#                               kabuk kalıbı (&&, $VAR, echo, cd, set -e...) içeriyorsa
#                               commit bloke edilir (CI'da geç NameError/SyntaxError
#                               patlamasını commit öncesi yakalar; OFFLINE, stdlib-only).
#   4) verify-delivery-symbolic: Z3 sembolik ispat (z3-solver, izole venv)
#   5) verify-delivery-lean    : Lean 4 reduct-invariance (lean, system)
#   6) check-plist-drift       : plist kapısının exit 0/1/2 davranışını koşan
#                               birim testler (update_preview.sh --plist-check
#                               + check_plist_drift.py) — fake HOME'da koşar,
#                               gerçek LaunchAgents/Caches'a dokunmaz.
#   7) check-repro-manifest    : reproducibility manifest + merge pattern
#                               kapsamını test_gen_repro_manifest.py ile
#                               doğrular (ARTIFACT_JOBS ↔ verify.yml pattern);
#                               artifact pattern'den düşerse commit bloke edilir.
#   8) verify-delivery-repro-manifest: K13 KATMANI — verify_delivery.py
#                               --check-repro-manifest'i koşar: gen_repro_manifest.py
#                               mock artifact'lardan manifest üretir ve her SHA-256'yı
#                               gerçek dosyayla karşılaştırır (fail-closed). Üreticideki
#                               drift/bug her commit'te yakalanır. stdlib-only, OFFLINE.
#   9) verify-delivery-github-scripts: K16 KATMANI — github_scripts/*.js
#                               self-testi: MOCK girdi + çıktı eşleşmesi
#                               senaryoları + scriptPath injection audit
#                               (github_scripts_battery.py + node harness;
#                               audit statik YAML, node gerektirmez). Script
#                               davranışı değişirse bloke.
#   10) commit-msg-style      : başlık denetimi (.gitmessage kuralları) — noise
#                               commit'leri (wip/smoke/test marker/şablon) reddeder.
#                               commit-msg stage'inde; CI --all-files'ta ÇALIŞMAZ.
#   11) check-changelog-sync  : README.md ve docs/PUBLISH_SCENARIO.md'deki
#                               changelog tablolarını git log ile senkron eder
#                               (drift varsa --update + stage — update-config
#                               deseni; commit'in kendi hash'i ancak sonraki
#                               commit'te bilinir, bu yüzden auto-sync yapar).
#   12) check-dryrun-summary  : publish_wrapper.sh `--dry-run-summary`
#                               regresyon kapısı — gen_dryrun_summary
#                               fonksiyonunu gerçek kaynaktan ayıklayıp örnek
#                               logla koşar; markdown üretilemiyorsa bloke.
#   13) check-unit-tests    : birim test kapısı — test listesi ARTIK
#                               manifest'ten (check_unit_tests.list) otomatik
#                               okunur; sync_check_unit_tests.py her commit'te
#                               _calisma/CIKTI/test_*.py'yi tarayıp yeni test
#                               dosyalarını listeye EKLER (elle liste bakımı
#                               yok; ortam-bağımlı testler EXCLUDE ile çıkar).
#                               Biri kırılırsa commit bloke.
#   14) check-coverage-report  : test_coverage_report.py --check ile tüm
#                               test dosyalarının en az bir hook'ta
#                               tanımlandığını doğrular; yeni test dosyası
#                               eklenir ama HOOK_COVERAGE güncellenmezse bloke.
#   15) check-doc-artifact-sync: test_doc_artifact_sync.py —
#                               docs/PUBLISH_SCENARIO.md "Artifact listesi (N):"
#                               ↔ gen_repro_manifest.ARTIFACT_JOBS çapraz
#                               doğrulaması (fail-closed; kardeşi
#                               test_doc_job_sync.py check-unit-tests'te koşar).
#   16) check-mirror-coverage : check_mirror_coverage.py — sync_verify_mirror.sh
#                               --list ↔ repo runtime kümesi (FILES/LEAN_FILES/
#                               COQ_FILES/PREVIEW_FILES/GUIDE_FILES) çapraz
#                               doğrulaması (fail-closed): yeni runtime dosyası
#                               mirror listesine işlenmezse commit bloke (K17
#                               sözleşmesi — CI/launchd rotasıyla aynı kapı).
# Herhangi bir P0/P1 bulgusu commit'i bloke eder (sıfır-dışı exit).
#
# Not: update-config TEK yazan hook'tur (config'i stage eder). Diğer kapılar
# read-only'dir: dosya değiştirmez, yalnızca doğrular (fail-closed).
#
# Manuel çalıştırma:
#   pre-commit run --all-files
#   pre-commit run verify-delivery --files _calisma/CIKTI/TESLIM_KLASOR_V5_2026-08-17.zip
#   pre-commit run verify-delivery-symbolic
#   pre-commit run verify-delivery-lean
#   pre-commit run check-action-pins
#   pre-commit run check-repro-manifest
#   pre-commit run verify-delivery-repro-manifest
#   pre-commit run verify-delivery-github-scripts
#   pre-commit run check-dryrun-summary
#   pre-commit run check-changelog-sync
#   pre-commit run check-unit-tests
#   pre-commit run check-mirror-coverage
#
# update-config hariç hook'lar read-only'dir: dosya değiştirmez, yalnızca
# doğrular (fail-closed). update-config, config'i paket içeriğiyle senkron eder.
repos:
  - repo: local
    hooks:
      - id: update-config
        name: Sync config from package content (gen_config.py)
        description: >-
          Repack sayfa/referans/manifest sayılarını değiştirdiyse
          verify_delivery.config.json'u gen_config.py ile otomatik günceller
          ve stage eder (verify-delivery kapısı her zaman güncel config'i
          görür). Değişiklik yoksa dosyaya dokunmaz. Ortam eksikse (pdfinfo)
          uyarı ile geçer — CI config-drift job'ı orada yakalar.
        entry: bash _calisma/CIKTI/update_config_hook.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: verify-delivery
        name: Verify Stoic-Hume V5 delivery (fail-closed)
        description: >-
          MANIFEST MD5 (18/18) + KLASOR_CHECKSUMLARI + iç zip sidecar +
          3 script byte-for-byte + PDF 33 sayfa + 64 referans. Bulgu varsa
          commit bloke edilir. ÖN-KONTROL (--strict): bağımlılık dosyalarının
          (verify_delivery.py, verify_delivery.config.json + şema, TESLIM
          zipleri + .sha256) stage edilmemiş/untracked değişiklikleri varsa
          hook BLOKE edilir (fail-closed — stage edilen sürümle aynı içerik
          test edilemez; `git add <dosya>` ile stage'leyin).
        entry: python3 _calisma/CIKTI/verify_delivery_hook.py --strict
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-action-pins
        name: Pin action major versions (no downgrade)
        description: >-
          action_pins.json'daki minimum major sürümlerini denetler; bir
          action'ı ESKİ major'a düşürmek (ör. checkout@v7 → v6) commit'i
          bloke eder. Yeni action da pin gerektirir (--update ile ekle).
          Lokal + OFFLINE (ağ/PyYAML yok) — ağ bağımlısı node24 runtime
          denetimi (check_action_runtimes.py) CI'da ayrı koşar.
        entry: python3 _calisma/CIKTI/check_action_pins.py --workflow .github/workflows
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-python3-shell
        name: "Block shell commands under shell: python3 {0}"
        description: >-
          GitHub Actions'ta `shell: python3 {0}` demek `run:` içeriğinin
          Python kodu olduğu anlamına gelir. Altına kabuk komutu yazılırsa
          (cd/&&/|/echo/set -e/$VAR...) iş CI'da geç patlar (SyntaxError /
          NameError). Bu kapı (OFFLINE, stdlib-only) workflow'u ayrıştırır:
          run bloğu geçerli Python DEĞİLSE veya asla-Python-olmayan kabuk
          kalıbı içeriyorsa commit bloke edilir. `;`/`|` (bitwise) Python'da
          geçerli olduğundan bilerek denetlenmez (yanlış pozitif yok).
        entry: python3 _calisma/CIKTI/check_python3_shell.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-absolute-paths
        name: Block absolute user paths (/Users/username, /home/username)
        description: >-
          Commit'teki takip edilen dosyalarda /Users/<kullanıcı>/ veya
          /home/<kullanıcı>/ mutlak yollarını yakalar (/Users/ci ve
          /home/linuxbrew hariç — kanonik portable yollar). .freebuff/
          ve _calisma/TOOLKIT/ atlanır. OFFLINE, stdlib-only.
        entry: bash _calisma/CIKTI/check_absolute_paths.sh
        language: system
        always_run: true
        pass_filenames: true
        stages: [pre-commit]

      - id: actionlint
        name: Lint workflow YAML (actionlint)
        description: >-
          actionlint ile .github/workflows/*.yml'ı statik olarak denetler:
          YAML syntax, ${{ }} expression, action input/ref, job dependency,
          secret/env erişim hatalarını yakalar. Yapışık satır / indentation
          sorunlarını fail-closed olarak commit öncesi bloke eder.
          actionlint binary'si yoksa indirir (ilk koşumda ~2s, sonraki
          koşumlarda cached). OFFLINE, ~1s.
        entry: bash _calisma/CIKTI/lint_actionlint.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: verify-delivery-symbolic
        name: Verify formal core symbolically (Z3, fail-closed)
        description: >-
          symbolic_proof_z3.py — core_section.tex teoremlerinin 12 Z3
          kontrolü (Prop 1, bridge collapse, çift/global karakterizasyon,
          Prop 2 model çifti). Beklenmedik sonuç commit'i bloke eder.
          z3-solver pre-commit tarafından izole bir ortamda otomatik kurulur.
        entry: python3 _calisma/CIKTI/symbolic_proof_z3.py
        language: python
        additional_dependencies: [z3-solver==5.1.0.0]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: verify-delivery-lean
        name: Verify Lean 4 reduct-invariance (fail-closed)
        description: >-
          ReductInvariance.lean — L₀-reduct invariance lemmasının Lean 4
          biçimselleştirilmesi. Tümevarımsal kanıt derlenerek doğrulanır.
          lean (elan) gerektirir; PATH'te veya ~/.elan/bin'de aranır.
        entry: sh _calisma/CIKTI/verify_lean.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-orchestration-stdin
        name: "Require closed stdin for opencode orchestration"
        description: >-
          coordinator_loop.py ve orchestrate_k_dag.py içindeki tüm
          subprocess.run çağrılarının stdin=subprocess.DEVNULL kullandığını
          statik olarak doğrular; stdin açık kalırsa opencode#11891 tipi hang
          riski nedeniyle commit'i fail-closed bloke eder.
        entry: python3 _calisma/CIKTI/check_orchestration_stdin.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-lake-evidence
        name: "Reproduce LEAN_ISPAT_RAPORU §6.3 lake build evidence (smoke)"
        description: >-
          test_lake_evidence_smoke.py — raporun §6.3 "lake build kanıtı"
          bölümündeki çıktıyı HER COMMITTE gerçekten yeniden üretir:
          lake clean && lake build --wfail (fail-closed; exit != 0 veya
          beklenen derleme işareti yoksa commit bloke edilir). Rapor
          format kapısı: kanonik komut satırı + başarı transcript'i +
          v4.14.0 aracı satırı §6.3'te bulunmalıdır. lean/lake kurulu
          değilse testler SKIP eder (kapı yalnızca aracın var olduğu
          ortamda iddia üretir). ~1-5s.
        entry: sh _calisma/CIKTI/lake_evidence_hook.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-status-check-names
        name: "Reject stale branch-protection K1-K14 check names"
        description: >-
          status_checks.py --gh --json çıktısında eski K1-K14 required check
          adlarını tespit eder; K1-K19 kanonik adıyla yeniden adlandırılmamış
          branch protection drift'i fail-closed bloke edilir. GitHub erişimi
          yoksa kapı UNREADABLE sonucunu gizlemez.
        entry: python3 _calisma/CIKTI/status_checks.py --gh --json
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-config-sync
        name: "Verify workflow config snapshot ↔ CONFIG_BASENAMES sync"
        description: >-
          check_config_sync.py: verify.yml "Bundle config snapshot"
          adımında kopyalanan/üretilen her config dosyasının
          gen_repro_manifest.py CONFIG_BASENAMES set'inde tanımlı
          olduğunu doğrular. Drift: yeni dosya eklenir ama
          CONFIG_BASENAMES güncellenmezse → config manifest'ten düşer →
          K10 göremez → sessiz kapsam kaybı. Fail-closed — commit
          bloke edilir. OFFLINE, stdlib-only, ~0.02s.
        entry: python3 _calisma/CIKTI/check_config_sync.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-fallback-evidence
        name: "Verify REFERANS §5.3 fallback evidence (5/5 PASS)"
        description: >-
          ia_ol_fallback_evidence.py --offline ile REFERANS_KANIT_DENETIMI
          §5.3'teki beş fallback kaynağını ağsız ve deterministik biçimde
          yeniden üretir. Sonuç 5/5 PASS değilse commit fail-closed bloke edilir.
        entry: sh _calisma/CIKTI/check_fallback_evidence_hook.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-refs-table-sync
        name: "Verify REFERANS §2 table ↔ code lists (fail-closed)"
        description: >-
          check_refs_table_sync.py: REFERANS_KANIT_DENETIMI.md §2'deki 64
          satırlık ana tabloyu verify_delivery.py REFERENCE_* listelerinin
          key'leriyle birebir karşılaştırır (çapa + 10 açık override, çift
          yönlü bijection). Drift: koda referans eklenir ama tabloya satır
          eklenmez (veya tersi) → sessiz kapsam kaybı → commit bloke edilir.
          OFFLINE, stdlib-only, ~0.05s.
        entry: python3 _calisma/CIKTI/check_refs_table_sync.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-skills-index
        name: "Verify README skills index ↔ skills/"
        description: >-
          skills/*/SKILL.md dosyalarının her biri README Skills tablosunda
          bulunmalı; README'deki bayat skill satırları da fail-closed yakalanır.
        entry: python3 _calisma/CIKTI/check_skills_index.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-workflow-artifact-docs
        name: "Verify upload-artifact ↔ PUBLISH_SCENARIO ↔ ARTIFACT_JOBS"
        description: >-
          verify.yml'deki her upload-artifact adımı aynı commit'te
          PUBLISH_SCENARIO artifact listesinde ve ARTIFACT_JOBS'ta bulunmalı;
          yeni artifact eklenir ama dokümantasyon veya manifest kapsamı
          güncellenmezse commit fail-closed bloke edilir.
        entry: python3 _calisma/CIKTI/check_workflow_artifact_docs.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-doc-artifact-sync
        name: "Verify PUBLISH_SCENARIO artifact list ↔ ARTIFACT_JOBS sync"
        description: >-
          test_doc_artifact_sync.py — docs/PUBLISH_SCENARIO.md "Artifact
          listesi (N):" bölümünü gen_repro_manifest.ARTIFACT_JOBS ile çapraz
          doğrular (fail-closed, test_doc_artifact_sync deseni): manifest
          kapsamındaki her artifact doc'ta VAR olmalı, doc fazlalıkları tam
          olarak bilinen advisory seti olmalı, başlık sayısı ↔ liste birebir.
          Drift (artifact eklenir/çıkarılır ama doc güncellenmez) sessiz
          kapsam kaybı → commit bloke edilir. OFFLINE, stdlib-only, ~0.02s.
        entry: python3 -m unittest _calisma.CIKTI.test_doc_artifact_sync
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-doc-job-sync
        name: "Verify PUBLISH_SCENARIO job table ↔ workflow job names sync"
        description: >-
          test_doc_job_sync.py ile PUBLISH_SCENARIO job tablosundaki adların
          verify.yml ve test-smoke.yml job name alanlarıyla birebir eşleşmesini
          fail-closed doğrular. Yeni veya yeniden adlandırılmış job doc'a
          işlenmezse commit bloke edilir.
        entry: python3 -m unittest _calisma.CIKTI.test_doc_job_sync
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-mirror-coverage
        name: "Mirror coverage check (sync --list ↔ repo runtime)"
        description: >-
          check_mirror_coverage.py — sync_verify_mirror.sh --list kapsamını
          repo runtime dosya kümesiyle karşılaştırır (fail-closed, CI K17 ile
          aynı sözleşme). İleri: mirror'da eksik runtime dosyası (FILES/
          LEAN_FILES/COQ_FILES/PREVIEW_FILES/GUIDE_FILES'e eklenmemiş) →
          exit 1. Ters: listede repo'da olmayan bayat girdi veya beklenen
          kümede olmayan girdi → exit 1. Yeni runtime dosyası eklenip mirror
          listesi güncellenmezse launchd rotası K9/K16/K17/K18/K19 kırılır;
          bu hook o regresyonu commit öncesi yakalar. OFFLINE, stdlib-only.
        entry: python3 _calisma/CIKTI/check_mirror_coverage.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-plist-drift
        name: "Plist gate unit tests (exit 0/1/2)"
        description: >-
          update_preview.sh --plist-check (K12 kapısı) + check_plist_drift.py
          exit 0/1/2 davranışını kapsayan birim testleri koşar
          (0=GÜNCEL/PASS, 1=BAYAT/drift, 2=şablon yok/hata). Fake HOME
          altında koşar — gerçek LaunchAgents/Caches'a dokunmaz, plistlib
          fallback'i sayesinde Linux CI'da da çalışır.
        entry: python3 _calisma/CIKTI/check_plist_drift_hook.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-repro-manifest
        name: "Repro manifest + pattern coverage (fail-closed)"
        description: >-
          test_gen_repro_manifest.py'i koşar: gen_repro_manifest.py'nin
          provenance bölümü (artifact → job) doğru üretilir ve verify.yml'deki
          reproducibility merge pattern'i ARTIFACT_JOBS'ı EKSİKSİZ kapsar.
          Bir artifact pattern'den düşerse (manifest'e girmeden kaybolursa)
          commit bloke edilir. ÖN-KONTROL (--strict): bağımlılık dosyalarının
          (verify.yml, gen_repro_manifest.py, test_gen_repro_manifest.py)
          stage edilmemiş/untracked değişiklikleri varsa hook BLOKE edilir
          (fail-closed — stage edilen sürümle aynı içerik test edilemez;
          `git add <dosya>` ile stage'leyin). stdlib unittest +
          subprocess + git status.
        entry: python3 _calisma/CIKTI/check_repro_manifest_hook.py --strict
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-pattern-consistency
        name: "Verify merge pattern ↔ ARTIFACT_JOBS consistency"
        description: >-
          check_pattern_consistency.py: verify.yml'deki merge-multiple
          pattern'ini ARTIFACT_JOBS ile karşılaştırır. Eksik/fazla artifact
          varsa commit bloke edilir. Drift: birisi pattern'den artifact
          çıkarırsa veya yeni artifact ekleyip pattern'i güncellemezse.
          ÖN-KONTROL (--strict): bağımlılık dosyalarının (verify.yml,
          check_pattern_consistency.py, gen_repro_manifest.py) stage
          edilmemiş/untracked değişiklikleri varsa hook BLOKE edilir
          (fail-closed — stage edilen sürümle aynı içerik test edilemez;
          `git add <dosya>` ile stage'leyin).
        entry: python3 _calisma/CIKTI/check_pattern_consistency_hook.py --strict
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: verify-delivery-github-scripts
        name: "Verify github-scripts self-test (K16, fail-closed)"
        description: >-
          verify_delivery.py --check-github-scripts (K16 katmanı):
          github_scripts_battery.py senaryo setinde (mock REST + çıktı
          eşleşmesi) çıkarılmış github-script'leri MOCK girdiyle gerçek Node'da
          çalıştırır ve çıktı eşleşmesini denetler (REST çağrısı, yorum
          body'si, comment_id, setFailed). Ayrıca scriptPath injection audit'i:
          .github/workflows/*.yml'de `scriptPath:` anahtarı (github-script@v8
          yalnızca 'script' input'unu destekler) fail-closed yakalanır — statik
          YAML denetimi, node gerektirmez. Script'lerin davranışı değişirse
          (refactor/çıkarım hatası) P0/P1 → commit bloke edilir. node gerektirir
          (dev makinesinde mevcut); node yoksa kapı
          P0 verir. OFFLINE, ~2s.
        entry: python3 _calisma/CIKTI/verify_delivery_hook.py --strict --check-github-scripts
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

