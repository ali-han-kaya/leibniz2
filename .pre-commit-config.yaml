# Stoic-Hume V5 — commit öncesi fail-closed doğrulama kapısı.
#
# Kurulum (bir kez):
#   pip install pre-commit
#   pre-commit install
#
# Bu noktadan sonra her `git commit` sırasında dokuz kapı çalışır:
#   0) update-config          : config'i paket içeriğinden senkron et (gen_config.py)
#                               — repack sayıları değiştirdiyse verify_delivery.config.json'u
#                               otomatik günceller ve stage eder; değişmediyse dokunmaz.
#   1) verify-delivery        : paket bütünlüğü (K1-K7, stdlib-only)
#   2) check-action-pins      : action major sürümlerini pin'ler — downgrade
#                               (ör. checkout@v7 → v6) commit'i bloke eder; yeni
#                               action da pin gerektirir (--update ile ekle).
#   3) check-python3-shell    : `shell: python3 {0}` adımında kabuk komutu kullanımını
#                               bloke eder — run bloğu geçerli Python DEĞİLSE veya
#                               kabuk kalıbı (&&, $VAR, echo, cd, set -e...) içeriyorsa
#                               commit bloke edilir (CI'da geç NameError/SyntaxError
#                               patlamasını commit öncesi yakalar; OFFLINE, stdlib-only).
#   4) verify-delivery-symbolic: Z3 sembolik ispat (z3-solver, izole venv)
#   5) verify-delivery-lean    : Lean 4 reduct-invariance (lean, system)
#   6) check-plist-drift       : plist kapısının exit 0/1/2 davranışını koşan
#                               birim testler (update_preview.sh --plist-check
#                               + check_plist_drift.py) — fake HOME'da koşar,
#                               gerçek LaunchAgents/Caches'a dokunmaz.
#   7) check-repro-manifest    : reproducibility manifest + merge pattern
#                               kapsamını test_gen_repro_manifest.py ile
#                               doğrular (ARTIFACT_JOBS ↔ verify.yml pattern);
#                               artifact pattern'den düşerse commit bloke edilir.
#   8) verify-delivery-repro-manifest: K13 KATMANI — verify_delivery.py
#                               --check-repro-manifest'i koşar: gen_repro_manifest.py
#                               mock artifact'lardan manifest üretir ve her SHA-256'yı
#                               gerçek dosyayla karşılaştırır (fail-closed). Üreticideki
#                               drift/bug her commit'te yakalanır. stdlib-only, OFFLINE.
#   9) verify-delivery-github-scripts: K16 KATMANI — github_scripts/*.js
#                               self-testi: 15 senaryoda MOCK girdi + çıktı
#                               eşleşmesi (github_scripts_battery.py + node
#                               harness). Script davranışı değişirse bloke.
#   10) commit-msg-style      : başlık denetimi (.gitmessage kuralları) — noise
#                               commit'leri (wip/smoke/test marker/şablon) reddeder.
#                               commit-msg stage'inde; CI --all-files'ta ÇALIŞMAZ.
# Herhangi bir P0/P1 bulgusu commit'i bloke eder (sıfır-dışı exit).
#
# Not: update-config TEK yazan hook'tur (config'i stage eder). Diğer kapılar
# read-only'dir: dosya değiştirmez, yalnızca doğrular (fail-closed).
#
# Manuel çalıştırma:
#   pre-commit run --all-files
#   pre-commit run verify-delivery --files _calisma/CIKTI/TESLIM_KLASOR_V5_2026-08-17.zip
#   pre-commit run verify-delivery-symbolic
#   pre-commit run verify-delivery-lean
#   pre-commit run check-action-pins
#   pre-commit run check-repro-manifest
#   pre-commit run verify-delivery-repro-manifest
#   pre-commit run verify-delivery-github-scripts
#
# update-config hariç hook'lar read-only'dir: dosya değiştirmez, yalnızca
# doğrular (fail-closed). update-config, config'i paket içeriğiyle senkron eder.
repos:
  - repo: local
    hooks:
      - id: update-config
        name: Sync config from package content (gen_config.py)
        description: >-
          Repack sayfa/referans/manifest sayılarını değiştirdiyse
          verify_delivery.config.json'u gen_config.py ile otomatik günceller
          ve stage eder (verify-delivery kapısı her zaman güncel config'i
          görür). Değişiklik yoksa dosyaya dokunmaz. Ortam eksikse (pdfinfo)
          uyarı ile geçer — CI config-drift job'ı orada yakalar.
        entry: bash _calisma/CIKTI/update_config_hook.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: verify-delivery
        name: Verify Stoic-Hume V5 delivery (fail-closed)
        description: >-
          MANIFEST MD5 (18/18) + KLASOR_CHECKSUMLARI + iç zip sidecar +
          3 script byte-for-byte + PDF 33 sayfa + 64 referans. Bulgu varsa
          commit bloke edilir.
        entry: python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-action-pins
        name: Pin action major versions (no downgrade)
        description: >-
          action_pins.json'daki minimum major sürümlerini denetler; bir
          action'ı ESKİ major'a düşürmek (ör. checkout@v7 → v6) commit'i
          bloke eder. Yeni action da pin gerektirir (--update ile ekle).
          Lokal + OFFLINE (ağ/PyYAML yok) — ağ bağımlısı node24 runtime
          denetimi (check_action_runtimes.py) CI'da ayrı koşar.
        entry: python3 _calisma/CIKTI/check_action_pins.py --workflow .github/workflows/verify.yml
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-python3-shell
        name: "Block shell commands under shell: python3 {0}"
        description: >-
          GitHub Actions'ta `shell: python3 {0}` demek `run:` içeriğinin
          Python kodu olduğu anlamına gelir. Altına kabuk komutu yazılırsa
          (cd/&&/|/echo/set -e/$VAR...) iş CI'da geç patlar (SyntaxError /
          NameError). Bu kapı (OFFLINE, stdlib-only) workflow'u ayrıştırır:
          run bloğu geçerli Python DEĞİLSE veya asla-Python-olmayan kabuk
          kalıbı içeriyorsa commit bloke edilir. `;`/`|` (bitwise) Python'da
          geçerli olduğundan bilerek denetlenmez (yanlış pozitif yok).
        entry: python3 _calisma/CIKTI/check_python3_shell.py --workflow .github/workflows/verify.yml
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-absolute-paths
        name: Block absolute user paths (/Users/username, /home/username)
        description: >-
          Commit'teki takip edilen dosyalarda /Users/<kullanıcı>/ veya
          /home/<kullanıcı>/ mutlak yollarını yakalar (/Users/ci ve
          /home/linuxbrew hariç — kanonik portable yollar). .freebuff/
          ve _calisma/TOOLKIT/ atlanır. OFFLINE, stdlib-only.
        entry: sh _calisma/CIKTI/check_absolute_paths.sh
        language: system
        always_run: true
        pass_filenames: true
        stages: [pre-commit]

      - id: actionlint
        name: Lint workflow YAML (actionlint)
        description: >-
          actionlint ile .github/workflows/*.yml'ı statik olarak denetler:
          YAML syntax, ${{ }} expression, action input/ref, job dependency,
          secret/env erişim hatalarını yakalar. Yapışık satır / indentation
          sorunlarını fail-closed olarak commit öncesi bloke eder.
          actionlint binary'si yoksa indirir (ilk koşumda ~2s, sonraki
          koşumlarda cached). OFFLINE, ~1s.
        entry: sh _calisma/CIKTI/lint_actionlint.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: verify-delivery-symbolic
        name: Verify formal core symbolically (Z3, fail-closed)
        description: >-
          symbolic_proof_z3.py — core_section.tex teoremlerinin 12 Z3
          kontrolü (Prop 1, bridge collapse, çift/global karakterizasyon,
          Prop 2 model çifti). Beklenmedik sonuç commit'i bloke eder.
          z3-solver pre-commit tarafından izole bir ortamda otomatik kurulur.
        entry: python3 _calisma/CIKTI/symbolic_proof_z3.py
        language: python
        additional_dependencies: [z3-solver==5.1.0.0]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: verify-delivery-lean
        name: Verify Lean 4 reduct-invariance (fail-closed)
        description: >-
          ReductInvariance.lean — L₀-reduct invariance lemmasının Lean 4
          biçimselleştirilmesi. Tümevarımsal kanıt derlenerek doğrulanır.
          lean (elan) gerektirir; PATH'te veya ~/.elan/bin'de aranır.
        entry: sh _calisma/CIKTI/verify_lean.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-plist-drift
        name: "Plist gate unit tests (exit 0/1/2)"
        description: >-
          update_preview.sh --plist-check (K12 kapısı) + check_plist_drift.py
          exit 0/1/2 davranışını kapsayan birim testleri koşar
          (0=GÜNCEL/PASS, 1=BAYAT/drift, 2=şablon yok/hata). Fake HOME
          altında koşar — gerçek LaunchAgents/Caches'a dokunmaz, plistlib
          fallback'i sayesinde Linux CI'da da çalışır.
        entry: python3 -m unittest discover -s _calisma/CIKTI -p "test_plist_gate_exit.py"
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: check-repro-manifest
        name: "Repro manifest + pattern coverage (fail-closed)"
        description: >-
          test_gen_repro_manifest.py'i koşar: gen_repro_manifest.py'nin
          provenance bölümü (artifact → job) doğru üretilir ve verify.yml'deki
          reproducibility merge pattern'i ARTIFACT_JOBS'ı EKSİKSİZ kapsar.
          Bir artifact pattern'den düşerse (manifest'e girmeden kaybolursa)
          commit bloke edilir. stdlib unittest + subprocess.
        entry: python3 -m unittest discover -s _calisma/CIKTI -p "test_gen_repro_manifest.py"
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: verify-delivery-github-scripts
        name: "Verify github-scripts self-test (K16, fail-closed)"
        description: >-
          verify_delivery.py --check-github-scripts (K16 katmanı):
          github_scripts_battery.py 15 senaryoda çıkarılmış github-script'leri
          MOCK girdiyle gerçek Node'da çalıştırır ve çıktı eşleşmesini denetler
          (REST çağrısı, yorum body'si, comment_id, setFailed). Script'lerin
          davranışı değişirse (refactor/çıkarım hatası) P0/P1 → commit bloke
          edilir. node gerektirir (dev makinesinde mevcut); node yoksa kapı
          P0 verir. OFFLINE, ~2s.
        entry: python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI --check-github-scripts
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: verify-delivery-repro-manifest
        name: "Verify repro-manifest producer (K13, fail-closed)"
        description: >-
          verify_delivery.py --check-repro-manifest (K13 katmanı):
          gen_repro_manifest.py'yi bilinen içerikli mock artifact'larla koşar,
          üretilen manifest.json'daki her SHA-256'yı gerçek dosyayla yeniden
          hash'leyerek karşılaştırır. Eksik kayıt / yanlış hash / üretilemeyen
          manifest → P0/P1 → commit bloke edilir (reproducibility zinciri
          her commit'te doğrulanır). stdlib-only, OFFLINE, saniyeler sürer.
          (Not: repro-manifest katmanı verify_delivery.py'de K13'tür; K12
          plist kapısıdır — o, check-plist-drift hook'unca kapsanır.)
        entry: python3 _calisma/CIKTI/verify_delivery.py --dir _calisma/CIKTI --check-repro-manifest
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: shellcheck-hooks
        name: Lint shell hooks (shellcheck, POSIX/bash)
        description: >-
          verify_lean.sh, commit_msg_hook.sh (POSIX sh) ve
          update_config_hook.sh (bash) betiklerini shellcheck ile
          denetler — dash uyumluluğu, glob hataları, regex sorunları.
          CI'da continue-on-error ile advisory olarak da çalışır.
        entry: bash _calisma/CIKTI/shellcheck_hooks.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: commit-msg-style
        name: Commit message style (noise prevention)
        description: >-
          .gitmessage kurallarını uygular: başlık '<kapsam>: <eylem>'
          formatında ve ≤72 karakter olmalı; wip/smoke/test marker/şablon
          placeholder'ı gibi noise başlıklar commit'i BLOKE EDER.
          commit-msg stage'inde çalışır (CI --all-files'ta değil).
          Kurulum: pre-commit install --hook-type commit-msg
        entry: sh _calisma/CIKTI/commit_msg_hook.sh
        language: system
        # commit-msg stage'inde pre-commit mesaj dosyasını $1 olarak geçer;
        # pass_filenames true olmalı (always_run bu geçişi ezer — kullanma).
        pass_filenames: true
        stages: [commit-msg]
        verbose: true
